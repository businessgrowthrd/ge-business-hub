function dayPlan(day){

function companiesForPlan(province,city){return scopedCompanies().filter(c=>{const cCity=normalizeCity(c.city), cProv=provinceForCity(c.city);if(city)return cCity===normalizeCity(city);if(province)return cProv===province;return true})}
function provinceForCity(city){for(const [p,arr] of Object.entries(RD_CATALOG)){if(arr.some(c=>normalizeCity(c)===normalizeCity(city)))return p}return ''}
function normalizeCity(v){return String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim()}
function savePlanFromDom(silent=false){const plans={...state.plans};DAYS.forEach(day=>{const province=document.querySelector('[data-plan-province="'+day+'"]')?.value||'';const city=document.querySelector('[data-plan-city="'+day+'"]')?.value||'';const available=companiesForPlan(province,city).map(c=>c.id);const box=document.querySelector('[data-plan-companies="'+day+'"]');const sel=[...(box?.querySelectorAll('[data-plan-check]:checked')||[])].map(o=>o.value).filter(id=>available.includes(id));plans[day]={province,city,companyIds:sel}});setState({plans});if(!silent)toast('Planificación guardada','ok')}
function salesUnits(companyId,days){const since=days?Date.now()-days*86400000:0;return state.sales.filter(s=>s.companyId===companyId&&(!days||new Date(s.date+'T00:00:00').getTime()>=since)).reduce((a,s)=>a+num(s.total),0)}
function visitCount(companyId,days){const since=days?Date.now()-days*86400000:0;return state.visits.filter(v=>v.companyId===companyId&&(!days||new Date(v.date+'T00:00:00').getTime()>=since)).length}
function planCompanyScore(c){const overdue=Math.min(daysSince(c.lastVisit),180);const sales90=salesUnits(c.id,90);const visits90=visitCount(c.id,90);const satisfactionGap=Math.max(0,80-num(c.satisfaction));return priorityScore(c.priority)*28+overdue*1.15+Math.min(sales90,160)*0.32+satisfactionGap*1.4-(visits90*5)}
function routeStartForPlan(plan,companies){const owner=state.settings.owner==='all'?'hemocura':state.settings.owner;const branch=(state.branches||[]).find(b=>b.active&&b.owner===owner&&normalizeCity(b.city)===normalizeCity(plan.city))||(state.branches||[]).find(b=>b.active&&normalizeCity(b.city)===normalizeCity(plan.city));if(branch){const near=companies.find(c=>c.lat&&c.lng&&normalizeCity(c.city)===normalizeCity(branch.city));if(near)return {lat:near.lat,lng:near.lng,label:branch.label||branch.name}}const pts=companies.filter(c=>c.lat&&c.lng);if(pts.length)return {lat:pts.reduce((a,c)=>a+Number(c.lat),0)/pts.length,lng:pts.reduce((a,c)=>a+Number(c.lng),0)/pts.length,label:'Centro geográfico de la selección'};return {lat:19.451,lng:-70.697,label:'Santiago base'} }
function optimizeRoute(ids,plan={}){const companies=ids.map(company).filter(Boolean);let remaining=companies.filter(c=>c.lat&&c.lng).map(c=>({...c,_score:planCompanyScore(c),_sales90:salesUnits(c.id,90),_salesAll:salesUnits(c.id)}));let current=routeStartForPlan(plan,remaining), time=8*60, out=[];while(remaining.length){remaining.sort((a,b)=>routeRank(a,current)-routeRank(b,current));const next=remaining.shift();const km=dist(current,next);const move=Math.ceil(km/32*60)+8;time+=move;out.push({company:next,km,move,arrival:minToTime(time),overdue:daysSince(next.lastVisit),sales90:next._sales90,salesAll:next._salesAll,score:Math.round(next._score-(km*1.5))});time+=35;current=next}const noCoords=companies.filter(c=>!c.lat||!c.lng);return {start,out,noCoords}}
function routeRank(c,current){const km=dist(current,c);return km*2.2 - Math.min(daysSince(c.lastVisit),180)*0.16 - priorityScore(c.priority)*7 - Math.min(salesUnits(c.id,90),160)*0.05 + (c.satisfaction<75?-10:0)} function dist(a,b){const R=6371, dLat=(Number(b.lat)-Number(a.lat))*Math.PI/180, dLng=(Number(b.lng)-Number(a.lng))*Math.PI/180, la1=Number(a.lat)*Math.PI/180, la2=Number(b.lat)*Math.PI/180;const h=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;return R*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h))} function minToTime(m){return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function routeOutput(){let html='';DAYS.forEach(day=>{const p=state.plans[day];if(!p||!p.companyIds?.length)return;const result=optimizeRoute(p.companyIds,p);const totalKm=result.out.reduce((a,r)=>a+r.km,0);html+='<h4>'+day+' · '+esc(p.province||provinceForCity(p.city)||'RD')+' · '+esc(p.city||'Sin ciudad')+'</h4><div class="slot"><b>Salida sugerida:</b> '+esc(result.start.label)+' · <b>Distancia total aprox.:</b> '+totalKm.toFixed(1)+' km · <b>Destinos con coordenadas:</b> '+result.out.length+'</div><div class="timeline">'+result.out.map((r,i)=>'<div class="tl"><b>'+r.arrival+' · '+esc(r.company.name)+'</b><div class="meta">Orden '+(i+1)+' · '+r.km.toFixed(1)+' km · '+r.move+' min traslado · '+r.overdue+' días sin visita · ventas 90d '+r.sales90+' uds · score '+r.score+'</div></div>').join('')+'</div>';if(result.noCoords.length)html+='<div class="item"><b>Sin coordenadas para mapa/ruta</b><div class="meta">'+result.noCoords.map(c=>esc(c.name)).join(' · ')+'</div></div>'});return html||'<div class="empty">Selecciona provincia, ciudad y destinos para generar una ruta.</div>'}



function normDoc(v){return String(v||'').replace(/[^0-9A-Za-z]/g,'').toUpperCase()}
function delay(ms=0){return new Promise(resolve=>setTimeout(resolve,ms))}
function findCompanyByRnc(rnc){const key=normDoc(rnc);return key?state.companies.find(c=>normDoc(c.rnc)===key):null}

/* Ventas + CRM Service Layer: reglas de negocio separadas del DOM */
const SalesCrmService={
  validateRnc(value){
    const cleanDoc=normDoc(value);
    if(!cleanDoc)return {ok:false,level:'error',message:'RNC/Cédula requerido para prevenir duplicados.'};
    if(cleanDoc.length<9||cleanDoc.length>11)return {ok:false,level:'error',message:'Formato inválido. Usa 9 dígitos para RNC o 11 para cédula.'};
    if(!/^\d+$/.test(cleanDoc))return {ok:false,level:'error',message:'Usa solo números en RNC/Cédula.'};
    const duplicated=findCompanyByRnc(cleanDoc);
    if(duplicated)return {ok:true,level:'warn',duplicate:duplicated,message:'Ya existe en CRM: '+duplicated.name+'. Se vinculará automáticamente.'};
    return {ok:true,level:'ok',message:'Documento válido y disponible para nuevo cliente.'};
  },
  validateEmail(value){
    const email=clean(value||'');
    return !email||/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  },
  buildClientPayload(formData){
    const name=clean(formData.name||'');
    const rnc=clean(formData.rnc||'');
    const phone=clean(formData.phone||'');
    const email=clean(formData.email||'');
    if(!name)throw new Error('Nombre/Razón Social requerido.');
    const rncStatus=this.validateRnc(rnc);
    if(!rncStatus.ok)throw new Error(rncStatus.message);
    if(!this.validateEmail(email))throw new Error('Email inválido.');
    return {name,rnc,phone,email};
  },
  async upsertClient(payload){
    await delay(120);
    const docStatus=this.validateRnc(payload.rnc);
    if(docStatus.duplicate)return {company:docStatus.duplicate,created:false};
    const owner=state.settings.owner==='all'?'hemocura':state.settings.owner;
    const now=new Date().toISOString();
    const rec={
      id:uid('c'),owner,
      name:payload.name,rnc:payload.rnc,
      category:'Salud',type:'Salud',sector:'Centro médico / cliente de hemoderivados',
      city:'Sin ciudad',employees:null,beds:null,contact:'',phone:payload.phone,email:payload.email,
      address:'',lat:null,lng:null,priority:'media',status:DEFAULT_COMPANY_STAGE,satisfaction:80,lastVisit:'',
      origen:'Ventana_Ventas',fecha_registro:now,
      notes:'Creado desde Ventas para vinculación automática CRM/Ventas. Origen: Ventana_Ventas. Fecha registro: '+now
    };
    setState({companies:[...state.companies,rec]});
    return {company:rec,created:true};
  }
};

function weekKey(date){const d=new Date(date+'T00:00:00');if(isNaN(d))return 'Sin fecha';const tmp=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=tmp.getUTCDay()||7;tmp.setUTCDate(tmp.getUTCDate()+4-day);const yearStart=new Date(Date.UTC(tmp.getUTCFullYear(),0,1));const week=Math.ceil((((tmp-yearStart)/86400000)+1)/7);return tmp.getUTCFullYear()+'-S'+String(week).padStart(2,'0')}

async function syncUp(){try{const {gistId,gistToken}=state.settings;if(!gistId||!gistToken)throw new Error('Configura Gist ID y token');const body={files:{'ge-business-hub-pro-db.json':{content:JSON.stringify(state,null,2)}}};const res=await fetch('https://api.github.com/gists/'+gistId,{method:'PATCH',headers:{Authorization:'Bearer '+gistToken,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!res.ok)throw new Error('GitHub API '+res.status);toast('Sincronizado hacia Gist','ok')}catch(e){console.error(e);toast(e.message,'error')}}
async function syncDown(){try{const {gistId,gistToken}=state.settings;if(!gistId||!gistToken)throw new Error('Configura Gist ID y token');const res=await fetch('https://api.github.com/gists/'+gistId,{headers:{Authorization:'Bearer '+gistToken}});if(!res.ok)throw new Error('GitHub API '+res.status);const gist=await res.json();const file=gist.files['ge-business-hub-pro-db.json']||Object.values(gist.files)[0];const data=JSON.parse(file.content);state=data;localStorage.setItem(STORE,JSON.stringify(state));location.reload()}catch(e){console.error(e);toast(e.message,'error')}}

function bindCompanyImporter(){const zone=document.getElementById('companyImportZone');const input=document.getElementById('companyImportFile');if(!zone||!input||zone.dataset.bound)return;zone.dataset.bound='1';input.addEventListener('change',ev=>{const file=ev.target.files&&ev.target.files[0];if(file)handleCompanyImportFile(file);input.value=''});zone.addEventListener('dragover',ev=>{ev.preventDefault();zone.classList.add('drag')});zone.addEventListener('dragleave',()=>zone.classList.remove('drag'));zone.addEventListener('drop',ev=>{ev.preventDefault();zone.classList.remove('drag');const file=ev.dataTransfer&&ev.dataTransfer.files&&ev.dataTransfer.files[0];if(file)handleCompanyImportFile(file)});zone.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();input.click()}})}
async function handleCompanyImportFile(file){try{if(!file.name.toLowerCase().endsWith('.json'))throw new Error('El archivo debe tener extensión .json');const text=await file.text();let payload;try{payload=JSON.parse(text)}catch(e){throw new Error('JSON inválido: '+e.message)}const rows=extractCompanyRows(payload);const result=validateAndNormalizeCompanies(rows);if(result.errors.length&&!result.records.length){showImportErrors(result.errors,result.total);return}const merged=mergeCompanies(result.records);setState({companies:merged.companies});let warnHtml=result.warnings.length?'<hr><p class="note"><b>Advertencias de calidad de datos:</b> '+result.warnings.length+'. La importación continuó usando valores seguros. Revisa los primeros avisos:</p><div class="import-error-list"><ul>'+result.warnings.slice(0,60).map(e=>'<li>'+esc(e)+'</li>').join('')+'</ul></div>':'';if(result.errors.length)warnHtml+='<p class="note">Filas omitidas por estructura inválida: '+esc(result.errors.length)+'</p>';openModal('Importación completada','<div class="import-summary"><div class="mini"><b>'+merged.added+'</b><span>Nuevas</span></div><div class="mini"><b>'+merged.updated+'</b><span>Actualizadas</span></div><div class="mini"><b>'+result.records.length+'</b><span>Importadas</span></div><div class="mini"><b>'+result.warnings.length+'</b><span>Advertencias</span></div></div><p class="note">La base central de Empresas fue actualizada. Los datos faltantes se completaron con valores por defecto seguros y los campos operativos disponibles alimentan CRM, mapa, rutas y BI.</p>'+warnHtml,'<button class="btn primary" data-close>Continuar</button>');toast('Importación de empresas completada','ok')}catch(err){console.error(err);toast(err.message,'error');openModal('No se pudo importar','<p class="note">La base de datos no fue modificada.</p><div class="import-error-list"><ul><li>'+esc(err.message)+'</li></ul></div>','<button class="btn primary" data-close>Entendido</button>')}}
function extractCompanyRows(payload){if(Array.isArray(payload))return payload;const keys=['companies','empresas','prospects','prospectos','clientes','customers','data'];for(const k of keys){if(Array.isArray(payload&&payload[k]))return payload[k]}if(payload&&payload.db){for(const k of keys){if(Array.isArray(payload.db[k]))return payload.db[k]}}throw new Error('Estructura no reconocida. Usa un arreglo directo o una propiedad como companies, empresas, prospects, clientes o data.')} 
function validateAndNormalizeCompanies(rows){const errors=[],warnings=[],records=[];if(!Array.isArray(rows)||!rows.length){errors.push('El archivo no contiene registros para importar.');return{errors,warnings,records,total:0}}rows.forEach((row,i)=>{if(!row||typeof row!=='object'||Array.isArray(row)){errors.push('Fila '+(i+1)+': registro omitido porque no es un objeto JSON.');return}const rec=normalizeCompanyRecord(row,i,warnings);if(rec)records.push(rec)});if(!records.length&&!errors.length)errors.push('No se encontró ningún registro utilizable.');return{errors,warnings,records,total:rows.length||0}}
function normalizeImportKey(k){return String(k||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[\s_\-\.]/g,'')}
function rowAccessor(r){const idx={};Object.keys(r||{}).forEach(k=>{idx[normalizeImportKey(k)]=k});return (...keys)=>{for(const k of keys){const real=idx[normalizeImportKey(k)];if(real!==undefined&&r[real]!==undefined&&r[real]!==null&&String(r[real]).trim()!=='')return r[real]}return ''}}
function optionalNumber(v,label){if(v===undefined||v===null||String(v).trim()==='')return null;const n=Number(String(v).replace(/,/g,''));return Number.isFinite(n)&&n>=0?n:null}

function normalizeEmailForImport(v,warnings,rowNum){let raw=String(v||'').trim();if(!raw)return {email:'',notes:''};raw=raw.replace(/\s+@\s+/g,'@').replace(/\s+\.\s+/g,'.').replace(/[<>;,]+$/g,'');const candidates=raw.split(/[\/|;,\s]+/).map(x=>x.trim()).filter(Boolean);let valid='';const extras=[];for(let c of candidates){c=c.replace(/^mailto:/i,'').replace(/[()<>\[\],;]+/g,'').trim();c=c.replace(/@gmail$/i,'@gmail.com').replace(/@gmail\.$/i,'@gmail.com').replace(/@gmail\.con$/i,'@gmail.com').replace(/@gmail\.co$/i,'@gmail.com').replace(/@gm$/i,'@gmail.com').replace(/@gm\.$/i,'@gmail.com').replace(/\.gm$/i,'.gmail.com').replace(/\.gmail$/i,'.gmail.com');if(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c)){if(!valid)valid=c;else extras.push(c)}else if(c&&/[a-z0-9]/i.test(c)){extras.push(c)}}if(raw&&!valid){warnings.push('Fila '+rowNum+': Email no válido movido a Notas.');return {email:'',notes:'Email original: '+raw}}if(extras.length){warnings.push('Fila '+rowNum+': email secundario/texto extra movido a Notas.');return {email:valid,notes:'Email secundario o texto en Email: '+extras.join(' / ')}}return {email:valid,notes:''}}
function normalizeCompanyRecord(r,index,warnings){const rowNum=index+1;const get=rowAccessor(r);let name=clean(get('Nombre','name','nombre','empresa','cliente','razonSocial','razón social','company'));const rawTipo=get('Tipo','type','tipo','clasificacion','clasificación','categoria','categoría','tipoEmpresa','tipo_empresa');const sector=clean(get('Sector','sector','industria','industry','actividad','rubro'));const employees=parseOptionalNumber(get('Empleados','employees','empleados','cantidadEmpleados','cantidad_empleados'),'Empleados',warnings,rowNum);const beds=parseOptionalNumber(get('Camas','beds','camas','cantidadCamas','cantidad_camas'),'Camas',warnings,rowNum);let category=normalizeCategory(rawTipo)||normalizeCategory(sector)||inferCategory({...r,sector,tipo:rawTipo,camas:beds});if(beds&&beds>0&&!normalizeCategory(rawTipo))category='Salud';if(!CATS.includes(category)){category='Servicios';warnings.push('Fila '+rowNum+': Tipo/clasificación faltante o no detectable. Se asignó Servicios.')}const type=clean(rawTipo)||category;const contact=clean(get('Contacto','contact','contacto','representante','responsable','tomadorDecision','tomador_decision','personaContacto','persona_contacto'));const phone=clean(get('Teléfono','Telefono','phone','telefono','teléfono','tel','celular','whatsapp'));const emailInfo=normalizeEmailForImport(get('Email','email','correo','mail','correoElectronico','correo_electronico'),warnings,rowNum);const email=emailInfo.email;const address=clean(get('Dirección','Direccion','address','direccion','dirección','ubicacion','ubicación'));if(!name){const fallback=email||phone||contact||address;name=fallback?('Registro sin nombre - '+String(fallback).slice(0,44)):('Registro sin nombre #'+rowNum);warnings.push('Fila '+rowNum+': falta Nombre. Se creó identificador temporal: '+name+'.')}if(!phone&&!email&&!contact&&!address){warnings.push('Fila '+rowNum+': no tiene Teléfono, Email, Contacto ni Dirección. Se importó como prospecto incompleto para completar luego.')}const lat=parseCoordinate(get('Latitud','latitude','latitud','lat'),'Latitud',warnings,rowNum), lng=parseCoordinate(get('Longitud','longitude','longitud','lng','lon','long'),'Longitud',warnings,rowNum);let priority=String(get('Prioridad','priority','prioridad')).toLowerCase().trim();if(!['alta','media','baja'].includes(priority)){if(priority)warnings.push('Fila '+rowNum+': Prioridad inválida. Se asignó media.');priority='media'}const owner=normalizeOwner(get('owner','unidad','empresaInterna','empresa_interna','marca'))||((state.settings.owner&&state.settings.owner!=='all')?state.settings.owner:'hemocura');const city=clean(get('Ciudad','city','ciudad','municipio'))||'Sin ciudad';if(city==='Sin ciudad')warnings.push('Fila '+rowNum+': falta Ciudad. Se asignó Sin ciudad.');let notes=[clean(get('Notas','notes','notas','observaciones','comentarios')),emailInfo.notes].filter(Boolean).join(' | ');return{id:clean(get('id','companyId','company_id','prospectId','clienteId'))||uid('c'),owner,name,category,type,sector,city,employees,beds,contact,phone,email,address,lat,lng,priority,status:normalizeCompanyStage(get('Tipificación','Tipificacion','tipificacion','tipificación','status','estatus','estado','etapa','fase')),satisfaction:num(get('satisfaction','satisfaccion','satisfacción','score'))||80,lastVisit:clean(get('lastVisit','ultimaVisita','última visita','fechaUltimaVisita'))||'',notes}}
function normalizeCategory(v){const s=String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');if(!s)return '';if(/fabril|manufact|industr|textil|constru|agro|bebida|cement|acero/.test(s))return 'Fabriles';if(/servicio|financ|banca|seguro|consult|tecn|logist|transporte/.test(s))return 'Servicios';if(/retail|super|mercado|tienda|distrib|comercio|almacen/.test(s))return 'Retail';if(/salud|hospital|clinica|medic|centro|ars|farm|laboratorio|dispensario/.test(s))return 'Salud';if(/ong|gobierno|ayuntamiento|educacion|universidad|fundacion|institucion|public/.test(s))return 'ONG';return CATS.find(c=>c.toLowerCase()===s)||''}
function inferCategory(r){if(Number(r.camas||r.beds||0)>0)return 'Salud';return normalizeCategory([r.Sector,r.sector,r.industria,r.Tipo,r.tipo,r.Nombre,r.nombre,r.name,r.Dirección,r.direccion,r.address].filter(Boolean).join(' '))||'Servicios'}
function normalizeOwner(v){const s=String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'');if(!s)return '';if(s.includes('hemo'))return 'hemocura';if(s.includes('farma'))return 'farmaserv';if(s.includes('sofa'))return 'sofa';if(s.includes('equil'))return 'equilibrium';if(s.includes('infec'))return 'infecq';return ''}
function mergeCompanies(records){const current=state.companies.slice();let added=0,updated=0;const keyOf=c=>(String(c.name||'').toLowerCase().trim()+'|'+String(c.city||'').toLowerCase().trim());records.forEach(rec=>{let idx=current.findIndex(c=>c.id===rec.id);if(idx<0&&rec.email)idx=current.findIndex(c=>c.email&&c.email.toLowerCase()===rec.email.toLowerCase());if(idx<0&&rec.phone)idx=current.findIndex(c=>c.phone&&c.phone.replace(/\D/g,'')===rec.phone.replace(/\D/g,''));if(idx<0)idx=current.findIndex(c=>keyOf(c)===keyOf(rec));if(idx>=0){current[idx]={...current[idx],...rec,id:current[idx].id,notes:[current[idx].notes,rec.notes].filter(Boolean).join(' | ')};updated++}else{current.push(rec);added++}});return{companies:current,added,updated}}

function bind(){document.addEventListener('click',globalClick,{once:true});document.addEventListener('change',globalChange,{once:true});document.addEventListener('input',globalInput,{once:true})}
function globalClick(e){const t=e.target.closest('button,a');if(!t)return bind();try{if(t.dataset.openMenu!==undefined){document.body.classList.add('menu-open')}else if(t.dataset.closeMenu!==undefined){document.body.classList.remove('menu-open')}else if(t.dataset.view){document.body.classList.remove('menu-open');state.settings.view=t.dataset.view;schedule()}else if(t.dataset.browseCompanyImport!==undefined)document.getElementById('companyImportFile')?.click();else if(t.dataset.downloadCompanyTemplate!==undefined)downloadCompanyTemplate();else if(t.dataset.exportCompanies!==undefined)downloadJson(state.companies,'empresas-ge-business-hub.json');else if(t.dataset.newCompany!==undefined)openCompanyForm();else if(t.dataset.newBranch!==undefined)openBranchForm();else if(t.dataset.editBranch)openBranchForm(t.dataset.editBranch);else if(t.dataset.saveBranch!==undefined)saveBranch(t.dataset.saveBranch);else if(t.dataset.editCompany)openCompanyForm(t.dataset.editCompany);else if(t.dataset.saveCompany!==undefined)saveCompany(t.dataset.saveCompany);else if(t.dataset.close!==undefined)closeModal();else if(t.dataset.companyCrm){state.settings.companyId=t.dataset.companyCrm;state.settings.view='crm';schedule()}else if(t.dataset.companyForms){state.settings.companyId=t.dataset.companyForms;state.settings.view='forms';schedule()}else if(t.dataset.companyRoute){state.settings.companyId=t.dataset.companyRoute;state.settings.view='planning';const c=company(t.dataset.companyRoute);if(c){state.plans['Lunes']={city:c.city,companyIds:[c.id]}}schedule()}else if(t.dataset.companySale){state.settings.companyId=t.dataset.companySale;state.settings.view='sales';schedule()}else if(t.dataset.newSaleClient!==undefined)openQuickSaleClientForm();else if(t.dataset.editSaleCompany!==undefined)editSelectedSaleCompany();else if(t.dataset.saveQuickSaleClient!==undefined)saveQuickSaleClient();else if(t.dataset.savePlan!==undefined)savePlanFromDom();else if(t.dataset.generateWeekRoute!==undefined){savePlanFromDom();toast('Ruta optimizada generada','ok')}else if(t.dataset.saveSale!==undefined)saveSale();else if(t.dataset.saveFormResponse!==undefined)saveFormResponse();else if(t.dataset.generateFormLink!==undefined)generateFormLink();else if(t.dataset.copy)copyFrom(t.dataset.copy);else if(t.dataset.waMsg!==undefined)sendGenerated('wa');else if(t.dataset.mailMsg!==undefined)sendGenerated('mail');else if(t.dataset.saveNetwork!==undefined)saveNetwork();else if(t.dataset.saveTwelve!==undefined)saveTwelve();else if(t.dataset.saveSettings!==undefined)saveSettings();else if(t.dataset.syncUp!==undefined)syncUp();else if(t.dataset.syncDown!==undefined)syncDown();else if(t.dataset.exportDb!==undefined)downloadJson(state,'ge-business-hub-pro-db.json');else if(t.dataset.resetDemo!==undefined){localStorage.removeItem(STORE);location.reload()}else if(t.dataset.submitPublic)submitPublic(t.dataset.submitPublic,t.dataset.company)}catch(err){console.error(err);toast('Error: '+err.message,'error')}bind()}
function globalChange(e){const t=e.target;try{if(t.id==='ownerSelect'){state.settings.owner=t.value;state.settings.companyId='';schedule()}else if(t.id==='catFilter'){state.settings.category=t.value;schedule()}else if(t.id==='stageFilter'){state.settings.stage=t.value;schedule()}else if(t.id==='crmCompany'){state.settings.companyId=t.value;schedule()}else if(t.id==='formSchema')renderSchemaFields();else if(t.id==='biCompany'){charts.forEach(ch=>{try{ch.destroy()}catch(e){}});charts=[];renderCharts();}else if(t.matches('[data-plan-province]')){const day=t.dataset.planProvince;const p=state.plans[day]||{};state.plans[day]={...p,province:t.value,city:'',companyIds:[]};schedule()}else if(t.matches('[data-plan-city]')){savePlanFromDom(true)}else if(t.matches('[data-plan-check]')){savePlanFromDom(true)}else if(t.matches('[data-sale-company-option]')){selectSaleCompany(t)} }catch(err){console.error(err)}bind()} function globalInput(e){if(e.target.classList.contains('saleQty'))updateSaleTotal();else if(e.target.id==='saleCompanySearch')filterSaleCompanyList(e.target.value);else if(['qClientName','qClientRnc','qClientEmail','qClientPhone'].includes(e.target.id))updateQuickClientValidation();bind()} function updateSaleTotal(){const el=document.getElementById('saleTotal');if(!el)return;el.value=[0,1,2,3].map(i=>num(document.getElementById('prod'+i)?.value)).reduce((a,b)=>a+b,0)}

function selectSaleCompany(input){document.querySelectorAll('[data-sale-company-option]').forEach(x=>{if(x!==input)x.checked=false});if(input.checked){document.getElementById('saleCompany').value=input.value;state.settings.companyId=input.value;const c=company(input.value);const label=document.getElementById('saleSelectedLabel');if(label)label.textContent=c?.name||'Seleccionada'}else{document.getElementById('saleCompany').value='';const label=document.getElementById('saleSelectedLabel');if(label)label.textContent='Sin seleccionar'}}
function filterSaleCompanyList(query){const wrap=document.querySelector('.sale-picker .check-list');if(!wrap)return;const selectedId=document.getElementById('saleCompany')?.value||'';wrap.querySelectorAll('[data-sale-row], .empty').forEach(n=>n.remove());wrap.insertAdjacentHTML('beforeend',salesCompanyOptions(compsForHealthSales(),selectedId,query))}
function copyFrom(id){const el=document.getElementById(id);if(!el)return;navigator.clipboard?.writeText(el.value).then(()=>toast('Copiado','ok')).catch(()=>toast('No se pudo copiar','error'))} function sendGenerated(kind){const msg=document.getElementById('generatedMsg')?.value||'';const comp=company(document.getElementById('formCompany')?.value);if(kind==='wa')window.open('https://wa.me/'+(comp?.phone||'').replace(/\D/g,'')+'?text='+encodeURIComponent(msg),'_blank');else location.href='mailto:'+(comp?.email||'')+'?subject='+encodeURIComponent('Formulario · '+(comp?.name||''))+'&body='+encodeURIComponent(msg)} function saveSettings(){state.settings.gistId=clean(gistId.value);state.settings.gistToken=clean(gistToken.value);state.settings.publicBaseUrl=clean(publicBaseUrl.value);schedule();toast('Configuración guardada','ok')}
window.addEventListener('error',e=>{console.error(e.error||e.message);toast('Error de interfaz: '+e.message,'error')});
render();
})();
</script>

<script>
(function(){
  'use strict';
  const isLocalHost = ['localhost','127.0.0.1','[::1]'].includes(location.hostname);
  const canUseServiceWorker = 'serviceWorker' in navigator && (location.protocol === 'https:' || isLocalHost);
  let deferredInstallPrompt = null;

  function notify(message, type){
    const existingToast = document.getElementById('toast');
    if(existingToast){
      const item = document.createElement('div');
      item.textContent = message;
      if(type === 'ok') item.style.borderLeftColor = 'var(--ok)';
      if(type === 'error') item.style.borderLeftColor = 'var(--bad)';
      existingToast.appendChild(item);
      setTimeout(function(){ item.remove(); }, 4200);
      return;
    }
    console.log(message);
  }

  function createInstallButton(){
    if(document.getElementById('pwaInstallBtn')) return document.getElementById('pwaInstallBtn');
    const button = document.createElement('button');
    button.id = 'pwaInstallBtn';
    button.type = 'button';
    button.className = 'pwa-install-btn';
    button.innerHTML = '<span class="material-symbols-rounded" aria-hidden="true">install_mobile</span><span>Instalar app</span>';
    button.setAttribute('aria-label','Instalar GE Business Hub Pro');
    button.addEventListener('click', async function(){
      if(!deferredInstallPrompt) return;
      button.classList.remove('show');
      deferredInstallPrompt.prompt();
      try{ await deferredInstallPrompt.userChoice; }catch(err){ console.warn(err); }
      deferredInstallPrompt = null;
    });
    document.body.appendChild(button);
    return button;
  }

  function showUpdateBanner(registration){
    if(document.getElementById('pwaUpdateBanner')) return;
    const banner = document.createElement('div');
    banner.id = 'pwaUpdateBanner';
    banner.className = 'pwa-update-banner show';
    banner.innerHTML = '<p>Hay una nueva versión de GE Business Hub Pro disponible.</p><button class="btn primary small" type="button">Actualizar</button>';
    banner.querySelector('button').addEventListener('click', function(){
      if(registration.waiting) registration.waiting.postMessage({type:'SKIP_WAITING'});
      location.reload();
    });
    document.body.appendChild(banner);
  }

  window.addEventListener('beforeinstallprompt', function(event){
    event.preventDefault();
    deferredInstallPrompt = event;
    createInstallButton().classList.add('show');
  });

  window.addEventListener('appinstalled', function(){
    const button = document.getElementById('pwaInstallBtn');
    if(button) button.classList.remove('show');
    deferredInstallPrompt = null;
    notify('GE Business Hub Pro instalado correctamente.','ok');
  });

  if(canUseServiceWorker){
    window.addEventListener('load', async function(){
      try{
        const registration = await navigator.serviceWorker.register('./sw.js', {scope:'./'});
        registration.addEventListener('updatefound', function(){
          const installingWorker = registration.installing;
          if(!installingWorker) return;
          installingWorker.addEventListener('statechange', function(){
            if(installingWorker.state === 'installed' && navigator.serviceWorker.controller){
              showUpdateBanner(registration);
            }
          });
        });
        navigator.serviceWorker.addEventListener('controllerchange', function(){
          if(window.__gePwaRefreshing) return;
          window.__gePwaRefreshing = true;
          location.reload();
        });
      }catch(error){
        console.warn('No se pudo registrar el Service Worker:', error);
      }
    });
  }
})();
</script>
