    function saveSucursal(form){ const fd=Object.fromEntries(new FormData(form)); Store.update(s=>{ const rec=fd.id? s.sucursales.find(x=>x.id===fd.id):null; const payload={owner:s.activeOwner,id:fd.id||uid('suc'),nombre:fd.nombre,ciudad:fd.ciudad,direccion:fd.direccion,responsable:fd.responsable,updatedAt:nowISO(),custom:collectCustom(fd,'sucursales')}; if(rec) Object.assign(rec,payload); else s.sucursales.unshift({...payload,createdAt:nowISO()}); }, 'Sucursal guardada'); UI.closeModal(); }

  const Router = (() => {
    function go(route){ const aliases={clientes:'empresas',prospectos:'empresas',logs:'sync',sincronizacion:'sync',heatmap:'mapa'}; route=aliases[route]||route; const valid=Views[route]?route:'dashboard'; Store.get().route=valid; Store.save(false); render(); if(innerWidth<900) document.getElementById('sidebar').classList.remove('open'); }
    function refresh(){ if(Store.get().route==='empresas') document.getElementById('empList').innerHTML=Views.empresasTable(); else render(); }
    function render(){ const s=Store.get(); document.getElementById('main').innerHTML = Views[s.route] ? Views[s.route]() : Views.dashboard(); document.querySelectorAll('[data-route]').forEach(b=>b.classList.toggle('active',b.dataset.route===s.route)); const title=MENU.flatMap(x=>x[1]).find(x=>x[0]===s.route)||['dashboard','Dashboard BI']; document.getElementById('pageTitle').innerHTML=`<i class="ti ${ICONS[s.route]||'ti-circle'}"></i> ${esc(title[1])}`; document.getElementById('brandSub').textContent=Services.ownerName(s.activeOwner); }
    return {go,render,refresh};
  })();

    function renderNav(){ document.getElementById('nav').innerHTML = MENU.map(([label,items])=>`<div class="nav-label">${label}</div>${items.map(([r,t])=>`<button data-route="${r}" onclick="App.Router.go('${r}')"><i class="ti ${ICONS[r]}"></i>${t}</button>`).join('')}`).join(''); }
    function renderCompanySelector(){ const s=Store.get(); document.getElementById('companySelector').innerHTML=COMPANIES.map(c=>`<button class="co-chip ${s.activeOwner===c.id?'active':''}" onclick="App.Actions.setOwner('${c.id}')"><span class="co-dot" style="background:${c.color}"></span>${c.name}</button>`).join(''); document.documentElement.style.setProperty('--acc',Services.ownerColor(s.activeOwner)); }

customFields('prospectos',p)}<button class="btn primary">Guardar</button></form>`); }

    function openOpportunityForm(id=''){ const o=id?Services.byId('oportunidades',id):{}; modal('<i class="ti ti-stairs-up"></i> Nueva Oportunidad BDM',`<form class="form" onsubmit="event.preventDefault();App.CRM.saveOpportunity(this)"><input type="hidden" name="id" value="${esc(o.id||'')}"><div class="field"><label>Título del negocio</label><input class="inp" name="titulo" required value="${esc(o.titulo||'')}"></div><div class="row"><div class="field"><label>Empresa</label><select name="empresaId" required>${Components.empresaOptions(o.empresaId)}</select></div><div class="field"><label>Contacto</label><select name="contactoId">${Components.contactoOptions(o.contactoId)}</select></div></div><div class="row"><div class="field"><label>Etapa</label><select name="etapa">${STAGES.map(x=>`<option ${o.etapa===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Valor estimado DOP</label><input class="inp" type="number" name="valor" value="${esc(o.valor||0)}"></div></div><div class="row"><div class="field"><label>Probabilidad %</label><input class="inp" type="number" min="0" max="100" name="probabilidad" value="${esc(o.probabilidad||25)}"></div><div class="field"><label>Fecha estimada de cierre</label><input class="inp" type="date" name="cierre" value="${esc((o.cierre||'').slice(0,10))}"></div></div><div class="field"><label>Competidores</label><input class="inp" name="competidores" value="${esc(o.competidores||'')}"></div><div class="field"><label>Dolor del cliente / Client Pain Point</label><textarea name="pain">${esc(o.pain||'')}</textarea></div><div class="field"><label>Solución propuesta</label><textarea name="solucion">${esc(o.solucion||'')}</textarea></div>${Components.customFields('oportunidades',o)}<button class="btn primary">Guardar oportunidad</button></form>`); }

enta</button></form>`); }

    function updateVentaCalc(form){
      try{
        const fd=Object.fromEntries(new FormData(form));
        const total=Services.calcVenta(fd);
        const el=document.getElementById('ventaCalcPreview');
        if(el) el.textContent=money(total);
      }catch(e){ console.warn('No se pudo calcular venta', e); }
    }

    function openImporter(kind='empresas'){ modal('<i class="ti ti-file-import"></i> Importador polimórfico',`<div class="drop"><i class="ti ti-cloud-upload" style="font-size:40px"></i><h3>Procesar .json, .csv, .xls, .txt, .jpg o .png</h3><p class="muted">Para imágenes se simula extracción de metadatos. Los registros se asocian a la empresa activa.</p><input type="file" id="importFile" class="inp" accept=".json,.csv,.txt,.xls,.xlsx,.jpg,.png,.jpeg"><button class="btn primary" style="margin-top:12px" onclick="App.Actions.processImport('${kind}')">Procesar archivo</button></div><div id="importPreview"></div>`); }
    return {initShell,renderNav,renderCompanySelector,toggleSidebar,toggleTheme,openCommand,quickAdd,modal,closeModal,toast,openCustomField,openProspectForm,openProspectDetail,openContactForm,openOpportunityForm,openTaskForm,openVentaForm,openSucursalForm,openMessageForm,openNetworkingForm,updateVentaCalc,openImporter};
  })();

  const Actions = (() => {
    function setOwner(owner){ Store.update(s=>{s.activeOwner=owner},'Empresa activa cambiada'); UI.renderCompanySelector(); Router.render(); }
    function moveOpp(id,dir){ Store.update(s=>{ const o=s.oportunidades.find(x=>x.id===id); if(o){ const i=STAGES.indexOf(o.etapa); o.etapa=STAGES[Math.min(STAGES.length-1,Math.max(0,i+dir))]; o.updatedAt=nowISO(); }},'Pipeline actualizado'); }
    function toggleTask(id){ Store.update(s=>{ const t=s.tareas.find(x=>x.id===id); if(t){t.estado=t.estado==='completada'?'pendiente':'completada';t.updatedAt=nowISO();}},'Tarea actualizada'); }
    function updateWeek(id,key,value){ Store.update(s=>{ const w=s.semanas.find(x=>x.id===id); if(w){ w[key]=key==='progreso'?Math.max(0,Math.min(100,Number(value||0))):value; }},'Semana actualizada'); }
    function resetWeeks(){ if(!confirm('¿Reiniciar el ciclo de 12 semanas?')) return; Store.update(s=>{s.semanas=s.semanas.map(w=>({...w,progreso:0}));},'Ciclo 12 semanas reiniciado'); }
    function saveNetworking(form){ const fd=Object.fromEntries(new FormData(form)); Store.update(s=>{ s.networking.unshift({id:uid('net'),owner:s.activeOwner,empresaId:fd.empresaId,fecha:fd.fecha,objetivo:fd.objetivo,resultado:fd.resultado,createdAt:nowISO()}); },'Visita social consolidada en agenda'); UI.closeModal(); }
    function commandSearch(q){ const n=normalize(q); const routes=MENU.flatMap(x=>x[1]).filter(([r,t])=>normalize(t).includes(n)); const prospects=Services.activeItems('prospectos').filter(p=>normalize(p.nombre).includes(n)).slice(0,10); document.getElementById('cmdList').innerHTML=[...routes.map(([r,t])=>`<div class="cmd-item" onclick="App.UI.closeModal();App.Router.go('${r}')"><i class="ti ${ICONS[r]}"></i><b>${t}</b></div>`),...prospects.map(p=>`<div class="cmd-item" onclick="App.UI.openProspectDetail('${p.id}')"><i class="ti ti-building"></i><div><b>${esc(p.nombre)}</b><div class="muted">${esc(p.ciudad)} · ${esc(p.clasificacionRD)}</div></div></div>`)].join('')||'<div class="cmd-item muted">Sin resultados</div>'; }
    function renderMap(points){
      const el=document.getElementById('map');
      if(!el) return;
      if(!window.L){
        el.innerHTML='<div class="card pad">Leaflet no está disponible. Verifica conexión a CDN.</div>';
        return;
      }
      const data=points||Services.activeItems('prospectos').filter(p=>p.latitud&&p.longitud).slice(0,600);
      el.innerHTML='';
      const map=L.map(el).setView([19.45,-70.70],8);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
      data.forEach(p=>{
        const color=p.prioridad==='alta'?'#f87171':(p.clasificacionRD||'').includes('Salud')?'#34d399':'#4f6fff';
        L.circleMarker([p.latitud,p.longitud],{
          radius:p.prioridad==='alta'?9:6,
          color,
          fillColor:color,
          fillOpacity:.38,
          weight:1
        }).addTo(map).bindPopup(`<b>${esc(p.nombre)}</b><br>${esc(p.clasificacionRD||'')}<br>${esc(p.ciudad||'')}`);
      });
      setTimeout(()=>map.invalidateSize(),100);
    }
    function processImport(kind){ const f=document.getElementById('importFile')?.files?.[0]; if(!f) return UI.toast('Selecciona un archivo para importar.','warn'); const ext=f.name.split('.').pop().toLowerCase(); if(['jpg','jpeg','png'].includes(ext)){ Store.update(s=>{s.contactos.unshift({id:uid('ct_img'),owner:s.activeOwner,empresaId:Services.activeItems('prospectos')[0]?.id||'',nombre:'Contacto extraído de imagen',cargo:'Metadato simulado',telefono:'809-555-0000',email:'imagen.importada@example.com',notas:`Simulación OCR/metadatos desde ${f.name}`,createdAt:nowISO(),custom:{}});},'Imagen procesada: contacto simulado creado'); UI.closeModal(); return; } const reader=new FileReader(); reader.onload=()=>{ try{ const rows=Services.parseImportedText(reader.result,ext,Store.get().activeOwner); Store.update(s=>{ if(kind==='contactos'){ rows.forEach(r=>s.contactos.unshift({id:uid('ct'),owner:s.activeOwner,empresaId:Services.activeItems('prospectos')[0]?.id||'',nombre:r.contacto||r.nombre,cargo:'Importado',telefono:r.telefono,email:r.email,notas:'Contacto importado',createdAt:nowISO(),custom:{}})); } else { const seen=new Set(s.prospectos.map(p=>normalize(p.nombre))); rows.forEach(r=>{ if(!seen.has(normalize(r.nombre))) s.prospectos.unshift(r); }); }},`Importación completada: ${rows.length} registros procesados`); UI.closeModal(); Router.render(); }catch(e){ UI.toast('Error procesando archivo: '+e.message,'err'); } }; reader.readAsText(f); }
    function exportJSON(){ const blob=new Blob([JSON.stringify(Store.get(),null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='ge_business_hub_backup_'+new Date().toISOString().slice(0,10)+'.json'; a.click(); URL.revokeObjectURL(a.href); }
    function clearData(){ if(confirm('Esto reiniciará los datos locales. ¿Continuar?')){ localStorage.removeItem(Store.KEY); location.reload(); } }
    return {setOwner,moveOpp,toggleTask,updateWeek,resetWeeks,saveNetworking,commandSearch,renderMap,processImport,exportJSON,clearData};
  })();

  function init(){ Store.load(); UI.initShell(); Store.subscribe(()=>{ UI.renderCompanySelector(); Router.render(); }); Router.render(); document.addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();UI.openCommand();} }); console.log('GE Business Hub Pro',VERSION,'ProspectosRD:',ProspectosRD.length); }
  return {UI, Store, Router, CRM, Analytics, Actions, Services, init, money, fmtDate};
})();
document.addEventListener('DOMContentLoaded', App.init);
</script>
</body>
</html>
