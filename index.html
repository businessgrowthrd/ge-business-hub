<body>

  <div id="modalRoot" class="modal-root"></div>
  <div id="toastWrap" class="toast-wrap"></div>

  <div class="cmd" id="cmd" onclick="closeCommand(event)">
    <div class="overlay"></div>
    <div class="cmd-box" onclick="event.stopPropagation()">
      <div style="padding:14px"><div class="search"><i class="ti ti-search"></i><input id="cmdInput" class="input" placeholder="Buscar empresa, oportunidad, tarea o módulo..." oninput="renderCommand()"></div></div>
      <div id="cmdResults" class="cmd-results"></div>
    </div>
  </div>

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="logo">GE</div>
        <div>

          <small id="activeCompanyLabel">Grupo GE</small>
        </div>
      </div>
      <div class="side-search"><div class="search"><i class="ti ti-search"></i><input id="navSearch" class="input" placeholder="Buscar módulo..." oninput="renderNav()"></div></div>
      <nav class="nav" id="nav"></nav>
      <div class="company-box">
        <div class="nav-section" style="padding:0 0 8px">Empresa activa</div>
        <div class="company-grid" id="companySelector"></div>
        <div class="sync-row"><span class="sync-dot" id="syncDot"></span><span id="syncLabel">Al día</span><button class="btn btn-sm" style="margin-left:auto" onclick="go('sync')"><i class="ti ti-cloud"></i></button></div>
      </div>
    </aside>

    <div class="content">

        <button class="btn btn-primary keep" onclick="quickAdd()"><i class="ti ti-plus"></i><span>Nuevo</span></button>
      </header>
      <main class="main" id="main"></main>
    </div>
  </div>

    function kpi(label,value,icon,color,foot){return `<div class="card pad kpi" style="--k:${color}"><div style="display:flex;justify-content:space-between;gap:10px"><div><div class="kpi-v">${value}</div><div class="kpi-l">${label}</div></div><i class="ti ${icon}" style="font-size:28px;color:${color}"></i></div><div class="kpi-foot">${foot}</div></div>`}
    function empty(msg){return `<div class="empty"><i class="ti ti-database-off"></i><strong>${msg}</strong></div>`}
    function emptyRow(cols,msg){return `<tr><td colspan="${cols}">${empty(msg)}</td></tr>`}

    function nextActions(emp,tareas,ops){
      const rows = [];
      tareas.filter(t=>t.estado!=='Completada').sort((a,b)=>daysSince(b.vence)-daysSince(a.vence)).slice(0,4).forEach(t=>rows.push({icon:'ti-clipboard-alert',title:t.titulo,sub:`${empresaName(t.empresaId)} · vence ${fmtDate(t.vence)}`,type:daysSince(t.vence)>0?'err':'warn'}));
      emp.filter(e=>daysSince(e.lastVisit)>45).slice(0,3).forEach(e=>rows.push({icon:'ti-route',title:`Visitar ${e.nombre}`,sub:`${daysSince(e.lastVisit)} días desde última visita`,type:'info'}));
      return rows.slice(0,6).map(r=>`<div class="risk"><i class="ti ${r.icon}" style="color:var(--${r.type})"></i><div><strong>${escapeHTML(r.title)}</strong><div style="color:var(--muted);font-size:12px">${escapeHTML(r.sub)}</div></div></div>`).join('') || empty('Sin acciones urgentes');
    }
    function riskList(emp){
      const risks = emp.filter(e=>daysSince(e.lastVisit)>45 || Number(e.score||0)<70).sort((a,b)=>(b.camas+b.empleados/20)-(a.camas+a.empleados/20));
      return `<div class="risk-list">${risks.slice(0,6).map(e=>`<div class="risk"><i class="ti ${e.score<70?'ti-mood-sad':'ti-calendar-time'}" style="color:${e.score<70?'var(--err)':'var(--warn)'}"></i><div><strong>${escapeHTML(e.nombre)}</strong><div style="color:var(--muted);font-size:12px">Score ${e.score} · última visita hace ${daysSince(e.lastVisit)} días · ${e.ciudad}</div></div></div>`).join('') || empty('Sin riesgos detectados')}</div>`;
    }
    function funnel(ops){
      const stages = ['Prospecto','Calificación','Propuesta','Negociación','Ganada'];
      const max = Math.max(1,...stages.map(s=>ops.filter(o=>o.etapa===s).reduce((a,b)=>a+Number(b.valor||0),0)));
      return stages.map(s=>{const v=ops.filter(o=>o.etapa===s).reduce((a,b)=>a+Number(b.valor||0),0); return `<div style="margin-bottom:13px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px"><strong>${s}</strong><span style="color:var(--muted)">${money(v)}</span></div><div class="metric-bar"><span style="width:${Math.max(4,(v/max)*100)}%"></span></div></div>`}).join('');
    }
    function strategicTable(emp){
      return `<div class="table-wrap"><table class="table" style="min-width:520px"><thead><tr><th>Empresa</th><th>Tipo</th><th>Potencial</th><th>Score</th></tr></thead><tbody>${emp.slice().sort((a,b)=>potential(b)-potential(a)).slice(0,6).map(e=>`<tr onclick="openEmpresaDetail('${e.id}')" style="cursor:pointer"><td>${escapeHTML(e.nombre)}</td><td>${escapeHTML(e.tipo)}</td><td>${potential(e)}</td><td><span class="pill ${e.score<70?'err':'ok'}">${e.score}</span></td></tr>`).join('')}</tbody></table></div>`;
    }
    function potential(e){return Math.round(Number(e.camas||0)*4 + Number(e.empleados||0)/15 + (e.prioridad==='Alta'?60:e.prioridad==='Media'?25:0));}

    function renderEmpresaTable(){
      const q=(document.getElementById('empSearch')?.value||'').toLowerCase(), tipo=document.getElementById('empTipo')?.value||'', pr=document.getElementById('empPrioridad')?.value||'';
      let emp=filteredEmpresas().filter(e=>(!tipo||e.tipo===tipo)&&(!pr||e.prioridad===pr)&&[e.nombre,e.ciudad,e.sector,e.contacto].join(' ').toLowerCase().includes(q));
      document.getElementById('empresaTable').innerHTML = `<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Empresa</th><th>Tipo / sector</th><th>Ciudad</th><th>Potencial</th><th>Última visita</th><th>Score</th><th>Acciones</th></tr></thead><tbody>${emp.map(e=>`<tr><td><strong style="color:var(--text)">${escapeHTML(e.nombre)}</strong><br><span style="font-size:12px">${escapeHTML(e.contacto||'Sin contacto')}</span></td><td>${escapeHTML(e.tipo)}<br><span style="font-size:12px">${escapeHTML(e.sector||'')}</span></td><td>${escapeHTML(e.ciudad||'')}</td><td><span class="pill info">${potential(e)}</span></td><td>${fmtDate(e.lastVisit)}<br><span style="font-size:12px">${daysSince(e.lastVisit)} días</span></td><td><span class="pill ${e.score<70?'err':e.score<80?'warn':'ok'}">${e.score}</span></td><td><div class="actions"><button class="btn btn-sm" onclick="openEmpresaDetail('${e.id}')"><i class="ti ti-eye"></i></button><button class="btn btn-sm" onclick="openEmpresaForm('${e.id}')"><i class="ti ti-pencil"></i></button><button class="btn btn-sm btn-danger" onclick="deleteItem('empresas','${e.id}')"><i class="ti ti-trash"></i></button></div></td></tr>`).join('') || emptyRow(7,'No hay empresas')}</tbody></table></div></div>`;
    }

    function routeList(emp){
      const rows=emp.slice().sort((a,b)=>routeScore(b)-routeScore(a)).slice(0,8);
      return rows.map((e,i)=>`<div class="risk"><div class="avatar" style="width:34px;height:34px;border-radius:12px">${i+1}</div><div><strong>${escapeHTML(e.nombre)}</strong><div style="color:var(--muted);font-size:12px">${e.ciudad} · ${daysSince(e.lastVisit)} días sin visita · potencial ${potential(e)}</div><div class="actions" style="margin-top:7px"><button class="btn btn-sm" onclick="openVisitaForm('${e.id}')"><i class="ti ti-checkup-list"></i>Visitar</button><a class="btn btn-sm" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${e.latitud},${e.longitud}"><i class="ti ti-navigation"></i>Maps</a></div></div></div>`).join('') || empty('No hay empresas geolocalizadas');
    }
    function routeScore(e){return daysSince(e.lastVisit)*2 + potential(e) + (e.score<70?80:0)}
    function renderMap(emp){
      if(!window.L) return;
      if(mapInstance){mapInstance.remove(); mapInstance=null;}
      mapInstance = L.map('map').setView([19.45,-70.70],10);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(mapInstance);
      emp.forEach(e=>{L.marker([e.latitud,e.longitud]).addTo(mapInstance).bindPopup(`<strong>${escapeHTML(e.nombre)}</strong><br>${escapeHTML(e.ciudad)}<br>Potencial: ${potential(e)}<br><button onclick="openVisitaForm('${e.id}')">Registrar visita</button>`)});
      if(emp.length){const group=L.featureGroup(emp.map(e=>L.marker([e.latitud,e.longitud]))); mapInstance.fitBounds(group.getBounds().pad(.2));}
    }
    function visitTimeline(){
      const empIds=new Set(filteredEmpresas().map(e=>e.id));
      return `<div class="timeline">${state.visitas.filter(v=>empIds.has(v.empresaId)).sort((a,b)=>b.fecha.localeCompare(a.fecha)).slice(0,8).map(v=>`<div class="tl"><div class="tl-icon"><i class="ti ti-map-pin-check"></i></div><div class="tl-body"><strong>${empresaName(v.empresaId)}</strong><br><small>${fmtDate(v.fecha)} · ${escapeHTML(v.motivo)}</small><p style="margin-top:5px;color:var(--muted)">${escapeHTML(v.resultado)}</p></div></div>`).join('') || empty('No hay visitas')}</div>`;
    }

    function pipeline(ops){
      const stages=['Prospecto','Calificación','Propuesta','Negociación','Ganada'];
      return stages.map(s=>{const list=ops.filter(o=>o.etapa===s); return `<div class="stage"><div class="stage-hd"><strong>${s}</strong><span class="pill">${list.length}</span></div>${list.map(o=>`<div class="deal" onclick="openOportunidadForm('${o.id}')"><strong>${escapeHTML(o.titulo)}</strong><small>${escapeHTML(empresaName(o.empresaId))}</small><div style="margin-top:8px;display:flex;justify-content:space-between"><span class="pill info">${money(o.valor)}</span><span class="pill">${o.probabilidad}%</span></div></div>`).join('') || `<div class="empty" style="padding:20px 8px">Vacío</div>`}</div>`}).join('');
    }
    function taskRow(t){return `<tr><td><button class="btn btn-sm ${t.estado==='Completada'?'btn-ok':''}" onclick="toggleTask('${t.id}')"><i class="ti ${t.estado==='Completada'?'ti-check':'ti-circle'}"></i>${t.estado}</button></td><td><strong style="color:var(--text)">${escapeHTML(t.titulo)}</strong></td><td>${escapeHTML(empresaName(t.empresaId))}</td><td><span class="pill ${t.prioridad==='Alta'?'err':t.prioridad==='Media'?'warn':'info'}">${t.prioridad}</span></td><td>${fmtDate(t.vence)} ${daysSince(t.vence)>0&&t.estado!=='Completada'?'<span class="pill err">Vencida</span>':''}</td><td>${escapeHTML(t.tipo)}</td><td><div class="actions"><button class="btn btn-sm" onclick="openTareaForm('${t.id}')"><i class="ti ti-pencil"></i></button><button class="btn btn-sm btn-danger" onclick="deleteItem('tareas','${t.id}')"><i class="ti ti-trash"></i></button></div></td></tr>`}
    function contactCard(c){return `<div class="card pad"><div style="display:flex;gap:12px;align-items:flex-start"><div class="avatar">${escapeHTML(c.nombre.slice(0,2).toUpperCase())}</div><div style="flex:1"><strong>${escapeHTML(c.nombre)}</strong><div style="color:var(--muted);font-size:12px">${escapeHTML(c.cargo)} · ${escapeHTML(empresaName(c.empresaId))}</div><div class="actions" style="margin-top:11px"><a class="btn btn-sm" href="tel:${escapeHTML(c.telefono)}"><i class="ti ti-phone"></i></a><a class="btn btn-sm" href="mailto:${escapeHTML(c.email)}"><i class="ti ti-mail"></i></a><a class="btn btn-sm btn-ok" target="_blank" href="https://wa.me/1${String(c.whatsapp||'').replace(/\D/g,'')}"><i class="ti ti-brand-whatsapp"></i></a><button class="btn btn-sm" onclick="openContactoForm('${c.id}')"><i class="ti ti-pencil"></i></button></div></div></div></div>`}

    function salesReport(ventas){const by={}; ventas.forEach(v=>by[v.empresaId]=(by[v.empresaId]||0)+Number(v.monto||0)); const max=Math.max(1,...Object.values(by)); return Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([id,v])=>`<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px"><strong>${escapeHTML(empresaName(id))}</strong><span>${money(v)}</span></div><div class="metric-bar"><span style="width:${(v/max)*100}%"></span></div></div>`).join('') || empty('No hay ventas');}
    function sectorPotential(emp){const by={}; emp.forEach(e=>by[e.tipo]=(by[e.tipo]||0)+potential(e)); const max=Math.max(1,...Object.values(by)); return Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px"><strong>${escapeHTML(k)}</strong><span>${v}</span></div><div class="metric-bar"><span style="width:${(v/max)*100}%"></span></div></div>`).join('') || empty('No hay datos');}
    function executiveReport(emp,ops,ventas){const top=emp.slice().sort((a,b)=>potential(b)-potential(a))[0]; const risky=emp.filter(e=>e.score<70 || daysSince(e.lastVisit)>45).length; return `<div class="grid grid-3"><div><span class="pill info">Mayor potencial</span><h3 style="margin-top:9px">${escapeHTML(top?.nombre||'—')}</h3><p style="color:var(--muted)">Potencial ${top?potential(top):0}</p></div><div><span class="pill warn">Atención</span><h3 style="margin-top:9px">${risky} cuentas</h3><p style="color:var(--muted)">Requieren visita o plan de mejora.</p></div><div><span class="pill ok">Pipeline</span><h3 style="margin-top:9px">${money(ops.reduce((a,b)=>a+Number(b.valor||0),0))}</h3><p style="color:var(--muted)">Valor estimado abierto.</p></div></div>`}

      root.classList.add('show');
    }
    function closeModal(){document.getElementById('modalRoot').classList.remove('show')}
    function toast(msg,type=''){const w=document.getElementById('toastWrap'); const el=document.createElement('div'); el.className=`toast ${type}`; el.textContent=msg; w.appendChild(el); setTimeout(()=>el.remove(),3200)}

    function empresaOptions(selected=''){return filteredEmpresas().map(e=>`<option value="${e.id}" ${e.id===selected?'selected':''}>${escapeHTML(e.nombre)}</option>`).join('')}
    function openEmpresaForm(id=''){

        ${selectField('Tipo','tipo',e.tipo,['Salud','Fabril','Retail','Servicios','ONG'].map(x=>[x,x]))}${field('Sector','sector',e.sector)}
        ${field('Ciudad','ciudad',e.ciudad)}${field('Dirección','direccion',e.direccion)}
        ${field('Empleados','empleados',e.empleados,'number')}${field('Camas','camas',e.camas,'number')}
        ${field('Teléfono','telefono',e.telefono)}${field('Email','email',e.email,'email')}

        ${field('Latitud','latitud',e.latitud,'number','step="any"')}${field('Longitud','longitud',e.longitud,'number','step="any"')}
        ${field('Última visita','lastVisit',e.lastVisit,'date')}${field('Score','score',e.score,'number','min="0" max="100"')}
        <div style="grid-column:1/-1"><label class="label">Notas</label><textarea id="notas" class="textarea">${escapeHTML(e.notas)}</textarea></div>
      </div>`, `<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveEmpresa('${id}')">Guardar</button>`);

    function field(label,id,value,type='text',extra=''){return `<div><label class="label">${label}</label><input class="input" id="${id}" type="${type}" value="${escapeHTML(value)}" ${extra}></div>`}
    function selectField(label,id,value,opts){return `<div><label class="label">${label}</label><select class="select" id="${id}">${opts.map(([v,l])=>`<option value="${escapeHTML(v)}" ${String(v)===String(value)?'selected':''}>${escapeHTML(l)}</option>`).join('')}</select></div>`}
    function val(id){return document.getElementById(id)?.value ?? ''}
    function saveEmpresa(id){
      const data={id:id||uid('emp'),grupo:val('grupo'),nombre:val('nombre'),tipo:val('tipo'),sector:val('sector'),ciudad:val('ciudad'),direccion:val('direccion'),empleados:Number(val('empleados')),camas:Number(val('camas')),telefono:val('telefono'),email:val('email'),contacto:val('contacto'),prioridad:val('prioridad'),latitud:Number(val('latitud'))||null,longitud:Number(val('longitud'))||null,notas:val('notas'),lastVisit:val('lastVisit'),score:Number(val('score'))||75,createdAt:id?(empresa(id)?.createdAt||todayISO()):todayISO()};

    }

    function saveVisita(){const idEmp=val('empresaId'); const data={id:uid('vi'),empresaId:idEmp,fecha:val('fecha'),motivo:val('motivo'),resultado:val('resultado'),proximo:val('proximo')}; state.visitas.push(data); const e=empresa(idEmp); if(e)e.lastVisit=data.fecha; if(data.proximo)state.tareas.push({id:uid('ta'),empresaId:idEmp,opId:'',titulo:data.proximo,tipo:'Seguimiento',prioridad:'Media',estado:'Pendiente',vence:todayISO()}); save();closeModal();render();toast('Visita registrada y CRM actualizado','ok')}

    function openFormularioForm(){
      openModal('Registrar formulario', `<div class="form-grid form-2">${selectField('Empresa','empresaId',filteredEmpresas()[0]?.id,filteredEmpresas().map(e=>[e.id,e.nombre]))}${selectField('Tipo','tipo','Evaluación del Servicio',['Evaluación del Servicio','TPN','Inspección de Sucursales'].map(x=>[x,x]))}${field('Fecha','fecha',todayISO(),'date')}${field('Score','score',75,'number','min="0" max="100"')}<div style="grid-column:1/-1"><label class="label">Acción sugerida</label><textarea id="accion" class="textarea">Crear seguimiento según resultado del formulario.</textarea></div></div>`, `<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveFormulario()">Guardar</button>`);
    }
    function saveFormulario(){const data={id:uid('fo'),empresaId:val('empresaId'),tipo:val('tipo'),fecha:val('fecha'),score:Number(val('score')),accion:val('accion')}; state.formularios.push(data); const e=empresa(data.empresaId); if(e)e.score=data.score; if(data.score<70)state.tareas.push({id:uid('ta'),empresaId:data.empresaId,opId:'',titulo:'Plan de mejora por baja satisfacción',tipo:'Formulario',prioridad:'Alta',estado:'Pendiente',vence:todayISO()}); save();closeModal();render();toast('Formulario registrado','ok')}
    function copyFormMessage(id){const f=byId('formularios',id), e=empresa(f.empresaId); const msg=`Hola, ${e.contacto||''}. Compartimos el seguimiento del formulario ${f.tipo} para ${e.nombre}. Score registrado: ${f.score}. Acción sugerida: ${f.accion}`; navigator.clipboard?.writeText(msg); toast('Mensaje copiado','ok')}

    function deleteItem(list,id){if(!confirm('¿Eliminar este registro?'))return; state[list]=state[list].filter(x=>x.id!==id); save();render();toast('Registro eliminado','warn')}
    function quickAdd(){const map={dashboard:openTareaForm,empresas:openEmpresaForm,campo:openVisitaForm,oportunidades:openOportunidadForm,tareas:openTareaForm,contactos:openContactoForm,formularios:openFormularioForm}; (map[state.view]||openTareaForm)();}

    function normalizeEmpresa(r){return {id:r.id||uid('emp'),grupo:r.grupo||r.EmpresaGE||'hemocura',nombre:r.Nombre||r.nombre||'',tipo:r.Tipo||r.tipo||'Salud',sector:r.Sector||r.sector||'',ciudad:r.Ciudad||r.ciudad||'',direccion:r['Dirección']||r.Direccion||r.direccion||'',empleados:Number(r.Empleados||r.empleados||0),camas:Number(r.Camas||r.camas||0),telefono:r['Teléfono']||r.Telefono||r.telefono||'',email:cleanEmail(r.Email||r.email||''),contacto:r.Contacto||r.contacto||'',prioridad:r.Prioridad||r.prioridad||'Media',latitud:Number(r.Latitud||r.latitud)||null,longitud:Number(r.Longitud||r.longitud)||null,notas:r.Notas||r.notas||'',lastVisit:r.lastVisit||'',score:Number(r.score||75),createdAt:todayISO()}}
    function cleanEmail(v){v=String(v||'').trim().replace(/\.gm$/i,'.gmail.com').replace(/\.gmail$/i,'.gmail.com'); return v.includes('/')?v.split('/')[0].trim():v;}
    function importJSONText(text){let arr; try{arr=JSON.parse(text)}catch(e){throw new Error('JSON inválido: '+e.message)} if(!Array.isArray(arr)) arr=[arr]; let ok=0, bad=[]; arr.forEach((r,i)=>{const e=normalizeEmpresa(r); if(!e.nombre){bad.push(i+1); return;} const existing=state.empresas.find(x=>x.nombre.toLowerCase()===e.nombre.toLowerCase()); if(existing) Object.assign(existing,e,{id:existing.id,createdAt:existing.createdAt}); else state.empresas.push(e); ok++;}); save(); return {ok,bad};}
    function importPastedJSON(){try{const res=importJSONText(val('jsonPaste')); document.getElementById('importResult').innerHTML=`<div class="pill ok">${res.ok} registros importados</div> ${res.bad.length?`<span class="pill err">Filas sin nombre: ${res.bad.join(', ')}</span>`:''}`; renderNav();}catch(e){document.getElementById('importResult').innerHTML=`<div class="pill err">${escapeHTML(e.message)}</div>`}}
    function handleDrop(ev){ev.preventDefault(); document.getElementById('drop').classList.remove('drag'); const file=ev.dataTransfer.files[0]; if(!file)return; const reader=new FileReader(); reader.onload=()=>{document.getElementById('jsonPaste').value=reader.result; importPastedJSON();}; reader.readAsText(file);}
    function downloadTemplate(){downloadFile('plantilla_empresas_ge.json', JSON.stringify([{Nombre:'Hospital Ejemplo',Tipo:'Salud',Sector:'Hospital privado',Ciudad:'Santiago',Dirección:'Av. Ejemplo',Empleados:100,Camas:50,Teléfono:'809-000-0000',Email:'contacto@ejemplo.com',Contacto:'Nombre decisor',Prioridad:'Alta',Latitud:19.45,Longitud:-70.70,Notas:'Notas comerciales'}],null,2));}
    function exportJSON(scope){const data = scope==='empresas'?state.empresas:state; downloadFile(`ge-business-hub-${scope}-${todayISO()}.json`, JSON.stringify(data,null,2));}
    function downloadFile(name,content){const blob=new Blob([content],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); URL.revokeObjectURL(a.href);}
    function restoreBackup(ev){const file=ev.target.files[0]; if(!file)return; const r=new FileReader(); r.onload=()=>{try{const data=JSON.parse(r.result); state={...structuredClone(seedData),...data}; save();render();toast('Backup restaurado','ok')}catch(e){toast('Backup inválido','err')}}; r.readAsText(file);}

    async function gistUpload(){if(!state.gist.id||!state.gist.token)return toast('Configura Gist ID y token','warn'); try{const res=await fetch(`https://api.github.com/gists/${state.gist.id}`,{method:'PATCH',headers:{Authorization:`Bearer ${state.gist.token}`,Accept:'application/vnd.github+json'},body:JSON.stringify({files:{[state.gist.file]:{content:JSON.stringify(state,null,2)}}})}); if(!res.ok)throw new Error(await res.text()); toast('Datos subidos a Gist','ok')}catch(e){toast('Error al subir Gist','err'); console.error(e)}}
    async function gistDownload(){if(!state.gist.id||!state.gist.token)return toast('Configura Gist ID y token','warn'); try{const res=await fetch(`https://api.github.com/gists/${state.gist.id}`,{headers:{Authorization:`Bearer ${state.gist.token}`,Accept:'application/vnd.github+json'}}); const data=await res.json(); const content=data.files?.[state.gist.file]?.content; if(!content)throw new Error('Archivo no encontrado'); state={...structuredClone(seedData),...JSON.parse(content),gist:state.gist}; save();render();toast('Datos descargados de Gist','ok')}catch(e){toast('Error al bajar Gist','err'); console.error(e)}}
    function resetData(){if(confirm('¿Restablecer datos demo?')){localStorage.removeItem(STORE_KEY); state=structuredClone(seedData); render(); toast('Datos restablecidos','warn')}}

    function openCommand(){document.getElementById('cmd').classList.add('show'); document.getElementById('cmdInput').value=''; renderCommand(); setTimeout(()=>document.getElementById('cmdInput').focus(),50)}
    function closeCommand(ev){if(!ev || ev.target.id==='cmd')document.getElementById('cmd').classList.remove('show')}
    function renderCommand(){const q=(document.getElementById('cmdInput').value||'').toLowerCase(); const rows=[]; navItems.forEach(i=>{if(i[3].toLowerCase().includes(q))rows.push({icon:i[2],title:i[3],sub:'Módulo',act:`go('${i[1]}');document.getElementById('cmd').classList.remove('show')`})}); state.empresas.forEach(e=>{if([e.nombre,e.ciudad,e.sector].join(' ').toLowerCase().includes(q))rows.push({icon:'ti-building',title:e.nombre,sub:`${e.tipo} · ${e.ciudad}`,act:`openEmpresaDetail('${e.id}');document.getElementById('cmd').classList.remove('show')`})}); state.tareas.forEach(t=>{if(t.titulo.toLowerCase().includes(q))rows.push({icon:'ti-clipboard-list',title:t.titulo,sub:empresaName(t.empresaId),act:`go('tareas');document.getElementById('cmd').classList.remove('show')`})}); document.getElementById('cmdResults').innerHTML=rows.slice(0,20).map(r=>`<div class="cmd-item" onclick="${r.act}"><i class="ti ${r.icon}" style="font-size:22px;color:var(--active-color)"></i><div><strong>${escapeHTML(r.title)}</strong><div style="color:var(--muted);font-size:12px">${escapeHTML(r.sub)}</div></div></div>`).join('')||empty('Sin resultados');}
    window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCommand()} if(e.key==='Escape'){closeModal();document.getElementById('cmd').classList.remove('show')}});

    render();
  </script>
</body>
</html>
