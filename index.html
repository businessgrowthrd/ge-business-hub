    function normalizeState(input){
      const base = DemoData.build();
      const data = (input && typeof input === 'object') ? input : {};
      const merged = {
        ...base,
        ...data,
        meta:{...base.meta, ...(data.meta || {}), version:3},
        ui:{...base.ui, ...(data.ui || {})},
        sync:{...base.sync, ...(data.sync || {})},
        empresas:Array.isArray(data.empresas) ? data.empresas : base.empresas,
        contactos:Array.isArray(data.contactos) ? data.contactos : base.contactos,
        oportunidades:Array.isArray(data.oportunidades) ? data.oportunidades : base.oportunidades,
        tareas:Array.isArray(data.tareas) ? data.tareas : base.tareas,
        visitas:Array.isArray(data.visitas) ? data.visitas : base.visitas,
        ventas:Array.isArray(data.ventas) ? data.ventas : base.ventas,
        formularios:Array.isArray(data.formularios) ? data.formularios : base.formularios
      };
      if(!merged.ui.view) merged.ui.view = 'dashboard';
      if(!merged.ui.activeCompany) merged.ui.activeCompany = 'grupo';
      if(!merged.ui.theme) merged.ui.theme = 'dark';
      if(!merged.sync.gistFile) merged.sync.gistFile = 'ge-business-hub-pro.json';
      if(!merged.sync.status) merged.sync.status = 'synced';
      return merged;
    }

    const StorageService = (() => {
      function load(){
        try {
          const raw = localStorage.getItem(STORE_KEY);
          return normalizeState(raw ? JSON.parse(raw) : DemoData.build());
        } catch(e){
          console.error('No se pudo cargar el estado local. Se inicia con datos demo.', e);
          return DemoData.build();
        }
      }
      function save(state){ state.meta = state.meta || {}; state.meta.updatedAt = new Date().toISOString(); localStorage.setItem(STORE_KEY, JSON.stringify(normalizeState(state))); Bus.emit('storage:saved', state); }
      function exportSafe(state){ const copy = structuredClone(normalizeState(state)); delete copy.sync.token; return copy; }
      return {load, save, exportSafe};
    })();

    const StateService = (() => {
      let state = StorageService.load();
      function get(){ return state; }
      function set(pathOrPatch, value){
        if(typeof pathOrPatch === 'string'){
          const keys = pathOrPatch.split('.'); let obj = state; keys.slice(0,-1).forEach(k => obj = obj[k]); obj[keys.at(-1)] = value;
        } else { state = {...state, ...pathOrPatch}; }
        StorageService.save(state); Bus.emit('state:changed', state);
      }
      function replace(next){ state = next; StorageService.save(state); Bus.emit('state:changed', state); }
      function collection(name){ return state[name] || []; }
      return {get,set,replace,collection};
    })();

    const BaseService = (collectionName) => ({
      all(){ return scopeRows(StateService.collection(collectionName)); },
      raw(){ return StateService.collection(collectionName); },
      byId(id){ return StateService.collection(collectionName).find(x => x.id === id); },
      upsert(item){ const s = StateService.get(); const list = s[collectionName]; const idx = list.findIndex(x => x.id === item.id); const next = {...item, id:item.id || uid(collectionName.slice(0,3)), updatedAt:new Date().toISOString()}; if(idx >= 0) list[idx] = {...list[idx], ...next}; else list.unshift(next); StateService.set(collectionName, list); Bus.emit(collectionName+':changed', next); return next; },
      remove(id){ const s = StateService.get(); s[collectionName] = s[collectionName].filter(x => x.id !== id); StateService.set(collectionName, s[collectionName]); Bus.emit(collectionName+':changed'); }

      function risks(){ return base.all().map(e => ({empresa:e, score:score(e), dias:daysSince(e.ultimaVisita)})).filter(x => x.dias > 30 || x.score < 55).sort((a,b)=>b.dias-a.dias); }

      const tokenKey = STORE_KEY + '_github_token';
      const headers = () => { const token = localStorage.getItem(tokenKey); if(!token) throw new Error('Falta el token de GitHub con permiso gist.'); return {'Accept':'application/vnd.github+json','Content-Type':'application/json','Authorization':'Bearer '+token}; };
      async function request(url, options={}){ const res = await fetch(url, {...options, headers:{...headers(), ...(options.headers||{})}}); const text = await res.text(); let data; try{ data = text ? JSON.parse(text) : {}; } catch { data = text; } if(!res.ok){ const msg = data?.message || text || 'Error desconocido'; throw new Error(`${res.status} ${msg}`); } return data; }
      function setConfig({token,gistId,gistFile}){ if(token !== undefined) localStorage.setItem(tokenKey, token.trim()); const s = StateService.get(); s.sync.gistId = ((gistId ?? s.sync.gistId) || '').trim(); s.sync.gistFile = ((gistFile ?? s.sync.gistFile) || 'ge-business-hub-pro.json').trim(); StateService.set('sync', s.sync); }
      function getConfig(){ const s=StateService.get().sync; return {...s, token:localStorage.getItem(tokenKey)||''}; }
      async function test(){ const me = await request('https://api.github.com/user'); return me; }
      async function create(){ const s=StateService.get(); const file=s.sync.gistFile || 'ge-business-hub-pro.json'; const body={description:'GE Business Hub Pro sync', public:false, files:{[file]:{content:JSON.stringify(StorageService.exportSafe(s),null,2)}}}; const gist=await request('https://api.github.com/gists',{method:'POST',body:JSON.stringify(body)}); s.sync.gistId=gist.id; s.sync.lastSyncAt=new Date().toISOString(); s.sync.status='synced'; StateService.set('sync',s.sync); return gist; }
      async function upload(){ const s=StateService.get(); if(!s.sync.gistId) return create(); const file=s.sync.gistFile || 'ge-business-hub-pro.json'; const body={files:{[file]:{content:JSON.stringify(StorageService.exportSafe(s),null,2)}}}; const gist=await request('https://api.github.com/gists/'+s.sync.gistId,{method:'PATCH',body:JSON.stringify(body)}); s.sync.lastSyncAt=new Date().toISOString(); s.sync.status='synced'; StateService.set('sync',s.sync); return gist; }
      async function download(){ const s=StateService.get(); if(!s.sync.gistId) throw new Error('Falta el Gist ID.'); const gist=await request('https://api.github.com/gists/'+s.sync.gistId); const file=s.sync.gistFile || Object.keys(gist.files||{})[0]; let content = gist.files?.[file]?.content; if(gist.files?.[file]?.truncated && gist.files?.[file]?.raw_url){ content = await fetch(gist.files[file].raw_url).then(r=>r.text()); } if(!content) throw new Error('No se encontró el archivo de datos dentro del Gist.'); const remote=JSON.parse(content); remote.sync = {...s.sync, ...(remote.sync||{}), gistId:s.sync.gistId, gistFile:file, lastSyncAt:new Date().toISOString(), status:'synced'}; StateService.replace(remote); return remote; }
      return {setConfig,getConfig,test,create,upload,download};

</div></div><div class="grid grid-4" style="margin-top:14px"><div class="card pad"><span class="small">Oportunidades</span><h2>${opp.length}</h2></div><div class="card pad"><span class="small">Tareas</span><h2>${tasks.length}</h2></div><div class="card pad"><span class="small">Formularios</span><h2>${forms.length}</h2></div><div class="card pad"><span class="small">Ventas</span><h2>${money(sales.reduce((s,x)=>s+Number(x.monto||0),0))}</h2></div></div><div class="grid grid-2" style="margin-top:14px"><div class="card pad"><h3>Historial de visitas</h3><div class="timeline" style="margin-top:12px">${visits.map(v=>`<div class="tl"><div class="tl-icon"><i class="ti ti-map-pin"></i></div><div class="tl-body"><strong>${fmtDate(v.fecha)} · ${esc(v.motivo)}</strong><br><small>${esc(v.resultado)} · ${esc(v.proximosPasos)}</small></div></div>`).join('')||empty('ti-map-pin','Sin visitas')}</div></div><div class="card pad"><h3>Tareas relacionadas</h3><div class="timeline" style="margin-top:12px">${tasks.map(taskLine).join('')||empty('ti-check','Sin tareas')}</div></div></div>`; }};
    Views.pipeline = {title:'CRM Pipeline', subtitle:'Oportunidades comerciales por etapa', render(){ const f=BIService.funnel(); return `${head('CRM Pipeline','Arrastra mentalmente el flujo comercial: prospecto → contacto → propuesta → negociación → ganada.','App.Forms.oportunidadForm()','Nueva oportunidad')}<div class="pipeline">${f.map(col=>`<div class="stage"><div class="stage-hd"><strong>${col.stage}</strong><span class="pill">${col.items.length}</span></div>${col.items.map(o=>{const e=EmpresaService.byId(o.empresaId);return `<div class="deal"><strong>${esc(o.titulo)}</strong><small>${esc(e?.nombre||'—')}</small><div style="margin-top:8px"><span class="pill ok">${money(o.valor)}</span> <span class="pill">${o.probabilidad}%</span></div></div>`}).join('')}</div>`).join('')}</div>`; }};

    Views.rutas = {title:'Campo & rutas', subtitle:'Priorización por zona, recencia y potencial', render(){ const rows=EmpresaService.all().filter(e=>e.latitud&&e.longitud).sort((a,b)=>EmpresaService.score(b)-EmpresaService.score(a)); setTimeout(()=>MapService.render(rows),50); return `${head('Campo & rutas','Mapa operativo con clientes priorizados para trabajo de campo.','App.Forms.visitaForm()','Registrar visita')}<div class="grid grid-2"><div class="card pad"><div id="map" class="map"></div></div><div class="card pad"><h3>Ruta sugerida</h3><div class="timeline" style="margin-top:12px">${rows.map((e,i)=>`<div class="tl"><div class="tl-icon">${i+1}</div><div class="tl-body"><strong>${esc(e.nombre)}</strong><br><small>${esc(e.ciudad)} · ${daysSince(e.ultimaVisita)} días sin visita · Score ${EmpresaService.score(e)}</small></div></div>`).join('')}</div></div></div>`; }};
    Views.formularios = {title:'Formularios', subtitle:'Operativos y analíticos', render(){ const rows=FormularioService.all(); return `${head('Formularios operativos','Evaluación del Servicio, TPN e Inspección conectados a Empresas.')}<div class="grid grid-3"><div class="card pad"><h3>Evaluación del Servicio</h3><p class="small">Genera link y registra score de satisfacción.</p><button class="btn btn-sm" style="margin-top:12px">Crear</button></div><div class="card pad"><h3>Formulario TPN</h3><p class="small">Captura clínica tabulable para análisis posterior.</p><button class="btn btn-sm" style="margin-top:12px">Crear</button></div><div class="card pad"><h3>Inspección de sucursales</h3><p class="small">Checklist estructurado con acciones correctivas.</p><button class="btn btn-sm" style="margin-top:12px">Crear</button></div></div><div class="card" style="margin-top:14px"><div class="table-wrap"><table class="table"><thead><tr><th>Formulario</th><th>Empresa</th><th>Fecha</th><th>Score</th><th>Estado</th><th>Acción</th></tr></thead><tbody>${rows.map(f=>{const e=EmpresaService.byId(f.empresaId);return `<tr><td><strong>${esc(f.tipo)}</strong></td><td>${esc(e?.nombre||'—')}</td><td>${fmtDate(f.fecha)}</td><td>${f.score}/100</td><td><span class="pill warn">${esc(f.estado)}</span></td><td>${esc(f.accion)}</td></tr>`}).join('')}</tbody></table></div></div>`; }};
    Views.reportes = {title:'Reportes BI', subtitle:'Análisis comercial', render(){ const ventas=VentaService.all(); const total=ventas.reduce((s,v)=>s+Number(v.monto||0),0); return `${head('Reportes BI','Visión resumida para decisiones comerciales.')}<div class="grid grid-3"><div class="card pad"><span class="small">Ventas registradas</span><h2>${money(total)}</h2></div><div class="card pad"><span class="small">Ticket promedio</span><h2>${money(total/(ventas.length||1))}</h2></div><div class="card pad"><span class="small">Cuentas con formularios</span><h2>${new Set(FormularioService.all().map(f=>f.empresaId)).size}</h2></div></div><div class="card pad" style="margin-top:14px"><h3>Ventas recientes</h3><div class="timeline" style="margin-top:12px">${ventas.map(v=>{const e=EmpresaService.byId(v.empresaId);return `<div class="tl"><div class="tl-icon"><i class="ti ti-cash"></i></div><div class="tl-body"><strong>${money(v.monto)} · ${esc(v.producto)}</strong><br><small>${esc(e?.nombre||'—')} · ${fmtDate(v.fecha)}</small></div></div>`}).join('')}</div></div>`; }};
    Views.importar = {title:'Importar datos', subtitle:'JSON tolerante a campos en español', render(){ return `${head('Importar datos','Carga empresas desde JSON. Acepta claves como Nombre, Tipo, Ciudad, Camas, Latitud y Longitud.')}<div class="card pad"><div id="drop" class="drop"><i class="ti ti-file-import"></i><h3>Arrastra un JSON aquí</h3><p class="small">También puedes pegar el contenido abajo.</p></div><textarea id="importText" class="textarea" style="margin-top:14px;min-height:180px" placeholder='[{"Nombre":"Hospital...","Tipo":"Salud"}]'></textarea><div class="actions" style="margin-top:12px"><button class="btn btn-primary" onclick="App.Actions.importJSON()">Importar empresas</button><button class="btn" onclick="App.Actions.exportJSON()">Exportar backup</button></div></div>`; }};
    Views.sync = {title:'Sincronización', subtitle:'GitHub Gist robusto', render(){ const c=GistSyncService.getConfig(); return `${head('Sincronización GitHub Gist','Token local con permiso gist. El token no se exporta ni se sube al Gist.')}<div class="grid grid-2"><div class="card pad"><h3>Configuración</h3><div class="form-grid" style="margin-top:12px"><div><label class="label">Token GitHub</label><input id="g_token" class="input" type="password" value="${esc(c.token)}" placeholder="ghp_... / fine-grained token"></div><div><label class="label">Gist ID</label><input id="g_id" class="input" value="${esc(c.gistId)}" placeholder="Se llena al crear Gist"></div><div><label class="label">Archivo dentro del Gist</label><input id="g_file" class="input" value="${esc(c.gistFile||'ge-business-hub-pro.json')}"></div><div class="actions"><button class="btn" onclick="App.Actions.saveSyncConfig()">Guardar config</button><button class="btn" onclick="App.Actions.testSync()">Probar conexión</button><button class="btn btn-primary" onclick="App.Actions.createGist()">Crear Gist</button></div></div></div><div class="card pad"><h3>Operaciones</h3><p class="small" style="margin:8px 0">Última sincronización: ${c.lastSyncAt ? new Date(c.lastSyncAt).toLocaleString('es-DO') : 'Nunca'}</p><div class="actions"><button class="btn btn-ok" onclick="App.Actions.uploadGist()"><i class="ti ti-cloud-upload"></i>Subir datos</button><button class="btn btn-warn" onclick="App.Actions.downloadGist()"><i class="ti ti-cloud-download"></i>Bajar datos</button></div><div class="risk" style="margin-top:14px"><i class="ti ti-shield-lock" style="color:var(--ok)"></i><div><strong>Seguridad aplicada</strong><p class="small">El token se guarda en localStorage separado y se excluye de exportaciones/backups.</p></div></div></div></div>`; }};
    Views.arquitectura = {title:'Arquitectura modular', subtitle:'Micro-servicios internos', render(){ return `${head('Arquitectura modular del código','Cada módulo opera como micro-servicio interno independiente dentro del mismo index.html.')} ${microservicesView()}`; }};

    const MapService = (() => { let map; return { render(rows){ const el=document.getElementById('map'); if(!el || typeof L==='undefined') return; if(map){ map.remove(); map=null; } map=L.map(el).setView([19.45,-70.69],12); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map); rows.forEach(e=>L.marker([e.latitud,e.longitud]).addTo(map).bindPopup(`<strong>${esc(e.nombre)}</strong><br>${esc(e.ciudad)}<br>Score ${EmpresaService.score(e)}`)); setTimeout(()=>map.invalidateSize(),120); }}; })();

    const Router = (() => {
      const routes = {dashboard:Views.dashboard, empresas:Views.empresas, pipeline:Views.pipeline, tareas:Views.tareas, rutas:Views.rutas, formularios:Views.formularios, reportes:Views.reportes, importar:Views.importar, sync:Views.sync, arquitectura:Views.arquitectura};
      function go(view){ StateService.set('ui.view', view); render(); UI.toggleSidebar(false); }
      function company(id){ StateService.set('ui.view','company:'+id); render(); }
      function current(){ return StateService.get().ui.view || 'dashboard'; }
      function render(){
        const main=document.getElementById('main');
        try{
          const view=current();
          const [name,arg] = String(view).split(':');
          const v = name==='company' ? Views.company : routes[name] || Views.dashboard;
          document.getElementById('pageTitle').textContent = v.title || 'GE Business Hub Pro';
          document.getElementById('pageSubtitle').textContent = v.subtitle || 'CRM modular';
          main.innerHTML = v.render(arg);
        } catch(err){
          console.error('Error renderizando módulo', err);
          document.getElementById('pageTitle').textContent = 'Error del módulo';
          document.getElementById('pageSubtitle').textContent = 'La app sigue activa; revisa el detalle abajo.';
          main.innerHTML = `<div class="card pad"><h2>No se pudo visualizar esta sección</h2><p class="small" style="margin-top:8px">${esc(err.message || err)}</p><div class="actions" style="margin-top:14px"><button class="btn btn-primary" onclick="App.Router.go('dashboard')">Volver al dashboard</button><button class="btn" onclick="App.Services.State.replace(App.Services.DemoData.build());App.Router.render()">Restablecer datos demo</button></div></div>`;
        }
        UI.renderNav(); UI.renderCompanySelector(); UI.applyTheme(false);
      }
      return {go,company,render,current,routes};
    })();

    const UI = (() => {
      const navGroups = [{label:'Principal',items:[['dashboard','ti-layout-dashboard','Dashboard BI'],['rutas','ti-map-2','Campo & rutas'],['empresas','ti-building','Empresas 360°']]},{label:'Gestión',items:[['pipeline','ti-users','CRM Pipeline'],['tareas','ti-clipboard-list','Tareas'],['formularios','ti-forms','Formularios']]},{label:'Análisis y datos',items:[['reportes','ti-report-analytics','Reportes BI'],['importar','ti-file-import','Importar'],['sync','ti-cloud','Sincronizar'],['arquitectura','ti-topology-star-3','Arquitectura']]}];
      function renderNav(){ const q=(document.getElementById('navSearch')?.value||'').toLowerCase(); const current=Router.current().split(':')[0]; document.getElementById('nav').innerHTML = navGroups.map(g=>{ const items=g.items.filter(i=>i[2].toLowerCase().includes(q)); if(!items.length) return ''; return `<div class="nav-section">${g.label}</div>${items.map(([id,icon,label])=>`<button class="nav-btn ${current===id?'active':''}" onclick="App.Router.go('${id}')"><i class="ti ${icon}"></i>${label}${id==='tareas'&&TareaService.pending().length?`<span class="badge">${TareaService.pending().length}</span>`:''}</button>`).join('')}`; }).join(''); }
      function renderCompanySelector(){ const active=StateService.get().ui.activeCompany; const box=document.getElementById('companySelector'); box.innerHTML=Object.entries(CompanyCatalog).map(([k,c])=>`<button class="company-btn ${active===k?'active':''}" onclick="App.UI.setCompany('${k}')"><span class="dot" style="--c:${c.color}"></span>${c.name}</button>`).join(''); document.getElementById('activeCompanyLabel').textContent = CompanyCatalog[active]?.name || 'Grupo GE'; document.documentElement.style.setProperty('--active-color', CompanyCatalog[active]?.color || 'var(--accent)'); }
      function setCompany(k){ StateService.set('ui.activeCompany',k); Router.render(); }
      function toggleSidebar(force){ const sb=document.getElementById('sidebar'), ov=document.getElementById('mobileOverlay'); const open = force ?? !sb.classList.contains('open'); sb.classList.toggle('open',open); ov.classList.toggle('show',open); }
      function toggleTheme(){ const t=StateService.get().ui.theme==='light'?'dark':'light'; StateService.set('ui.theme',t); applyTheme(); }
      function applyTheme(refreshSelector=true){
        const state = StateService.get();
        document.documentElement.dataset.theme = state.ui?.theme || 'dark';
        if(refreshSelector) renderCompanySelector();
        const dot=document.getElementById('syncDot'); const label=document.getElementById('syncLabel');
        if(!dot || !label) return;
        const st=state.sync?.status||'synced';
        dot.style.background = st==='error'?'var(--err)':st==='pending'?'var(--warn)':'var(--ok)';
        label.textContent = st==='error'?'Error sync':st==='pending'?'Pendiente':'Al día';
      }
      function quickAdd(){ const v=Router.current().split(':')[0]; if(v==='tareas') Forms.tareaForm(); else if(v==='pipeline') Forms.oportunidadForm(); else if(v==='rutas') Forms.visitaForm(); else Forms.empresaForm(); }
      function openCommand(){ document.getElementById('cmd').classList.add('show'); document.getElementById('cmdInput').focus(); renderCommand(); }
      function closeCommand(e){ if(!e || e.target.id==='cmd') document.getElementById('cmd').classList.remove('show'); }
      function renderCommand(){ const q=(document.getElementById('cmdInput')?.value||'').toLowerCase(); const results=[...Object.entries(Router.routes).map(([id,v])=>({type:'Módulo',label:v.title,go:()=>Router.go(id)})),...EmpresaService.all().map(e=>({type:'Empresa',label:e.nombre,go:()=>Router.company(e.id)})),...TareaService.all().map(t=>({type:'Tarea',label:t.titulo,go:()=>Router.go('tareas')}))].filter(x=>x.label.toLowerCase().includes(q)).slice(0,20); document.getElementById('cmdResults').innerHTML = results.map((r,i)=>`<div class="cmd-item" onclick="App.UI.commandGo(${i})"><div class="avatar" style="width:34px;height:34px;border-radius:12px">${r.type[0]}</div><div><strong>${esc(r.label)}</strong><div class="small">${r.type}</div></div></div>`).join('') || empty('ti-search','Sin resultados'); UI._cmdResults=results; }
      function commandGo(i){ UI._cmdResults[i]?.go(); closeCommand(); }
      return {renderNav,renderCompanySelector,setCompany,toggleSidebar,toggleTheme,applyTheme,quickAdd,openCommand,closeCommand,renderCommand,commandGo,_cmdResults:[]};
    })();

    const Actions = (() => {
      function importJSON(){ try{ const txt=document.getElementById('importText').value.trim(); if(!txt) throw new Error('Pega un JSON primero.'); const data=JSON.parse(txt); const rows=Array.isArray(data)?data:(data.empresas||[]); const ok=EmpresaService.importRows(rows); Router.render(); ToastService.show(`${ok} empresas importadas`,'ok'); } catch(e){ ToastService.show(e.message,'err'); } }
      function exportJSON(){ const blob=new Blob([JSON.stringify(StorageService.exportSafe(StateService.get()),null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='ge-business-hub-pro-backup.json'; a.click(); URL.revokeObjectURL(a.href); }
      function saveSyncConfig(){ GistSyncService.setConfig({token:val('g_token'),gistId:val('g_id'),gistFile:val('g_file')}); ToastService.show('Configuración guardada','ok'); Router.render(); }
      async function testSync(){ try{ saveSyncConfig(); const me=await GistSyncService.test(); ToastService.show(`Conexión OK: ${me.login}`,'ok'); } catch(e){ ToastService.show(syncError(e),'err'); } }
      async function createGist(){ try{ saveSyncConfig(); const g=await GistSyncService.create(); ToastService.show(`Gist creado: ${g.id}`,'ok'); Router.render(); } catch(e){ ToastService.show(syncError(e),'err'); } }
      async function uploadGist(){ try{ saveSyncConfig(); await GistSyncService.upload(); ToastService.show('Datos subidos al Gist','ok'); Router.render(); } catch(e){ ToastService.show(syncError(e),'err'); } }
      async function downloadGist(){ try{ saveSyncConfig(); await GistSyncService.download(); ToastService.show('Datos descargados del Gist','ok'); Router.render(); } catch(e){ ToastService.show(syncError(e),'err'); } }
      function syncError(e){ const m=String(e.message||e); if(m.includes('401')) return '401: token inválido o expirado.'; if(m.includes('403')) return '403: el token no tiene permiso gist o excediste el límite.'; if(m.includes('404')) return '404: Gist no encontrado o no tienes acceso.'; if(m.includes('422')) return '422: datos inválidos para crear/actualizar el Gist.'; return m; }
      function val(id){ return document.getElementById(id)?.value?.trim() || ''; }
      return {importJSON,exportJSON,saveSyncConfig,testSync,createGist,uploadGist,downloadGist};
    })();

    function head(title,desc,action,label){ return `<div class="section-head"><div><h1>${esc(title)}</h1><p>${esc(desc)}</p></div><div class="spacer"></div>${action?`<button class="btn btn-primary keep" onclick="${action}"><i class="ti ti-plus"></i><span>${label}</span></button>`:''}</div>`; }
    function empty(icon,msg){ return `<div class="empty"><i class="ti ${icon}"></i>${esc(msg)}</div>`; }
    function taskLine(t){ const e=EmpresaService.byId(t.empresaId); return `<div class="tl"><div class="tl-icon"><i class="ti ti-checklist"></i></div><div class="tl-body"><strong>${esc(t.titulo)}</strong><br><small>${esc(e?.nombre||'—')} · ${fmtDate(t.vence)} · ${esc(t.prioridad)}</small></div></div>`; }
    function microservicesView(){ const cards=[['StateService','Estado único, patch por ruta, eventos de cambio'],['StorageService','Persistencia local y exportación segura'],['GistSyncService','Crear, subir, bajar y probar GitHub Gist'],['EmpresaService','CRUD, importación, score y riesgo'],['TareaService','Seguimiento y acciones pendientes'],['BIService','KPIs, funnel, riesgo y próxima acción'],['Router','Vistas independientes y renderizado'],['Views/*','Cada sección como módulo aislado actualizable']]; return `<div class="grid grid-4">${cards.map(c=>`<div class="card pad micro-card"><h3>${c[0]}</h3><p class="small" style="margin-top:8px">${c[1]}</p></div>`).join('')}</div>`; }

    function init(){ window.addEventListener('online',()=>document.getElementById('offline').classList.remove('show')); window.addEventListener('offline',()=>document.getElementById('offline').classList.add('show')); document.addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); UI.openCommand(); } if(e.key==='Escape'){ ModalService.close(); UI.closeCommand(); }}); Bus.on('state:changed',()=>UI.applyTheme()); Router.render(); }

    return {init,Router,UI,Forms,Modal:ModalService,Toast:ToastService,Actions,Services:{DemoData,Empresa:EmpresaService,Contacto:ContactoService,Oportunidad:OportunidadService,Tarea:TareaService,Visita:VisitaService,Venta:VentaService,Formulario:FormularioService,BI:BIService,GistSync:GistSyncService,Storage:StorageService,State:StateService,Bus}};
  })();
  window.App = App;
  document.addEventListener('DOMContentLoaded', App.init);
  </script>
</body>
