<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>GE Business Hub Pro</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f5f5f7;--bg3:#ebebef;
  --txt:#111;--txt2:#555;--txt3:#999;
  --brd:#e0e0e0;--brd2:#ccc;
  --ok:#059669;--okb:#d1fae5;
  --warn:#d97706;--warnb:#fef3c7;
  --err:#dc2626;--errb:#fee2e2;
  --acc:#4f46e5;--accb:#eef2ff;
  --r:8px;--rl:12px;--sh:0 1px 3px rgba(0,0,0,.08);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#111118;--bg2:#1a1a28;--bg3:#242438;
  --txt:#f0f0f0;--txt2:#a0a0b8;--txt3:#606080;
  --brd:#2a2a40;--brd2:#383858;
  --ok:#34d399;--okb:#064e3b;
  --warn:#fbbf24;--warnb:#451a03;
  --err:#f87171;--errb:#450a0a;
  --acc:#818cf8;--accb:#1e1b4b;
  --sh:0 2px 8px rgba(0,0,0,.4);
}}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:var(--txt);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:.5px solid var(--brd2);background:none;color:var(--txt);border-radius:var(--r);padding:5px 12px;font-size:13px;transition:.14s;line-height:1}
button:hover{background:var(--bg2)} button:active{opacity:.82}
.btn-primary{background:var(--co,var(--acc));color:#fff;border-color:var(--co,var(--acc))}
.btn-primary:hover{opacity:.88;background:var(--co,var(--acc))}
.btn-ok{background:var(--okb);color:var(--ok);border-color:var(--ok)30}
.btn-err{background:var(--errb);color:var(--err);border-color:var(--err)30}
.btn-sm{font-size:11px;padding:3px 9px}
.btn-xs{font-size:10px;padding:2px 7px}
input,select,textarea{font-family:inherit;font-size:13px;background:var(--bg);color:var(--txt);border:.5px solid var(--brd2);border-radius:var(--r);padding:7px 10px;width:100%;outline:none;transition:.14s}
input:focus,select:focus,textarea:focus{border-color:var(--co,var(--acc));box-shadow:0 0 0 2px var(--co,var(--acc))22}
textarea{resize:vertical}
label{font-size:11.5px;color:var(--txt2);display:block;margin-bottom:4px;font-weight:500}
.card{background:var(--bg);border:.5px solid var(--brd);border-radius:var(--rl);padding:16px;box-shadow:var(--sh)}
.kpi{background:var(--bg2);border-radius:var(--r);padding:12px 14px;border:.5px solid var(--brd)}
.kpi-v{font-size:24px;font-weight:500;line-height:1.1}
.kpi-l{font-size:11px;color:var(--txt2);margin-top:3px}
.kpi-d{font-size:10px;margin-top:2px;font-weight:500}
.badge{display:inline-block;padding:2px 8px;border-radius:40px;font-size:11px;font-weight:500}
.tag{display:inline-block;padding:2px 8px;border-radius:40px;font-size:11px;border:.5px solid var(--brd2);color:var(--txt2);background:var(--bg2)}
.pill{padding:3px 10px;border-radius:40px;font-size:11px;border:.5px solid}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ga{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.check{width:18px;height:18px;border-radius:4px;border:.5px solid var(--brd2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:10px;font-weight:700;transition:.14s;user-select:none}
.check.on{background:var(--co,var(--acc));border-color:var(--co,var(--acc));color:#fff}
.progress-track{background:var(--bg3);border-radius:40px;height:5px;overflow:hidden;margin:4px 0}
.progress-fill{height:100%;border-radius:40px;transition:width .35s ease}
hr{border:none;border-top:.5px solid var(--brd);margin:14px 0}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px;backdrop-filter:blur(4px)}
.modal{background:var(--bg);border-radius:var(--rl);border:.5px solid var(--brd);padding:20px 22px;width:min(580px,100%);max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-title{font-size:16px;font-weight:500;margin-bottom:16px}
.fr{margin-bottom:12px}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.mfoot{display:flex;gap:8px;margin-top:18px;justify-content:flex-end}
/* Topbar */
#topbar{background:var(--bg);border-bottom:.5px solid var(--brd);position:sticky;top:0;z-index:100;box-shadow:var(--sh)}
.ti-inner{max-width:1060px;margin:0 auto;padding:0 16px}
.brand-row{display:flex;align-items:center;gap:10px;padding:10px 0 6px}
.bmark{width:34px;height:34px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:500;font-size:13px;flex-shrink:0}
.co-pills{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap}
.co-pill{font-size:11px;padding:4px 10px;border-radius:40px;border:.5px solid var(--brd2);color:var(--txt2);background:none;transition:.14s}
.co-pill.on{color:#fff;border-color:transparent}
.nav-tabs{display:flex;border-top:.5px solid var(--brd);overflow-x:auto;scrollbar-width:none}
.nav-tabs::-webkit-scrollbar{display:none}
.ntab{flex-shrink:0;padding:8px 14px;border:none;background:none;border-bottom:2px solid transparent;font-size:12.5px;color:var(--txt2);cursor:pointer;transition:.14s;display:flex;align-items:center;gap:5px;border-radius:0;white-space:nowrap}
.ntab:hover{background:var(--bg2);color:var(--txt)}
.ntab.on{font-weight:500;border-bottom-color:var(--co,var(--acc))}
#main{max-width:1060px;margin:0 auto;padding:18px 16px 80px}
/* Section */
.sec-hd{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.sec-title{font-size:16px;font-weight:500;display:flex;align-items:center;gap:8px}
.empty{text-align:center;padding:56px 20px;color:var(--txt3);border-radius:var(--rl);border:1.5px dashed var(--brd);background:var(--bg2)}
.empty i{font-size:44px;display:block;margin-bottom:12px;color:var(--txt3)}
.empty .et{font-size:15px;font-weight:500;color:var(--txt2);margin-bottom:6px}
.empty .es{font-size:13px;margin-bottom:18px}
/* Workflow */
.wf-card{background:var(--bg);border:.5px solid var(--brd);border-radius:var(--rl);margin-bottom:10px;overflow:hidden;box-shadow:var(--sh)}
.wf-hd{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:.5px solid var(--brd)}
.wf-steps{display:flex;align-items:stretch;overflow-x:auto;padding:12px 14px;gap:0}
.wf-step{min-width:130px;max-width:200px;flex-shrink:0}
.wf-step-inner{background:var(--bg2);border:.5px solid var(--brd);border-radius:var(--r);padding:8px 10px;height:100%}
.wf-step-label{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.wf-step-val{font-size:12.5px;color:var(--txt);font-weight:500}
.wf-arrow{display:flex;align-items:center;padding:0 6px;color:var(--txt3);font-size:18px;flex-shrink:0}
/* Route */
.route-card{background:var(--bg);border:.5px solid var(--brd);border-radius:var(--rl);margin-bottom:10px;padding:14px;box-shadow:var(--sh)}
.route-stop{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.stop-num{width:24px;height:24px;border-radius:50%;background:var(--co,var(--acc));color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;margin-top:1px}
.stop-connector{width:1px;flex:1;background:var(--brd);margin:0 12px}
/* Pipeline */
.pipeline{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.pipe-col{background:var(--bg2);border:.5px solid var(--brd);border-radius:var(--rl);overflow:hidden}
.pipe-col-hd{padding:8px 12px;font-size:11.5px;font-weight:500;border-bottom:.5px solid var(--brd)}
.pipe-col-body{padding:8px;min-height:80px}
.pipe-card{background:var(--bg);border:.5px solid var(--brd);border-radius:var(--r);padding:8px 10px;margin-bottom:6px;font-size:12px;cursor:grab;box-shadow:var(--sh)}
.pipe-card:active{cursor:grabbing}
/* Survey */
.survey-q{margin-bottom:16px;padding:12px 14px;background:var(--bg2);border-radius:var(--r);border:.5px solid var(--brd)}
.survey-q .qlabel{font-size:13px;font-weight:500;margin-bottom:8px}
.rating-stars{display:flex;gap:4px}
.star{font-size:24px;cursor:pointer;filter:grayscale(1);transition:.12s;line-height:1}
.star.on{filter:none}
/* Report */
.rep-table{width:100%;border-collapse:collapse;font-size:13px}
.rep-table th{padding:8px 12px;background:var(--bg2);color:var(--txt2);font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;border-bottom:.5px solid var(--brd);font-weight:500;white-space:nowrap}
.rep-table td{padding:9px 12px;border-bottom:.5px solid var(--brd);vertical-align:top}
.rep-table tr:last-child td{border-bottom:none}
.rep-table tr:hover td{background:var(--bg2)}
/* Alerts */
.alert{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-radius:var(--r);border:.5px solid;margin-bottom:8px;font-size:13px}
.alert-r{background:var(--errb);border-color:var(--err)40;color:var(--err)}
.alert-y{background:var(--warnb);border-color:var(--warn)40;color:var(--warn)}
.alert-g{background:var(--okb);border-color:var(--ok)40;color:var(--ok)}
/* Print */

/* ─── BI / Intelligence ─── */
.bi-chart-wrap{background:var(--bg2);border:.5px solid var(--brd);border-radius:var(--rl);padding:16px;position:relative}
.bi-chart-title{font-size:12px;font-weight:500;color:var(--txt2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px}
.sparkline{display:flex;align-items:flex-end;gap:3px;height:60px}
.spark-bar{background:var(--co,var(--acc));border-radius:3px 3px 0 0;min-width:14px;transition:.3s ease;opacity:.85}
.spark-bar:hover{opacity:1}
.trend-up{color:var(--ok);font-weight:500}
.trend-dn{color:var(--err);font-weight:500}
/* ─── Client profiles ─── */
.client-card{background:var(--bg);border:.5px solid var(--brd);border-radius:var(--rl);overflow:hidden;transition:.15s;cursor:pointer}
.client-card:hover{border-color:var(--co,var(--acc));transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.15)}
.client-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:16px;flex-shrink:0}
.client-hist-item{display:flex;gap:8px;padding:6px 0;border-bottom:.5px solid var(--brd);font-size:12px}
.client-hist-item:last-child{border-bottom:none}
/* ─── OCR ─── */
.ocr-drop{border:2px dashed var(--brd);border-radius:var(--rl);padding:40px 20px;text-align:center;cursor:pointer;transition:.15s;background:var(--bg2)}
.ocr-drop:hover,.ocr-drop.drag{border-color:var(--co,var(--acc));background:var(--accb,#eef2ff)1a}
.ocr-result-field{background:var(--bg2);border:.5px solid var(--brd);border-radius:var(--r);padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.ocr-result-field label{font-size:11px;color:var(--txt2);width:120px;flex-shrink:0}
.ocr-result-field input{flex:1;background:none;border:.5px solid transparent;border-radius:4px;padding:3px 6px;font-size:13px}
.ocr-result-field input:focus{background:var(--bg);border-color:var(--co,var(--acc));outline:none}
/* ─── Import ─── */
.import-map-row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:6px;font-size:12.5px}
.import-preview{font-family:monospace;font-size:11px;background:var(--bg3);padding:10px;border-radius:var(--r);max-height:200px;overflow-y:auto;white-space:pre;color:var(--txt2)}
/* ─── Satisfaction alert strip ─── */
.sat-alert{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:var(--r);border:.5px solid;margin-bottom:10px;font-size:13px;animation:slideIn .3s ease}
@keyframes slideIn{from{transform:translateX(-8px);opacity:0}to{transform:none;opacity:1}}
/* ─── Route priority bar ─── */
.route-priority{display:flex;align-items:center;gap:6px;font-size:11px}
.priority-pip{width:8px;height:8px;border-radius:50%}
@media print{
  #topbar,.no-print{display:none!important}
  #main{padding:0;max-width:none}
  body{font-size:12px}
  .card,.wf-card,.rep-table{box-shadow:none!important;border:1px solid #ccc!important}
  .btn-primary,.btn-ok,.btn-err,button{display:none!important}
}
/* Responsive */
@media(max-width:640px){
  .g2,.g3,.g4{grid-template-columns:1fr 1fr}
  .g4{grid-template-columns:1fr 1fr}
  .fr2,.fr3{grid-template-columns:1fr}
  .co-pills{display:none}
}
@media(max-width:400px){.g2,.g3,.g4{grid-template-columns:1fr}}
input[type=range]{-webkit-appearance:none;height:4px;background:var(--bg3);border:none;border-radius:40px;padding:0;cursor:pointer;accent-color:var(--co,var(--acc))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--co,var(--acc));cursor:pointer}
</style>
</head>
<body>
<div id="topbar">
  <div class="ti-inner">
    <div class="brand-row">
      <div class="bmark" id="bmark">GE</div>
      <div>
        <div style="font-weight:500;font-size:15px">GE Business Hub Pro</div>
        <div style="font-size:11px;color:var(--txt2)" id="bsub">Ing. Gustavo Espaillat</div>
      </div>
      <div class="co-pills" id="co-pills"></div>
    </div>
    <div class="nav-tabs" id="nav-tabs"></div>
  </div>
</div>
<div id="main"></div>
<div id="modal-root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
'use strict';

/* ═══════════════════════════════════════════
   CONSTANTS
═══════════════════════════════════════════ */
const COS = {
  hemocura:   {label:'Hemocura',    co:'#9B1A1A', sector:'Banco de sangre · HBO · Lab'},
  farmaserv:  {label:'FarmaServ',   co:'#F77F00', sector:'Equipos médicos · TPN'},
  sofa:       {label:'Sofá',        co:'#E31E24', sector:'Facturación médica · ARS'},
  equilibrium:{label:'Equilibrium', co:'#00AEEF', sector:'Nutrición especializada'},
  infecq:     {label:'INFECQ',      co:'#E8793A', sector:'Educación médica continua'},
  epharma:    {label:'E Pharma',    co:'#1B5AB8', sector:'Distribución farmacéutica'},
};

const VIEWS = [
  {id:'dashboard',  label:'Dashboard',     icon:'ti-layout-dashboard'},
  {id:'inteligencia',label:'Inteligencia', icon:'ti-chart-dots'},
  {id:'clientes',   label:'Perfiles CRM',  icon:'ti-id-badge'},
  {id:'tareas',     label:'Pendientes',    icon:'ti-clipboard-list'},
  {id:'rutas',      label:'Rutas IA',      icon:'ti-route'},
  {id:'prospectos', label:'CRM Pipeline',  icon:'ti-users'},
  {id:'encuestas',  label:'Encuestas',     icon:'ti-star'},
  {id:'reportes',   label:'Reportes',      icon:'ti-report'},
  {id:'ocr',        label:'OCR / IA',      icon:'ti-scan'},
  {id:'importar',   label:'Importar',      icon:'ti-file-import'},
  {id:'okr',        label:'OKRs',          icon:'ti-target'},
  {id:'competencia',label:'Competencia',   icon:'ti-sword'},
  {id:'procesos',   label:'Procesos',      icon:'ti-settings-2'},
];

const CITIES = ['Santiago','Puerto Plata','San Francisco de Macorís','Tenares','Santo Domingo','La Vega','Moca','Bonao'];

const HEALTH_CENTERS = {
  Santiago:[
    {name:'Hospital Regional Universitario José María Cabral y Báez',lat:19.4589,lng:-70.6991,type:'Hospital público'},
    {name:'Centro Médico Cibao',lat:19.4521,lng:-70.7023,type:'Clínica privada'},
    {name:'Clínica Corominas',lat:19.4533,lng:-70.6988,type:'Clínica privada'},
    {name:'Hospital Ángel Contreras (Moca)',lat:19.3967,lng:-70.5212,type:'Hospital público'},
    {name:'Clínica Cruz Jiminián',lat:19.4561,lng:-70.6995,type:'Clínica privada'},
    {name:'Hospital Metropolitano de Santiago (HOMS)',lat:19.4602,lng:-70.7047,type:'Hospital privado'},
    {name:'Clínica Unión Médica del Norte',lat:19.4512,lng:-70.7015,type:'Clínica privada'},
    {name:'Centro de Diálisis Santiago',lat:19.4545,lng:-70.7002,type:'Centro especializado'},
  ],
  'Puerto Plata':[
    {name:'Hospital Ricardo Limardo',lat:19.7946,lng:-70.6914,type:'Hospital público'},
    {name:'Centro Médico Puerto Plata',lat:19.7921,lng:-70.6895,type:'Clínica privada'},
  ],
  'San Francisco de Macorís':[
    {name:'Hospital Inmaculada Concepción',lat:19.3013,lng:-70.2525,type:'Hospital público'},
    {name:'Centro Médico San Francisco',lat:19.3025,lng:-70.2518,type:'Clínica privada'},
  ],
  Tenares:[
    {name:'Hospital Municipal Tenares',lat:19.3456,lng:-70.3215,type:'Hospital municipal'},
  ],
  'Santo Domingo':[
    {name:'Hospital Dr. Salvador B. Gautier',lat:18.4782,lng:-69.9388,type:'Hospital público'},
    {name:'Clínica Abreu',lat:18.4801,lng:-69.9421,type:'Clínica privada'},
    {name:'Centro Médico UCE',lat:18.4755,lng:-69.9367,type:'Hospital privado'},
  ],
};

const PIPE_STAGES = ['Prospecto','Contactado','Reunión','Propuesta','Negociación','Cerrado'];
const TASK_STATUS = {pending:'Pendiente',inprogress:'En progreso',done:'Completado',blocked:'Bloqueado'};
const TASK_STATUS_C = {pending:'var(--warn)',inprogress:'var(--acc)',done:'var(--ok)',blocked:'var(--err)'};

/* ═══════════════════════════════════════════
   STORAGE
═══════════════════════════════════════════ */
const LS = {
  g:(k)=>{try{return JSON.parse(localStorage.getItem('hub2_'+k))||null}catch{return null}},
  s:(k,v)=>{try{localStorage.setItem('hub2_'+k,JSON.stringify(v))}catch{}},
};

/* ═══════════════════════════════════════════
   STATE
═══════════════════════════════════════════ */
let S = {
  co:         LS.g('co')         || 'hemocura',
  view:       LS.g('view')       || 'dashboard',
  tasks:      LS.g('tasks')      || [],
  prospects:  LS.g('prospects')  || [],
  surveys:    LS.g('surveys')    || [],
  inspections:LS.g('inspections')|| [],
  tpn:        LS.g('tpn')        || [],
  goals:      LS.g('goals')      || [],
  competitors:LS.g('competitors')|| [],
  processes:  LS.g('processes')  || [],
  actions:    LS.g('actions')    || [],
  routeDate:  today(),
  routeCity:  'Santiago',
  routeSelected:[],
  actFilter:  'pending',
  goalQ:      'Q2',
  repTab:     'hemocura',
  encTab:     'nueva',
  encActive:  null,
  apiKey:     LS.g('apiKey') || '',
  ocrResult:  null,
  clientFilter:'',
  importData: null,
};

let modalOpen = null;

function set(patch){
  if(typeof patch==='function') patch=patch(S);
  Object.assign(S, patch);
  const persist=['co','view','tasks','prospects','surveys','inspections','tpn','goals','competitors','processes','actions'];
  persist.forEach(k=>{ if(patch[k]!==undefined) LS.s(k,S[k]); });
  render();
}

/* ═══════════════════════════════════════════
   UTILS
═══════════════════════════════════════════ */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function today(){return new Date().toISOString().slice(0,10)}
function fmtDate(d){if(!d)return '—';const dt=new Date(d+'T12:00');return dt.toLocaleDateString('es-DO',{day:'2-digit',month:'short',year:'numeric'})}
function daysAgo(d){if(!d)return 9999;return Math.floor((Date.now()-new Date(d))/86400000)}
function pctColor(p){return p>75?'var(--ok)':p>40?'var(--warn)':'var(--err)'}
function co(){return COS[S.co]}
function coColor(){return co().co}
function gv(id){const e=document.getElementById(id);return e?e.value.trim():''}
function empOpts(sel){return Object.entries(COS).map(([k,v])=>`<option value="${k}"${(sel||S.co)===k?' selected':''}>${v.label}</option>`).join('')}

/* ═══════════════════════════════════════════
   TOPBAR
═══════════════════════════════════════════ */

          <div style="font-weight:500;font-size:15px">Centro de Negocio · ${esc(co().label)}</div>

    <div class="kpi-l">${esc(l)}</div>
    ${d?`<div class="kpi-d" style="color:${c}">${esc(d)}</div>`:''}
  </div>`;
}

function dashProcesses(procs,cl){
  const late=procs.filter(p=>{const fi=FREQ_MAP[p.freq]||7;return daysAgo(p.lastDone)>=fi;});
  return `<div class="card">
    <div class="row" style="margin-bottom:10px">
      <div style="font-weight:500"><i class="ti ti-settings-2" style="color:${cl};margin-right:6px"></i>Procesos</div>
      <span style="font-size:11px;color:${late.length?'var(--warn)':'var(--ok)'};margin-left:auto">${late.length?late.length+' vencido(s)':'Al día ✓'}</span>
    </div>
    ${!procs.length?`<div style="text-align:center;padding:18px;color:var(--txt3);font-size:13px">Sin procesos</div>`:
    procs.slice(0,4).map(p=>{const isLate=daysAgo(p.lastDone)>=(FREQ_MAP[p.freq]||7);
      return`<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px">
        <div style="width:8px;height:8px;border-radius:50%;background:${isLate?'var(--warn)':'var(--ok)'};flex-shrink:0"></div>
        <div style="flex:1;font-size:13px">${esc(p.title)}</div>
        <span class="tag" style="font-size:10px">${esc(p.freq||'semanal')}</span>
      </div>`;}).join('')}
  </div>`;
}

function dashAlerts(c,cl){
  const td=today();
  const flags=[];
  /* Satisfaction intelligence alerts */
  const recentSurveys=S.surveys.filter(sv=>sv.co===c).slice(-5);
  if(recentSurveys.length){
    const ratingQs=SURVEY_QS.filter(q=>q.type==='rating');
    const avgScore=Math.round(recentSurveys.reduce((s,sv)=>{
      const sc=ratingQs.map(q=>sv.answers?.[q.id]||0);
      return s+sc.reduce((a,b)=>a+b,0)/(sc.length||1);
    },0)/recentSurveys.length*20);
    if(avgScore<60) flags.push({c:'r',ico:'ti-alert-circle',txt:`Satisfacción crítica: ${avgScore}% — Revisar calidad del servicio urgentemente`,action:"set({view:'encuestas'})"});
    else if(avgScore<75) flags.push({c:'y',ico:'ti-mood-sad',txt:`Satisfacción baja: ${avgScore}% — Considerar encuesta de seguimiento`,action:"set({view:'encuestas'})"});
    /* Detect negative comments */
    const negative=recentSurveys.filter(sv=>(sv.answers?.comments||'').toLowerCase().match(/mal|pésimo|lento|demora|tarde|problema/));
    if(negative.length) flags.push({c:'y',ico:'ti-message-circle-x',txt:`${negative.length} encuesta(s) con comentarios negativos detectados`,action:"set({view:'encuestas'})"});
    /* Clients not recommending */
    const noRec=recentSurveys.filter(sv=>sv.answers?.recommend==='No');
    if(noRec.length>1) flags.push({c:'r',ico:'ti-thumb-down',txt:`${noRec.length} clientes no recomiendan el servicio — Acción correctiva necesaria`,action:"set({view:'encuestas'})"});
  }
  S.tasks.filter(t=>t.co===c&&t.status==='blocked').forEach(t=>flags.push({c:'r',ico:'ti-lock',txt:`Tarea bloqueada: "${t.title}"`,action:"set({view:'tareas'})"}));
  S.tasks.filter(t=>t.co===c&&t.status!=='done'&&t.dueDate&&t.dueDate<td).forEach(t=>flags.push({c:'r',ico:'ti-clock',txt:`Tarea vencida: "${t.title}" (${fmtDate(t.dueDate)})`,action:"set({view:'tareas'})"}));
  S.prospects.filter(p=>p.co===c&&p.stage!=='Cerrado'&&p.followUp&&p.followUp<td).forEach(p=>flags.push({c:'y',ico:'ti-users',txt:`Seguimiento pendiente: ${p.name}`,action:"set({view:'prospectos'})"}));
  if(!flags.length)return '<div style="margin-top:12px"><div class="alert alert-g"><i class="ti ti-circle-check" style="font-size:16px;flex-shrink:0"></i><div>Todo bajo control — sin alertas activas para '+esc(COS[c]?.label||c)+'</div></div></div>';
  return '<div style="margin-top:12px">'+flags.slice(0,5).map(f=>'<div class="alert alert-'+f.c+'" onclick="'+f.action+'" style="cursor:pointer"><i class="ti '+f.ico+'" style="font-size:16px;flex-shrink:0;margin-top:1px"></i><div>'+esc(f.txt)+'</div><i class="ti ti-arrow-right" style="margin-left:auto;flex-shrink:0;opacity:.5"></i></div>').join('')+'</div>';
}

function updateTaskStatus(id,status){
  set({tasks:S.tasks.map(t=>t.id===id?{...t,status}:t)});
}
function deleteTask(id){if(confirm('¿Eliminar tarea?'))set({tasks:S.tasks.filter(t=>t.id!==id)})}

/* ═══════════════════════════════════════════
   RUTAS IA
═══════════════════════════════════════════ */
const FREQ_MAP={diario:1,diaria:1,daily:1,semanal:7,weekly:7,quincenal:14,biweekly:14,mensual:30,monthly:30};
const ROUTE_SPEED_KMH=25; // avg urban speed in DR cities

function renderRutas(){
  const cl=coColor();
  const city=S.routeCity;
  const centers=HEALTH_CENTERS[city]||[];
  const sel=new Set(S.routeSelected||[]);

  // Time projection analytics
  const totalStops=sel.size;
  const estTime=totalStops>0?totalStops*35+15:0; // ~35 min per stop incl. travel
  const optimalTime=totalStops>0?Math.round(totalStops*28+10):0;

  // Demand prediction: day-of-week multiplier
  const dow=new Date(S.routeDate+'T12:00').getDay();
  const dayNames=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const demandByDay=[0.6,1.0,0.95,0.9,0.95,0.85,0.4];
  const demandPct=Math.round(demandByDay[dow]*100);
  const demandColor=demandPct>80?'var(--ok)':demandPct>60?'var(--warn)':'var(--err)';

  return `
    <div class="sec-hd">
      <div class="sec-title"><i class="ti ti-route" style="color:${cl}"></i>Optimización de Rutas IA</div>
    </div>
    <!-- Controls -->
    <div class="card" style="margin-bottom:14px">
      <div class="g3" style="gap:10px;margin-bottom:12px">
        <div><label>Fecha</label>
          <input type="date" value="${S.routeDate}" onchange="set({routeDate:this.value,routeSelected:[]})"></div>
        <div><label>Ciudad</label>
          <select onchange="set({routeCity:this.value,routeSelected:[]})">
            ${CITIES.map(c=>`<option value="${c}"${c===city?' selected':''}>${c}</option>`).join('')}
          </select></div>
        <div><label>Empresa</label><select onchange="set({co:this.value})">${empOpts()}</select></div>
      </div>
      <!-- Predictive analytics bar -->
      <div style="background:var(--bg2);border-radius:var(--r);padding:12px 14px;border:.5px solid var(--brd)">
        <div class="row" style="margin-bottom:8px">
          <i class="ti ti-brain" style="color:${cl};font-size:16px"></i>
          <span style="font-weight:500;font-size:13px">Análisis predictivo · ${dayNames[dow]}, ${fmtDate(S.routeDate)}</span>
        </div>
        <div class="ga" style="gap:8px">
          ${kpi(demandPct+'%','Demanda proyectada',demandColor,demandPct>80?'Día óptimo':demandPct>60?'Demanda media':'Demanda baja')}
          ${kpi(totalStops,'Paradas seleccionadas',cl,'')}
          ${kpi(estTime?estTime+'min':'—','Tiempo estimado','var(--txt2)',estTime?`Óptimo: ${optimalTime}min`:'')}
          ${kpi(totalStops?Math.round(totalStops*8)+' km':'—','Distancia estimada','var(--txt2)','')}
        </div>
        ${demandPct<65?`<div class="alert alert-y" style="margin-top:10px;margin-bottom:0">
          <i class="ti ti-alert-triangle" style="font-size:15px;flex-shrink:0"></i>
          <div>${dayNames[dow]} tiene demanda baja en centros de salud. Considera reagendar visitas administrativas en su lugar.</div>
        </div>`:''}
      </div>
    </div>
    <div class="g2">
      <!-- Center picker -->
      <div class="card">
        <div style="font-weight:500;margin-bottom:10px;font-size:13px"><i class="ti ti-building-hospital" style="color:${cl};margin-right:6px"></i>Centros en ${esc(city)} (${centers.length})</div>
        ${!centers.length?`<div style="color:var(--txt3);font-size:13px;text-align:center;padding:20px">Sin centros mapeados para esta ciudad</div>`:
        centers.map((c,i)=>`
          <div style="display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:.5px solid var(--brd)">
            <div class="check${sel.has(i)?' on':''}" onclick="toggleRouteStop(${i})" style="--co:${cl};margin-top:1px">${sel.has(i)?'<i class="ti ti-check" style="font-size:10px"></i>':''}</div>
            <div style="flex:1">
              <div style="font-size:13px;font-weight:500">${esc(c.name)}</div>
              <div style="font-size:11px;color:var(--txt2);margin-top:2px"><span class="tag" style="font-size:10px">${esc(c.type)}</span></div>
            </div>
            <a href="https://www.google.com/maps/search/${encodeURIComponent(c.name+' '+city+' República Dominicana')}" target="_blank" style="font-size:11px;color:var(--txt2);padding:3px 6px;border:.5px solid var(--brd);border-radius:4px;text-decoration:none"><i class="ti ti-map-pin" style="font-size:12px"></i></a>
          </div>`).join('')}
        <div style="margin-top:10px;display:flex;gap:8px">
          <button onclick="selectAllStops()" class="btn-sm" style="font-size:11px">Seleccionar todo</button>
          <button onclick="set({routeSelected:[]})" class="btn-sm" style="font-size:11px">Limpiar</button>
        </div>
      </div>
      <!-- Generated route -->
      <div class="card">
        <div class="row" style="margin-bottom:12px">
          <div style="font-weight:500;font-size:13px"><i class="ti ti-route" style="color:${cl};margin-right:6px"></i>Ruta optimizada</div>
          ${totalStops>0?`<button class="btn-primary btn-sm" onclick="exportRouteReport()" style="margin-left:auto">Exportar PDF</button>`:''}
        </div>
        ${!totalStops?`<div style="text-align:center;padding:30px;color:var(--txt3);font-size:13px">Selecciona centros de salud para generar la ruta optimizada</div>`:
        `<div>
          ${[...sel].map((idx,order)=>{
            const c=centers[idx]; if(!c)return '';
            const arrTime=addMinutes('08:00',order*35);
            return `<div class="route-stop">
              <div style="display:flex;flex-direction:column;align-items:center">
                <div class="stop-num" style="--co:${cl}">${order+1}</div>
                ${order<totalStops-1?`<div style="width:1px;height:30px;background:var(--brd);margin:3px 0"></div>`:''}
              </div>
              <div style="flex:1;padding-bottom:${order<totalStops-1?'0':'0'}">

                <div style="font-size:11px;color:var(--txt2);margin-top:2px">${esc(c.type)} · Llegada estimada: <strong>${arrTime}</strong></div>
                <div style="font-size:11px;color:var(--txt2)">~30 min visita + 5 min traslado</div>
              </div>
            </div>`;}).join('')}
          <div class="alert alert-g" style="margin-top:12px">
            <i class="ti ti-check" style="font-size:15px;flex-shrink:0"></i>
            <div>Ruta para ${totalStops} parada${totalStops!==1?'s':''} · Inicio 8:00am · Fin estimado: ${addMinutes('08:00',totalStops*35)} · Distancia total: ~${Math.round(totalStops*8)} km</div>
          </div>
        </div>`}
        <div style="margin-top:10px">
          <a href="https://www.google.com/maps/dir/${[...sel].map(i=>encodeURIComponent((centers[i]?.name||'')+', '+city+', República Dominicana')).join('/')}" target="_blank" style="display:block;text-align:center;padding:8px;background:var(--okb);color:var(--ok);border-radius:var(--r);font-size:12px;font-weight:500;text-decoration:none;border:.5px solid var(--ok)30">
            <i class="ti ti-brand-google-maps"></i> Abrir en Google Maps
          </a>
        </div>
      </div>
    </div>`;
}

function toggleRouteStop(i){
  const sel=new Set(S.routeSelected||[]);
  sel.has(i)?sel.delete(i):sel.add(i);
  set({routeSelected:[...sel]});
}
function selectAllStops(){
  const city=S.routeCity;
  const centers=HEALTH_CENTERS[city]||[];
  set({routeSelected:centers.map((_,i)=>i)});
}
function addMinutes(time,mins){
  const [h,m]=time.split(':').map(Number);
  const total=h*60+m+mins;
  return `${String(Math.floor(total/60)%24).padStart(2,'0')}:${String(total%60).padStart(2,'0')}`;
}
function exportRouteReport(){
  const city=S.routeCity;
  const centers=HEALTH_CENTERS[city]||[];
  const sel=S.routeSelected||[];
  const lines=['REPORTE DE RUTA · '+co().label,'Fecha: '+fmtDate(S.routeDate),'Ciudad: '+city,'','PARADAS:'];
  sel.forEach((idx,i)=>{const c=centers[idx];if(c)lines.push(`${i+1}. ${c.name} (${c.type})`);});
  lines.push('','Tiempo estimado: '+(sel.length*35+15)+' minutos');
  lines.push('Distancia estimada: ~'+Math.round(sel.length*8)+' km');
  printText('Ruta_'+city+'_'+S.routeDate,lines);
}

function surveyQuestion(q,answers){
  if(q.type==='rating'){

    return `<div class="survey-q">
      <div class="qlabel">${esc(q.label)}</div>
      <div class="rating-stars" id="stars-${q.id}">
        ${[1,2,3,4,5].map(i=>`<span class="star${i<=val?' on':''}" onclick="setRating('${q.id}',${i})" style="color:#f59e0b">★</span>`).join('')}
      </div>
      <div style="font-size:11px;color:var(--txt3);margin-top:4px" id="rating-lbl-${q.id}">${val?['','Deficiente','Regular','Bueno','Muy bueno','Excelente'][val]:'Sin calificar'}</div>
    </div>`;
  }
  if(q.type==='yesno'){
    const val=answers[q.id]||'';
    return `<div class="survey-q">
      <div class="qlabel">${esc(q.label)}</div>
      <div style="display:flex;gap:8px;margin-top:4px">
        <button onclick="setYN('${q.id}','Sí')" id="yn-si-${q.id}" style="padding:4px 16px;font-size:12px;${val==='Sí'?'background:var(--ok);color:#fff;border-color:var(--ok)':''}">Sí</button>
        <button onclick="setYN('${q.id}','No')" id="yn-no-${q.id}" style="padding:4px 16px;font-size:12px;${val==='No'?'background:var(--err);color:#fff;border-color:var(--err)':''}">No</button>
      </div>
    </div>`;
  }
  return `<div class="survey-q">
    <div class="qlabel">${esc(q.label)}</div>
    <textarea id="sv-txt-${q.id}" rows="2" style="margin-top:6px" placeholder="Escribe aquí...">${esc(answers[q.id]||'')}</textarea>
  </div>`;
}

let _svAnswers={};
function setRating(qid,val){
  _svAnswers[qid]=val;
  const labels=['','Deficiente','Regular','Bueno','Muy bueno','Excelente'];
  document.querySelectorAll(`#stars-${qid} .star`).forEach((s,i)=>s.classList.toggle('on',i<val));
  const lbl=document.getElementById('rating-lbl-'+qid);
  if(lbl)lbl.textContent=labels[val]||'';
}
function setYN(qid,val){
  _svAnswers[qid]=val;
  ['Sí','No'].forEach(v=>{
    const el=document.getElementById('yn-'+(v==='Sí'?'si':'no')+'-'+qid);
    if(el)el.style.cssText=v===val?'padding:4px 16px;font-size:12px;background:'+(v==='Sí'?'var(--ok)':'var(--err)')+';color:#fff;border-color:'+(v==='Sí'?'var(--ok)':'var(--err)'):'padding:4px 16px;font-size:12px;';
  });
}
function clearSurvey(){_svAnswers={};set({encActive:null})}
function saveSurvey(){
  const name=gv('sv-name'); if(!name){alert('Nombre del cliente requerido');return;}
  // collect text answers
  SURVEY_QS.filter(q=>q.type==='text').forEach(q=>{
    const el=document.getElementById('sv-txt-'+q.id);

  const sv={id:uid(),co:gv('sv-co'),name,date:gv('sv-date'),service:gv('sv-service'),answers:{..._svAnswers},createdAt:new Date().toISOString()};

function deleteSurvey(id){if(confirm('¿Eliminar encuesta?'))set({surveys:S.surveys.filter(s=>s.id!==id)})}

function exportSurveysTable(){
  const surveys=S.surveys.filter(sv=>sv.co===S.co);
  const ratingQs=SURVEY_QS.filter(q=>q.type==='rating');
  const lines=[
    'REPORTE DE SATISFACCIÓN · '+co().label,
    'Generado: '+new Date().toLocaleDateString('es-DO'),
    'Total encuestas: '+surveys.length,'',
    'RESULTADOS POR ENCUESTA:','',
  ];
  surveys.forEach((sv,i)=>{
    const scores=ratingQs.map(q=>sv.answers?.[q.id]||0);
    const avg=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length*20):0;
    lines.push(`${i+1}. ${sv.name} · ${fmtDate(sv.date)} · Score: ${avg}%`);
    ratingQs.forEach(q=>{lines.push(`   ${q.label.slice(0,40)}: ${sv.answers?.[q.id]||0}/5`);});
    if(sv.answers?.recommend)lines.push(`   ¿Recomienda?: ${sv.answers.recommend}`);
    if(sv.answers?.comments)lines.push(`   Comentarios: ${sv.answers.comments}`);
    lines.push('');
  });
  if(surveys.length){
    lines.push('PROMEDIOS GENERALES:');
    ratingQs.forEach(q=>{
      const avg=surveys.reduce((s,sv)=>s+(sv.answers?.[q.id]||0),0)/surveys.length;
      lines.push(`  ${q.label.slice(0,40)}: ${avg.toFixed(1)}/5`);
    });
    const recPct=Math.round(surveys.filter(sv=>sv.answers?.recommend!=='No').length/surveys.length*100);
    lines.push(`  Tasa de recomendación: ${recPct}%`);
  }
  printText('Satisfaccion_'+S.co+'_'+today(),lines);
}

function deleteTPN(id){if(confirm('¿Eliminar registro?'))set({tpn:S.tpn.filter(t=>t.id!==id)})}
function deleteInspection(id){if(confirm('¿Eliminar?'))set({inspections:S.inspections.filter(x=>x.id!==id)})}

function exportTPN(){
  const lines=['REGISTRO TPN · FarmaServ','Generado: '+new Date().toLocaleDateString('es-DO'),''];
  S.tpn.forEach((t,i)=>{
    lines.push(`${i+1}. ${t.patient} | Cédula: ${t.cedula||'—'}`);
    lines.push(`   Dx: ${t.diagnosis||'—'} | Serie: ${t.serial||'—'} | Presión: ${t.pressure||'—'} mmHg`);
    lines.push(`   Colocación: ${fmtDate(t.placement)} | Próx. cambio: ${fmtDate(t.nextChange)}`);
    lines.push(`   Médico: ${t.doctor||'—'} | Centro: ${t.center||'—'} | Estado: ${t.status}`);
    lines.push('');
  });
  lines.push(`Total pacientes: ${S.tpn.length} | Activos: ${S.tpn.filter(t=>t.status==='activo').length}`);
  printText('TPN_FarmaServ_'+today(),lines);
}

function exportInspection(id){
  const x=S.inspections.find(i=>i.id===id); if(!x)return;
  const lines=['INFORME DE INSPECCIÓN · Hemocura','',`Sucursal: ${x.branch}`,'Fecha: '+fmtDate(x.date),'Inspector: '+(x.inspector||'—'),'Estado: '+(x.status||'—'),'Score: '+(x.score||0)+'%','','OBSERVACIONES:',x.notes||'Sin observaciones'];
  if(x.checklist&&x.checklist.length){lines.push('','CHECKLIST:');x.checklist.forEach(c=>lines.push(`  ${c.done?'✓':'✗'} ${c.item}`));}
  printText('Inspeccion_'+x.branch+'_'+x.date,lines);
}

function exportAllSurveys(){
  const lines=['REPORTE GLOBAL DE SATISFACCIÓN','Generado: '+new Date().toLocaleDateString('es-DO'),'Total encuestas: '+S.surveys.length,''];
  Object.entries(COS).forEach(([co,cv])=>{
    const svs=S.surveys.filter(sv=>sv.co===co);
    if(!svs.length)return;
    const avg=Math.round(svs.reduce((s,sv)=>{const sc=SURVEY_QS.filter(q=>q.type==='rating').map(q=>sv.answers?.[q.id]||0);return s+sc.reduce((a,b)=>a+b,0)/(sc.length||1);},0)/svs.length*20);
    lines.push(`${cv.label}: ${svs.length} encuestas · Score promedio: ${avg}%`);
  });
  printText('Satisfaccion_Global_'+today(),lines);
}

function okrPct(g){if(!g.krs||!g.krs.length)return 0;return Math.round(g.krs.reduce((s,k)=>s+(k.pct||0),0)/g.krs.length)}

  return `

    goals.map(g=>{

        ${(g.krs||[]).map((kr,i)=>`
          <div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:.5px solid var(--brd)">
            <div class="check${kr.pct>=100?' on':''}" onclick="toggleKR('${g.id}',${i})" style="--co:${cl}">${kr.pct>=100?'<i class="ti ti-check" style="font-size:10px"></i>':''}</div>

          </div>`).join('')}
        <button onclick="openModal('addKR','${g.id}')" style="font-size:11px;padding:4px 10px;margin-top:8px"><i class="ti ti-plus" style="font-size:11px"></i> Key Result</button>
      </div>`;}).join('')}`;
}

function toggleKR(gid,ki){set({goals:S.goals.map(g=>g.id!==gid?g:{...g,krs:g.krs.map((k,i)=>i===ki?{...k,pct:k.pct>=100?0:100}:k)})})}
function updateKR(gid,ki,v){S.goals=S.goals.map(g=>g.id!==gid?g:{...g,krs:g.krs.map((k,i)=>i===ki?{...k,pct:parseInt(v)||0}:k)});LS.s('goals',S.goals)}
function deleteKR(gid,ki){set({goals:S.goals.map(g=>g.id!==gid?g:{...g,krs:g.krs.filter((_,i)=>i!==ki)})})}

/* ═══════════════════════════════════════════
   PDF EXPORT (jsPDF)
═══════════════════════════════════════════ */
function printText(filename,lines){
  if(window.jspdf&&window.jspdf.jsPDF){
    try{
      const {jsPDF}=window.jspdf;
      const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
      doc.setFont('helvetica');
      doc.setFontSize(14);doc.setTextColor(40);
      doc.text(lines[0]||filename,14,18);
      doc.setFontSize(9.5);doc.setTextColor(80);
      let y=28;
      lines.slice(1).forEach(line=>{
        if(y>275){doc.addPage();y=18;}
        if(line===''){y+=3;return}
        const clean=line.replace(/[★☆]/g,'*');
        const wrapped=doc.splitTextToSize(clean,180);
        wrapped.forEach(wl=>{
          if(y>275){doc.addPage();y=18;}
          doc.text(wl,14,y);y+=5;
        });
      });
      doc.save(filename+'.pdf');
      return;
    }catch(e){console.warn('jsPDF error:',e)}
  }
  // Fallback: print window
  const w=window.open('','_blank');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${filename}</title>
    <style>body{font-family:Arial,sans-serif;font-size:12px;color:#111;padding:24px;max-width:700px;margin:0 auto;line-height:1.7}
    h2{font-size:16px;margin-bottom:8px} pre{white-space:pre-wrap;font-family:inherit}</style></head>
    <body><pre>${lines.map(l=>l.replace(/</g,'&lt;').replace(/>/g,'&gt;')).join('\n')}</pre>
    <\/script></body><\/html>`);
  w.document.close();
}

function _buildSurveyText(){
  const name=gv('sv-name')||'estimado cliente';
  const svc=gv('sv-service')||co().sector.split('·')[0].trim();
  return 'Estimado '+name+', gracias por confiar en '+co().label+'. Le invitamos a compartir su experiencia sobre '+svc+'. Su opinión nos ayuda a mejorar continuamente. Por favor complete nuestra encuesta: [Encuesta de Satisfacción '+co().label+']';
}
function shareViaWhatsApp(){
  const tel=prompt('Número WhatsApp del cliente (con código de país, ej: 18091234567):','');
  if(!tel) return;
  const msg=encodeURIComponent(_buildSurveyText());
  window.open('https://wa.me/'+tel.replace(/\D/g,'')+'?text='+msg,'_blank');
}
function shareViaEmail(){
  const email=prompt('Email del cliente:','');
  if(!email) return;
  const sub=encodeURIComponent('Encuesta de Satisfacción — '+co().label);
  const body=encodeURIComponent(_buildSurveyText()+'\n\nEmpresa: '+co().label+'\nFecha: '+today());
  window.location.href='mailto:'+email+'?subject='+sub+'&body='+body;
}
function copyShareLink(){
  const text=_buildSurveyText();
  navigator.clipboard.writeText(text).then(()=>alert('Texto copiado al portapapeles ✓')).catch(()=>{
    prompt('Copia este texto:',text);
  });
}

/* ══════════════════════════════════════════════════════
   INTELIGENCIA COMERCIAL — BI Dashboard
══════════════════════════════════════════════════════ */
function renderInteligencia(){
  const cl=coColor();
  const c=S.co;
  const surveys=S.surveys.filter(sv=>sv.co===c);
  const tasks=S.tasks.filter(t=>t.co===c);
  const prospects=S.prospects.filter(p=>p.co===c);
  const tpnData=S.tpn;

  /* Monthly visit simulation based on tasks */
  const months=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const curM=new Date().getMonth();
  const tasksByMonth=months.map((_,mi)=>tasks.filter(t=>t.createdAt&&new Date(t.createdAt+'T12:00').getMonth()===mi).length);
  const maxT=Math.max(...tasksByMonth,1);

  /* Satisfaction trend */
  const ratingQs=SURVEY_QS.filter(q=>q.type==='rating');
  const svByMonth=months.map((_,mi)=>{
    const m=surveys.filter(sv=>sv.date&&new Date(sv.date+'T12:00').getMonth()===mi);
    if(!m.length) return 0;
    return Math.round(m.reduce((s,sv)=>{const sc=ratingQs.map(q=>sv.answers?.[q.id]||0);return s+sc.reduce((a,b)=>a+b,0)/(sc.length||1);},0)/m.length*20);
  });
  const maxSv=100;

  /* Pipeline conversion */
  const pipeVals=Object.fromEntries(['Prospecto','Contactado','Reunión','Propuesta','Negociación','Cerrado'].map(s=>[s,prospects.filter(p=>p.stage===s).length]));
  const maxP=Math.max(...Object.values(pipeVals),1);

  /* TPN trend (FarmaServ specific) */
  const tpnByMonth=months.map((_,mi)=>tpnData.filter(t=>t.placement&&new Date(t.placement+'T12:00').getMonth()===mi).length);
  const maxTpn=Math.max(...tpnByMonth,1);

  /* Forecast: simple linear projection for next 3 months */
  const recentTasks=tasksByMonth.slice(Math.max(0,curM-2),curM+1);
  const forecast=recentTasks.length>1?Math.round(recentTasks.reduce((a,b)=>a+b,0)/recentTasks.length):0;

  const avgSat=surveys.length?Math.round(surveys.reduce((s,sv)=>{const sc=ratingQs.map(q=>sv.answers?.[q.id]||0);return s+sc.reduce((a,b)=>a+b,0)/(sc.length||1);},0)/surveys.length*20):0;
  const pipeTotal=prospects.length;
  const closedVal=prospects.filter(p=>p.stage==='Cerrado').reduce((s,p)=>s+Number(p.value||0),0);
  const activeTPN=tpnData.filter(t=>t.status==='activo').length;

  const spark=(vals,max,color)=>'<div class="sparkline">'+vals.map((v,i)=>{
    const h=Math.max(Math.round((v/max)*56),4);
    const isNow=i===curM;
    return '<div class="spark-bar" title="'+months[i]+': '+v+'" style="height:'+h+'px;background:'+(isNow?color:color+'88')+'"></div>';
  }).join('')+'</div>';

  return '<div>'+
    '<div class="sec-hd"><div class="sec-title"><i class="ti ti-chart-dots" style="color:'+cl+'"></i>Inteligencia Comercial · '+esc(co().label)+'</div>'+
    '<button onclick="set({view:\'reportes\'})" class="btn-sm" style="margin-left:auto">Ver reportes →</button></div>'+
    '<div class="g4" style="margin-bottom:16px">'+
      '<div class="kpi"><div class="kpi-v" style="color:'+cl+'">'+pipeTotal+'</div><div class="kpi-l">Prospectos activos</div>'+
      '<div class="kpi-d '+(pipeTotal>0?'trend-up':'')+'">'+prospects.filter(p=>p.stage==='Cerrado').length+' cerrados</div></div>'+
      '<div class="kpi"><div class="kpi-v" style="color:'+(avgSat>75?'var(--ok)':avgSat>50?'var(--warn)':'var(--err)')+'">'+avgSat+'%</div>'+
      '<div class="kpi-l">Satisfacción promedio</div><div class="kpi-d">'+surveys.length+' encuestas</div></div>'+
      '<div class="kpi"><div class="kpi-v" style="color:var(--ok)">RD$'+closedVal.toLocaleString()+'</div><div class="kpi-l">Pipeline cerrado</div></div>'+

function saveApiKey(){
  const key=gv('api-key-input');
  if(!key){alert('Ingresa una API key');return;}
  S.apiKey=key; LS.s('apiKey',key);
  render();
  alert('API Key guardada ✓');
}

function handleOCRFile(file){
  if(!file) return;
  if(!S.apiKey){alert('Configura tu API Key de Anthropic primero');return;}
  const out=document.getElementById('ocr-output'); if(!out) return;
  out.innerHTML='<div class="card"><div style="display:flex;align-items:center;gap:10px;padding:20px;color:var(--txt2)">'+
    '<i class="ti ti-loader-2" style="font-size:24px;animation:spin 1s linear infinite"></i>'+
    '<span>Analizando imagen con IA...</span></div></div>'+
    '<style>@keyframes spin{to{transform:rotate(360deg)}}</style>';

  const reader=new FileReader();
  reader.onload=async(e)=>{
    const b64=e.target.result.split(',')[1];
    const mime=file.type||'image/jpeg';
    try{
      const res=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json','x-api-key':S.apiKey,'anthropic-version':'2023-06-01'},
        body:JSON.stringify({
          model:'claude-sonnet-4-20250514',
          max_tokens:1024,
          messages:[{role:'user',content:[
            {type:'image',source:{type:'base64',media_type:mime,data:b64}},
            {type:'text',text:'Eres un asistente de extracción de datos para un sistema de gestión comercial de salud en República Dominicana. Analiza esta imagen y extrae TODOS los datos estructurados que encuentres. Busca especialmente: nombres de pacientes/clientes, fechas, montos/valores en RD$, diagnósticos, nombres de médicos, productos o servicios, cantidades, instituciones/hospitales, números de cédula. Responde SOLO con JSON válido con estos campos (usa null si no existe): {"paciente":null,"cedula":null,"fecha":null,"medico":null,"institucion":null,"servicio":null,"diagnostico":null,"monto":null,"cantidad":null,"observaciones":null,"otros":{}}'}
          ]}]}),
      });
      if(!res.ok){const er=await res.json().catch(()=>({}));out.innerHTML='<div class="card"><div style="color:var(--err);padding:16px">Error '+res.status+': '+(er.error?.message||'Error de API')+'</div></div>';return;}
      const data=await res.json();
      const text=data.content?.[0]?.text||'{}';
      let parsed={};
      try{
        const match=text.match(/\{[\s\S]*\}/);
        if(match) parsed=JSON.parse(match[0]);
      }catch{}
      showOCRResult(parsed,file.name);
    }catch(err){
      out.innerHTML='<div class="card"><div style="color:var(--err);padding:16px">Error de red: '+esc(err.message)+'</div></div>';
    }
  };
  reader.readAsDataURL(file);
}

  const out=document.getElementById('ocr-output'); if(!out) return;
  const cl=coColor();
  const fields=[
    {key:'paciente',label:'Paciente / Cliente'},
    {key:'cedula',label:'Cédula'},
    {key:'fecha',label:'Fecha'},
    {key:'medico',label:'Médico'},
    {key:'institucion',label:'Institución'},
    {key:'servicio',label:'Servicio / Producto'},
    {key:'diagnostico',label:'Diagnóstico'},
    {key:'monto',label:'Monto (RD$)'},
    {key:'cantidad',label:'Cantidad'},
    {key:'observaciones',label:'Observaciones'},
  ];
  const fieldHTML=fields.map(f=>'<div class="ocr-result-field">'+
    '<label>'+esc(f.label)+'</label>'+
    '<input id="ocr-'+f.key+'" value="'+esc(String(data[f.key]||''))+'" placeholder="No detectado">'+
  '</div>').join('');

  out.innerHTML='<div class="card">'+
    '<div class="row" style="margin-bottom:12px">'+
      '<div style="font-weight:500"><i class="ti ti-check" style="color:var(--ok);margin-right:6px"></i>Datos extraídos de: '+esc(filename)+'</div>'+
      '<div style="margin-left:auto;display:flex;gap:6px">'+
        '<button onclick="saveOCRToTPN()" class="btn-sm" style="background:#F77F00;color:#fff;border-color:#F77F00;font-size:11px">Guardar como TPN</button>'+
        '<button onclick="saveOCRToProspect()" class="btn-sm btn-primary" style="font-size:11px">Guardar como prospecto</button>'+
      '</div>'+
    '</div>'+
    fieldHTML+
    (data.otros&&Object.keys(data.otros).length?'<div style="margin-top:10px;font-size:11.5px;color:var(--txt2);background:var(--bg2);padding:8px;border-radius:var(--r)">Datos adicionales: '+JSON.stringify(data.otros)+'</div>':'')+
    '<div class="mfoot">'+
      '<button onclick="document.getElementById(\'ocr-output\').innerHTML=\'\'">Limpiar</button>'+
      '<button onclick="exportOCRtoPDF()" class="btn-sm" style="font-size:12px"><i class="ti ti-file-download"></i> Exportar PDF</button>'+
    '</div>'+
  '</div>';
}

  };
  S.prospects=[...S.prospects,data]; LS.s('prospects',S.prospects);
  alert('Guardado como prospecto ✓'); set({view:'clientes'});
}

function handleImportFile(file){
  if(!file) return;
  const ext=file.name.split('.').pop().toLowerCase();
  const reader=new FileReader();
  reader.onload=(e)=>{
    const text=e.target.result;
    const type=gv('import-type')||'prospects';
    if(ext==='json'){
      try{
        const data=JSON.parse(text);
        previewImport(Array.isArray(data)?data:(data[type]||[]),type,'json');
      }catch{alert('JSON inválido');}
    } else {
      const rows=text.split('\n').filter(Boolean);
      const headers=rows[0].split(',').map(h=>h.trim().replace(/"/g,''));
      const records=rows.slice(1).map(r=>{
        const vals=r.split(',').map(v=>v.trim().replace(/"/g,''));
        const obj={};
        headers.forEach((h,i)=>obj[h]=vals[i]||'');
        return obj;
      });
      previewImport(records,type,'csv');
    }
  };
  reader.readAsText(file,'UTF-8');
}

function previewImport(records,type,fmt){
  const el=document.getElementById('import-preview-area'); if(!el) return;
  if(!records.length){el.innerHTML='<div class="card" style="color:var(--txt2);text-align:center;padding:20px">Sin registros en el archivo</div>';return;}
  const cl=coColor();
  const fieldMap={
    prospects:{name:'nombre|name',contact:'contacto|contact',stage:'etapa|stage',value:'valor|value',notes:'notas|notes',institution:'institucion|institution'},
    tpn:{patient:'paciente|patient',cedula:'cedula',diagnosis:'diagnostico|diagnosis',serial:'serie|serial',placement:'colocacion|placement',doctor:'medico|doctor',center:'centro|center'},
    tasks:{title:'titulo|title',status:'estado|status',project:'proyecto|project',notes:'notas|notes'},
    surveys:{name:'nombre|name',date:'fecha|date',service:'servicio|service'},
  };
  const keys=Object.keys(records[0]);
  el.innerHTML='<div class="card">'+
    '<div style="font-weight:500;margin-bottom:10px">Vista previa: '+records.length+' registros detectados ('+fmt.toUpperCase()+')</div>'+
    '<div class="import-preview">'+esc(JSON.stringify(records.slice(0,3),null,2))+'</div>'+
    '<div style="margin-top:12px;font-size:12px;color:var(--txt2);margin-bottom:8px">Columnas detectadas: '+keys.map(k=>'<code>'+esc(k)+'</code>').join(', ')+'</div>'+
    '<div class="mfoot">'+
      '<button onclick="document.getElementById(\'import-preview-area\').innerHTML=\'\'">Cancelar</button>'+
      '<button onclick="confirmImport('+JSON.stringify(records).replace(/</g,'&lt;')+',\''+type+'\')" class="btn-primary" style="--co:'+cl+'">Importar '+records.length+' registros</button>'+
    '</div>'+
  '</div>';
}

function confirmImport(records,type){
  /* Smart field mapping */
  const mapped=records.map(r=>{
    const lower={};
    Object.entries(r).forEach(([k,v])=>lower[k.toLowerCase().trim()]=v);
    const g=(...keys)=>keys.reduce((v,k)=>v||(lower[k]||lower[k.replace(/[^a-z]/g,'')]||''),'');
    const id=uid();
    if(type==='prospects') return {id,co:S.co,name:g('nombre','name','n'),contact:g('contacto','contact'),stage:g('etapa','stage')||'Prospecto',value:g('valor','value','monto'),institution:g('institucion','institution'),notes:g('notas','notes')};
    if(type==='tpn') return {id,co:'farmaserv',status:'activo',patient:g('paciente','patient','nombre','name'),cedula:g('cedula'),diagnosis:g('diagnostico','diagnosis','dx'),serial:g('serie','serial'),placement:g('colocacion','placement','fecha'),doctor:g('medico','doctor'),center:g('centro','center'),notes:g('notas','notes')};
    if(type==='tasks') return {id,co:S.co,status:g('estado','status')||'pending',title:g('titulo','title','nombre','name'),project:g('proyecto','project'),notes:g('notas','notes')};
    return {id,co:S.co,...r};
  });

  const patch={};
  if(type==='prospects') patch.prospects=[...S.prospects,...mapped];
  else if(type==='tpn') patch.tpn=[...S.tpn,...mapped];
  else if(type==='tasks') patch.tasks=[...S.tasks,...mapped];
  else if(type==='surveys') patch.surveys=[...S.surveys,...mapped];
  set(patch);
  alert(mapped.length+' registros importados correctamente ✓');
  set({view:type==='prospects'?'clientes':type==='tpn'?'reportes':type});
}

function exportData(type){
  let rows=[]; let headers=[];
  if(type==='prospects'){
    headers=['id','empresa','nombre','contacto','etapa','valor','institucion','followUp','notas'];
    rows=S.prospects.map(p=>[p.id,COS[p.co]?.label||p.co,p.name,p.contact,p.stage,p.value,p.institution,p.followUp,p.notes]);
  } else if(type==='tpn'){
    headers=['id','paciente','cedula','diagnostico','serie','presion','colocacion','proximo_cambio','medico','centro','estado','notas'];
    rows=S.tpn.map(t=>[t.id,t.patient,t.cedula,t.diagnosis,t.serial,t.pressure,t.placement,t.nextChange,t.doctor,t.center,t.status,t.notes]);
  } else if(type==='surveys'){
    headers=['id','empresa','nombre','fecha','servicio','score_general','score_velocidad','score_calidad','score_comunicacion','recomienda','comentarios'];
    rows=S.surveys.map(sv=>[sv.id,COS[sv.co]?.label||sv.co,sv.name,sv.date,sv.service,sv.answers?.overall||0,sv.answers?.speed||0,sv.answers?.quality||0,sv.answers?.communication||0,sv.answers?.recommend||'',sv.answers?.comments||'']);
  }
  const csv=[headers.join(','),...rows.map(r=>r.map(v=>'"'+(String(v||'').replace(/"/g,'""'))+'"').join(','))].join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=type+'_export_'+today()+'.csv'; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function exportAllJSON(){
  const data={prospects:S.prospects,tpn:S.tpn,surveys:S.surveys,tasks:S.tasks,goals:S.goals,competitors:S.competitors,processes:S.processes,inspections:S.inspections,exportDate:new Date().toISOString(),version:'GE-Hub-Pro-2025'};

  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='GEHub_backup_'+today()+'.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
