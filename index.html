const EventBus = (() => {
 const events = new Map();
 return {
  on(event, handler){ if(!events.has(event)) events.set(event,new Set()); events.get(event).add(handler); return ()=>events.get(event).delete(handler); },
  emit(event, payload){ (events.get(event)||[]).forEach(fn=>{ try{ fn(payload); }catch(e){ console.error("EventBus",event,e); } }); }
 };
})();

const Store = (() => {
 let state;
 const load = () => {
   try { state = JSON.parse(localStorage.getItem(LS_KEY)) || seedData(); }
   catch { state = seedData(); }
   persist(false);
 };
 const persist = (emit=true) => {
   localStorage.setItem(LS_KEY, JSON.stringify(state));
   if(emit){ EventBus.emit("state:changed", deepClone(state)); Sync.scheduleAutoPush(); }
 };
 const get = () => deepClone(state);
 const set = (next, reason="set") => { state = deepClone(next); state.updatedAt = nowISO(); persist(true); EventBus.emit(reason, get()); };
 const update = (mutator, reason="store:update") => { const draft = deepClone(state); mutator(draft); set(draft, reason); };
 const add = (key, record) => update(s => { s[key].push(record); }, `${key}:add`);
 const patch = (key,id,patch) => update(s => { const item=s[key].find(x=>x.id===id); if(item) Object.assign(item, patch); }, `${key}:patch`);
 const remove = (key,id) => update(s => { s[key]=s[key].filter(x=>x.id!==id); }, `${key}:remove`);
 load();
 return { get, set, update, add, patch, remove, persist, key:LS_KEY };
})();

const Analytics = {
 companyData(){
  const s=Store.get(), emp=s.activeCompany;
  const contacts=s.contacts.filter(x=>x.empresaId===emp);
  const tasks=s.tasks.filter(x=>x.empresaId===emp);
  const sales=s.sales.filter(x=>x.empresaId===emp);
  const open=s.opportunities.filter(x=>x.empresaId===emp && !["ganada","perdida"].includes(x.fase));
  return {contacts,tasks,sales,open,revenue:sales.reduce((a,b)=>a+Number(b.total||0),0)};
 },
 lastSale(contactId){
  return Store.get().sales.filter(s=>s.contactId===contactId).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)))[0];
 },
 inactiveHemocura(days=30){
  const s=Store.get(); const limit=Date.now()-days*864e5;
  return s.contacts.filter(c=>c.empresaId==="hemocura").filter(c=>{
    const last=Analytics.lastSale(c.id);
    return !last || new Date(last.fecha).getTime()<limit;
  }).slice(0,8);

const MapModule = {
 map:null,layers:{},markers:{},
 render(){
  byId("mapa").innerHTML = `<div class="panel-hd"><div><div class="panel-title">Mapa Inteligente & Enrutamiento</div><div class="panel-sub">Ruta de hoy, visitas históricas y sugerencias geográficas.</div></div><div class="actions"><label class="badge b-neu"><input type="checkbox" id="ly-today" checked onchange="App.Map.draw()"> Ruta hoy</label><label class="badge b-neu"><input type="checkbox" id="ly-history" checked onchange="App.Map.draw()"> Historial</label></div></div>
  <div class="map-layout"><div><div id="map"></div></div><div class="card"><div class="card-title">Tabla de ruta dinámica</div><div class="card-sub">Orden por prioridad + distancia Haversine.</div><br><div id="route-table"></div></div></div>`;
  setTimeout(()=>MapModule.init(),30);
 },
 init(){
  if(MapModule.map){ MapModule.map.remove(); MapModule.map=null; }
  MapModule.map=L.map("map",{zoomControl:true}).setView([19.4517,-70.6970],12);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(MapModule.map);
  MapModule.draw();
 },
 draw(){
  if(!MapModule.map) return;
  Object.values(MapModule.layers).forEach(l=>l.remove()); MapModule.layers={}; MapModule.markers={};
  const s=Store.get(), emp=s.activeCompany;
  const todayTasks=s.tasks.filter(t=>t.empresaId===emp&&t.fecha===today()).map(t=>({t,c:s.contacts.find(c=>c.id===t.contactId)})).filter(x=>x.c?.lat&&x.c?.lng).sort(MapModule.routeSort);
  const history=s.tasks.filter(t=>t.empresaId===emp&&t.estado==="completada").map(t=>({t,c:s.contacts.find(c=>c.id===t.contactId)})).filter(x=>x.c?.lat&&x.c?.lng);
  const gToday=L.layerGroup(); const gHist=L.layerGroup();
  if(byId("ly-today")?.checked){
    todayTasks.forEach(({t,c})=>{ const m=L.circleMarker([c.lat,c.lng],{radius:9,color:t.estado==="completada"?"#5AAA82":(t.prioridad==="alta"?"#C84B5A":"#D4943A"),fillOpacity:.88}).bindPopup(MapModule.popup(t,c)); m.addTo(gToday); MapModule.markers[t.id]=m; });
    const latlngs=todayTasks.map(x=>[x.c.lat,x.c.lng]); if(latlngs.length>1) L.polyline(latlngs,{color:"#4A8EC4",weight:4,opacity:.75}).addTo(gToday);
    gToday.addTo(MapModule.map); MapModule.layers.today=gToday;
  }
  if(byId("ly-history")?.checked){
    history.forEach(({t,c})=>L.circleMarker([c.lat,c.lng],{radius:6,color:"#5AAA82",fillOpacity:.25,opacity:.35}).bindPopup(`${esc(c.nombre)}<br>Visita completada`).addTo(gHist));
    gHist.addTo(MapModule.map); MapModule.layers.history=gHist;
  }
  if(todayTasks.length) MapModule.map.fitBounds(todayTasks.map(x=>[x.c.lat,x.c.lng]),{padding:[30,30]});
  MapModule.routeTable(todayTasks);
 },
 routeSort(a,b){
  const p={alta:0,media:1,baja:2}; return (p[a.t.prioridad]??1)-(p[b.t.prioridad]??1) || (a.t.hora||"").localeCompare(b.t.hora||"");
 },
 popup(t,c){
  const wa=c.telefono?`https://api.whatsapp.com/send?phone=1${c.telefono.replace(/\D/g,"")}`:"#";
  return `<b>${esc(c.nombre)}</b><br><span>${esc(c.direccion||c.ciudad||"")}</span><br><span class="badge b-${empColor[c.empresaId]}">${esc(c.fase||"prospecto")}</span><hr><b>${esc(t.hora)} · ${esc(t.titulo)}</b><br>Estado: ${esc(t.estado)}<br><div style="margin-top:8px;display:flex;gap:5px;flex-wrap:wrap"><button onclick="App.Agenda.complete('${t.id}')">Completar</button><button onclick="App.Contacts.open('${c.id}')">Editar ficha</button><a target="_blank" href="${wa}">WhatsApp</a></div>`;
 },
 routeTable(items){
  byId("route-table").innerHTML = `<div class="table-wrap"><table class="tbl"><thead><tr><th>Hora</th><th>Contacto</th><th>Prioridad</th><th></th></tr></thead><tbody>${items.map(({t,c})=>`<tr><td>${esc(t.hora)}</td><td>${esc(c.nombre)}</td><td>${esc(t.prioridad)}</td><td><button class="btn sm" onclick="App.Map.focusTask('${t.id}')">Ver</button></td></tr>`).join("")||"<tr><td colspan='4'>Sin ruta</td></tr>"}</tbody></table></div>`;
 },
 focusTask(id){
  Router.go("mapa"); setTimeout(()=>{ const s=Store.get(), t=s.tasks.find(x=>x.id===id), c=s.contacts.find(x=>x.id===t?.contactId); if(MapModule.map&&c?.lat){ MapModule.map.setView([c.lat,c.lng],16,{animate:true}); MapModule.markers[id]?.openPopup(); }},120);
 }

 render(){

  <div class="grid g2"><div class="card"><div class="card-title">GitHub Gist Sync</div><br>
    <div class="form-row fr1"><div class="field"><label class="label">GitHub PAT</label><input id="cfg-pat" class="input" type="password" value="${esc(cfg.pat)}" placeholder="github_pat_..."></div></div>
    <div class="form-row fr1"><div class="field"><label class="label">Gist ID</label><input id="cfg-gist" class="input" value="${esc(cfg.gistId)}"></div></div>
    <label><input id="cfg-auto" type="checkbox" ${cfg.autoSync?"checked":""}> Auto-sync silencioso</label><br><br>
    <div class="actions"><button class="btn" onclick="App.Sync.saveConfig()">Guardar</button><button class="btn f" onclick="App.Sync.createGist()">Crear Gist</button><button class="btn primary" onclick="App.Sync.push()">Push</button><button class="btn" onclick="App.Sync.pull()">Pull</button></div>
    <div class="item-meta" style="margin-top:10px">Última sync: ${esc(cfg.lastSync||"Nunca")}</div>
  </div><div class="card"><div class="card-title">OTA Updates</div><br><div class="form-row fr1"><div class="field"><label class="label">URL version.json</label><input id="cfg-version" class="input" value="${esc(cfg.versionUrl||"version.json")}"></div></div><button class="btn" onclick="App.Sync.saveConfig();App.Sync.checkVersion()">Verificar versión</button><br><br><span class="badge b-neu">Versión local ${APP_VERSION}</span></div></div>`;
 },
 readConfig(){ return {pat:byId("cfg-pat")?.value||"",gistId:byId("cfg-gist")?.value||"",autoSync:!!byId("cfg-auto")?.checked,versionUrl:byId("cfg-version")?.value||"version.json"}; }
};

const Sync = {
 _timer:null,
 open(){ Router.go("settings"); },
 saveConfig(){
  const next=Settings.readConfig();
  next.gistId = Sync.normalizeGistId(next.gistId);
  Store.update(s=>{s.settings={...s.settings,...next};},"sync:config");
  UI.toast("Configuración guardada");
 },
 normalizeGistId(value){
  const raw=String(value||"").trim();
  if(!raw) return "";
  const clean=raw.replace(/\/$/,"");
  const match=clean.match(/([a-f0-9]{20,40})$/i);
  return match ? match[1] : clean;
 },
 headers(pat){
  return {
   "Authorization":`Bearer ${String(pat||"").trim()}`,
   "Accept":"application/vnd.github+json",
   "X-GitHub-Api-Version":"2022-11-28",
   "Content-Type":"application/json"
  };
 },
 async readError(res){
  let body="";
  try{ body=await res.text(); }catch{}
  let msg=body;
  try{ const json=JSON.parse(body); msg=json.message || body; }catch{}
  if(res.status===404) return "404 Not Found: el Gist ID no existe, no pertenece a esta cuenta, es privado y el PAT no tiene permiso, o pegaste una URL completa en vez del ID. Usa Crear Gist o pega solo el ID final del enlace.";
  if(res.status===401) return "401 Unauthorized: el PAT es inválido, expiró o no fue guardado correctamente.";
  if(res.status===403) return "403 Forbidden: el PAT no tiene permiso de escritura para Gists o GitHub bloqueó la petición.";
  if(res.status===422) return "422 Validation Failed: GitHub rechazó el contenido enviado al Gist.";
  return `${res.status} ${msg}`;
 },
 async ensureRemote(cfg){
  const gistId=Sync.normalizeGistId(cfg.gistId);
  const res=await fetch(`https://api.github.com/gists/${gistId}`,{headers:Sync.headers(cfg.pat),cache:"no-store"});
  if(!res.ok) throw new Error(await Sync.readError(res));
  return await res.json();
 },
 async createGist(){
  Sync.saveConfig(); const cfg=Store.get().settings; if(!cfg.pat) return UI.toast("Indica un PAT de GitHub","err");
  try{
   const payload={description:"GE Business Hub Pro Sync",public:false,files:{[SYNC_FILE]:{content:JSON.stringify(Store.get(),null,2)}}};
   const res=await fetch("https://api.github.com/gists",{method:"POST",headers:Sync.headers(cfg.pat),body:JSON.stringify(payload)});
   if(!res.ok) throw new Error(await Sync.readError(res));
   const data=await res.json(); Store.update(s=>{s.settings.gistId=data.id;s.settings.lastSync=nowISO();},"sync:created"); UI.toast("Gist creado y vinculado");
   Router.go("settings");
  }catch(e){ console.error(e); UI.toast("Error creando Gist: "+e.message,"err"); }
 },
 async push(){
  Sync.saveConfig(); const cfg=Store.get().settings; const gistId=Sync.normalizeGistId(cfg.gistId);
  if(!cfg.pat||!gistId) return UI.toast("PAT y Gist ID son obligatorios","err");
  try{
   await Sync.ensureRemote({...cfg,gistId});
   const payload={files:{[SYNC_FILE]:{content:JSON.stringify(Store.get(),null,2)}}};
   const res=await fetch(`https://api.github.com/gists/${gistId}`,{method:"PATCH",headers:Sync.headers(cfg.pat),body:JSON.stringify(payload)});
   if(!res.ok) throw new Error(await Sync.readError(res));
   Store.update(s=>{s.settings.gistId=gistId;s.settings.lastSync=nowISO();},"sync:pushed"); UI.toast("Datos subidos al Gist");
  }catch(e){ console.error(e); UI.toast("Error push: "+e.message,"err"); }
 },
 async pull(){
  Sync.saveConfig(); const cfg=Store.get().settings; const gistId=Sync.normalizeGistId(cfg.gistId);
  if(!cfg.pat||!gistId) return UI.toast("PAT y Gist ID son obligatorios","err");
  try{
   const gist=await Sync.ensureRemote({...cfg,gistId});
   let file=gist.files[SYNC_FILE] || Object.values(gist.files||{})[0];
   if(!file) throw new Error("El Gist no contiene archivos para importar.");
   let content=file.content;
   if(file.truncated && file.raw_url){ const raw=await fetch(file.raw_url,{cache:"no-store"}); if(!raw.ok) throw new Error("No se pudo leer raw_url del Gist."); content=await raw.text(); }
   const remote=JSON.parse(content); Store.set({...remote,settings:{...Store.get().settings,...remote.settings,gistId,lastSync:nowISO()}},"sync:pulled"); UI.toast("Datos descargados del Gist");
  }catch(e){ console.error(e); UI.toast("Error pull: "+e.message,"err"); }
 },
 scheduleAutoPush: debounce(()=>{ const cfg=Store.get().settings; if(cfg.autoSync&&cfg.pat&&cfg.gistId) Sync.push(); },180000),
 async checkVersion(){
  const cfg=Store.get().settings || {};
  try{
   const res=await fetch(cfg.versionUrl || "version.json",{cache:"no-store"}); if(!res.ok) return;
   const v=await res.json(); if(v.version && v.version !== APP_VERSION){ const ota=byId("ota"); ota.style.display="block"; ota.innerHTML=`Nueva versión disponible: ${esc(v.version)} <button class="btn sm warn" onclick="location.reload()">Recargar</button>`; }
  }catch{}
 }
};

 downloadCSV(){

 }
};
