<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0F1E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GE Business Hub Pro</title>

<!-- Open Source CDN stack -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/tabler-icons.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV/XN/WLcE=" crossorigin=""></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>
/* ══════════════════════════════════════════════════════════════
   DESIGN TOKENS — Premium dark theme con variables semánticas
══════════════════════════════════════════════════════════════ */
:root{
  /* Backgrounds */
  --bg-base:#07091A;
  --bg-surface:#0D1228;
  --bg-elevated:#131836;
  --bg-card:#171D3F;
  --bg-hover:#1D2449;
  --bg-input:#0F1530;

  /* Borders */
  --brd:#1E2545;
  --brd-hover:#2A3566;
  --brd-focus:#4F6FFF;

  /* Text */
  --txt:#EEF2FF;
  --txt-2:#8896CC;
  --txt-3:#4A5A88;
  --txt-4:#2A3565;

  /* Accent system */
  --acc:#4F6FFF;
  --acc-hover:#6A87FF;
  --acc-glow:rgba(79,111,255,.25);
  --acc2:#A78BFA;
  --acc2-glow:rgba(167,139,250,.2);

  /* Semantic */
  --ok:#34D399;    --ok-bg:rgba(52,211,153,.1);    --ok-brd:rgba(52,211,153,.25);
  --warn:#F59E0B;  --warn-bg:rgba(245,158,11,.1);  --warn-brd:rgba(245,158,11,.25);
  --err:#F87171;   --err-bg:rgba(248,113,113,.1);  --err-brd:rgba(248,113,113,.25);
  --info:#38BDF8;  --info-bg:rgba(56,189,248,.1);  --info-brd:rgba(56,189,248,.25);

  /* Company colors */
  --c-hem:#C84040; --c-far:#E87F20; --c-sof:#E83438;
  --c-equ:#00AEEF; --c-inf:#E8793A; --c-eph:#1B6AC8;

  /* Spacing */
  --gap-xs:4px; --gap-s:8px; --gap-m:12px; --gap-l:16px; --gap-xl:24px;

  /* Radius */
  --r-s:6px; --r-m:10px; --r-l:14px; --r-xl:20px; --r-full:9999px;

  /* Shadows */
  --shadow-s:0 1px 3px rgba(0,0,0,.4);
  --shadow-m:0 4px 16px rgba(0,0,0,.4);
  --shadow-l:0 8px 32px rgba(0,0,0,.5);
  --shadow-glow:0 0 20px var(--acc-glow);

  /* Motion */
  --ease:cubic-bezier(.34,1.1,.64,1);
  --ease-out:cubic-bezier(0,0,.2,1);
  --dur-fast:120ms;
  --dur:200ms;
  --dur-slow:350ms;

  /* Layout */
  --topbar-h:56px;
  --sidebar-w:220px;
}

/* ── Light mode override ── */
@media(prefers-color-scheme:light){
  :root{
    --bg-base:#F0F4FF;--bg-surface:#FFFFFF;--bg-elevated:#F5F7FF;
    --bg-card:#FFFFFF;--bg-hover:#EEF2FF;--bg-input:#FFFFFF;
    --brd:#DDE3F7;--brd-hover:#BFC9F5;
    --txt:#0F172A;--txt-2:#4A5680;--txt-3:#8896CC;--txt-4:#C5CCDF;
    --shadow-s:0 1px 3px rgba(0,0,0,.07);
    --shadow-m:0 4px 16px rgba(0,0,0,.08);
  }
}

/* ── Reset ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;font-size:14px;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;
  background:var(--bg-base);color:var(--txt);line-height:1.55;
  min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;
}

/* ── Scrollbars ── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--brd-hover);border-radius:var(--r-full)}
::-webkit-scrollbar-thumb:hover{background:var(--txt-3)}

/* ══ TYPOGRAPHY ══ */
.t-xs{font-size:11px}.t-sm{font-size:12.5px}.t-base{font-size:14px}
.t-md{font-size:15px}.t-lg{font-size:17px}.t-xl{font-size:20px}
.t-2xl{font-size:24px}.t-3xl{font-size:30px}
.fw-4{font-weight:400}.fw-5{font-weight:500}.fw-6{font-weight:600}.fw-7{font-weight:700}
.t-muted{color:var(--txt-2)}.t-faint{color:var(--txt-3)}
.t-acc{color:var(--acc)}.t-ok{color:var(--ok)}.t-warn{color:var(--warn)}.t-err{color:var(--err)}
.truncate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.label-upper{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--txt-3)}

/* ══ LAYOUT ══ */
.layout{display:flex;min-height:100vh}
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;background:var(--bg-surface);
  border-right:1px solid var(--brd);
  position:fixed;left:0;top:0;bottom:0;z-index:200;
  display:flex;flex-direction:column;
  transition:transform var(--dur) var(--ease);
  overflow:hidden;
}
.sidebar.collapsed{transform:translateX(calc(-1 * var(--sidebar-w)))}
.content-wrap{
  flex:1;margin-left:var(--sidebar-w);display:flex;flex-direction:column;
  transition:margin-left var(--dur) var(--ease);min-height:100vh;
}
.content-wrap.full{margin-left:0}
.topbar{
  height:var(--topbar-h);background:var(--bg-surface);
  border-bottom:1px solid var(--brd);
  display:flex;align-items:center;gap:var(--gap-m);
  padding:0 var(--gap-l);
  position:sticky;top:0;z-index:150;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.page{padding:var(--gap-l);max-width:1200px;margin:0 auto;width:100%}

/* ══ SIDEBAR COMPONENTS ══ */
.sb-brand{
  padding:var(--gap-m) var(--gap-l);
  border-bottom:1px solid var(--brd);
  display:flex;align-items:center;gap:var(--gap-s);
  height:var(--topbar-h);flex-shrink:0;
}
.sb-logo{
  width:32px;height:32px;border-radius:var(--r-m);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:13px;color:#fff;flex-shrink:0;
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  box-shadow:var(--shadow-glow);
  transition:box-shadow var(--dur);
}
.sb-nav{flex:1;overflow-y:auto;padding:var(--gap-s) 0}
.sb-section{padding:var(--gap-s) var(--gap-l) 2px}
.sb-item{
  display:flex;align-items:center;gap:var(--gap-s);
  padding:7px var(--gap-m);margin:1px var(--gap-s);
  border-radius:var(--r-m);color:var(--txt-2);
  cursor:pointer;transition:all var(--dur-fast) var(--ease-out);
  font-size:13px;font-weight:500;position:relative;
  text-decoration:none;border:none;background:none;width:calc(100% - 16px);text-align:left;
}
.sb-item:hover{background:var(--bg-hover);color:var(--txt)}
.sb-item.active{background:var(--acc-glow);color:var(--acc)}
.sb-item.active::before{
  content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:60%;background:var(--acc);border-radius:0 3px 3px 0;
}
.sb-item i{font-size:16px;flex-shrink:0;transition:transform var(--dur-fast)}
.sb-item:hover i{transform:scale(1.05)}
.sb-badge{
  margin-left:auto;min-width:18px;height:18px;
  border-radius:var(--r-full);font-size:10px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  padding:0 5px;background:var(--err);color:#fff;
}
.sb-footer{
  padding:var(--gap-m) var(--gap-l);border-top:1px solid var(--brd);
  flex-shrink:0;
}
.sb-co-chip{
  display:flex;align-items:center;gap:var(--gap-s);
  padding:7px var(--gap-m);border-radius:var(--r-m);
  font-size:12px;font-weight:600;cursor:pointer;
  transition:all var(--dur-fast);border:1px solid transparent;
  width:100%;text-align:left;background:none;color:var(--txt-2);
}
.sb-co-chip:hover{background:var(--bg-hover);border-color:var(--brd)}
.sb-co-chip.active{border-color:var(--co,var(--acc));background:rgba(var(--co-r,79),var(--co-g,111),var(--co-b,255),.1);color:var(--co,var(--acc))}
.co-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.offline-pill{
  display:flex;align-items:center;gap:4px;padding:4px 8px;
  border-radius:var(--r-full);font-size:11px;font-weight:600;
  background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-brd);
  margin-top:var(--gap-s);
}

/* ══ BUTTONS ══ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:7px 14px;border-radius:var(--r-m);font-size:13px;font-weight:500;
  font-family:inherit;cursor:pointer;transition:all var(--dur-fast) var(--ease-out);
  border:1px solid transparent;white-space:nowrap;line-height:1;
  position:relative;overflow:hidden;
}
.btn::after{
  content:'';position:absolute;inset:0;opacity:0;
  background:rgba(255,255,255,.08);transition:opacity var(--dur-fast);
}
.btn:hover::after{opacity:1}
.btn:active{transform:scale(.97)}
.btn-ghost{background:none;border-color:var(--brd);color:var(--txt-2)}
.btn-ghost:hover{border-color:var(--brd-hover);color:var(--txt);background:var(--bg-hover)}
.btn-primary{background:var(--acc);color:#fff;border-color:var(--acc);box-shadow:0 0 16px var(--acc-glow)}
.btn-primary:hover{background:var(--acc-hover);box-shadow:0 0 24px var(--acc-glow)}
.btn-ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-brd)}
.btn-warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-brd)}
.btn-danger{background:var(--err-bg);color:var(--err);border-color:var(--err-brd)}
.btn-xs{padding:4px 8px;font-size:11px;border-radius:var(--r-s)}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-lg{padding:10px 20px;font-size:15px}
.btn-icon{width:32px;height:32px;padding:0;border-radius:var(--r-m)}
.btn-icon.sm{width:26px;height:26px;border-radius:var(--r-s)}

/* ══ CARDS ══ */
.card{
  background:var(--bg-card);border:1px solid var(--brd);
  border-radius:var(--r-l);transition:border-color var(--dur-fast),box-shadow var(--dur-fast);
}
.card:hover{border-color:var(--brd-hover)}
.card-p{padding:var(--gap-l)}
.card-hd{
  padding:var(--gap-m) var(--gap-l);border-bottom:1px solid var(--brd);
  display:flex;align-items:center;gap:var(--gap-s);
}
.card-title{font-size:13.5px;font-weight:600}
.card-interactive{cursor:pointer}
.card-interactive:hover{border-color:var(--acc);box-shadow:var(--shadow-glow);transform:translateY(-1px)}
.card-interactive:active{transform:translateY(0)}

/* ══ KPI CARDS ══ */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:var(--gap-m)}
.kpi-card{
  background:var(--bg-card);border:1px solid var(--brd);
  border-radius:var(--r-l);padding:var(--gap-l);
  display:flex;flex-direction:column;gap:var(--gap-xs);
  transition:all var(--dur-fast);cursor:default;position:relative;overflow:hidden;
}
.kpi-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--kpi-color,var(--acc));opacity:.8;
}
.kpi-card:hover{border-color:var(--kpi-color,var(--acc));transform:translateY(-2px);box-shadow:var(--shadow-m)}
.kpi-v{font-size:28px;font-weight:700;line-height:1;color:var(--kpi-color,var(--acc));
  font-variant-numeric:tabular-nums;}
.kpi-l{font-size:12px;color:var(--txt-2);margin-top:2px}
.kpi-d{font-size:11px;font-weight:500;display:flex;align-items:center;gap:3px;margin-top:4px}
.kpi-up{color:var(--ok)}.kpi-dn{color:var(--err)}.kpi-flat{color:var(--txt-3)}

/* ══ FORMS ══ */
.form-group{margin-bottom:var(--gap-m)}
.form-label{font-size:12px;font-weight:500;color:var(--txt-2);margin-bottom:5px;display:block}
.form-label .req{color:var(--err);margin-left:2px}
.form-inp{
  width:100%;padding:8px 11px;font-size:13px;font-family:inherit;
  background:var(--bg-input);color:var(--txt);
  border:1px solid var(--brd);border-radius:var(--r-m);
  transition:border-color var(--dur-fast),box-shadow var(--dur-fast);outline:none;
  line-height:1.4;
}
.form-inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-glow)}
.form-inp.err{border-color:var(--err);box-shadow:0 0 0 3px var(--err-bg)}
.form-inp.ok{border-color:var(--ok)}
.form-inp::placeholder{color:var(--txt-4)}
.form-grid{display:grid;gap:var(--gap-m)}
.fg2{grid-template-columns:1fr 1fr}
.fg3{grid-template-columns:1fr 1fr 1fr}
.form-err-msg{font-size:11px;color:var(--err);margin-top:4px;display:none}
.form-inp.err + .form-err-msg{display:block}
.select-wrap{position:relative}
.select-wrap::after{
  content:'\25BE';position:absolute;right:10px;top:50%;transform:translateY(-50%);
  color:var(--txt-3);pointer-events:none;font-size:12px;
}
.form-inp[type=range]{padding:0;height:4px;background:var(--brd-hover);cursor:pointer;accent-color:var(--acc)}

/* ══ BADGES & PILLS ══ */
.badge{
  display:inline-flex;align-items:center;gap:3px;
  padding:2px 8px;border-radius:var(--r-full);
  font-size:11px;font-weight:600;border:1px solid;
}
.badge-ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-brd)}
.badge-warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-brd)}
.badge-err{background:var(--err-bg);color:var(--err);border-color:var(--err-brd)}
.badge-info{background:var(--info-bg);color:var(--info);border-color:var(--info-brd)}
.badge-acc{background:var(--acc-glow);color:var(--acc);border-color:var(--brd-focus)}
.badge-muted{background:var(--bg-hover);color:var(--txt-3);border-color:var(--brd)}

/* ══ PROGRESS ══ */
.progress-track{background:var(--brd);border-radius:var(--r-full);overflow:hidden;height:5px}
.progress-fill{height:100%;border-radius:var(--r-full);transition:width .5s var(--ease)}
.progress-ring-svg{transform:rotate(-90deg)}
.progress-ring-bg{fill:none;stroke:var(--brd);stroke-width:5}
.progress-ring-fill{fill:none;stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .6s var(--ease)}

/* ══ SPARKLINE CHART ══ */
.sparkline{display:flex;align-items:flex-end;gap:2px;height:48px}
.sp-bar{
  border-radius:2px 2px 0 0;flex:1;min-width:6px;
  transition:height .4s var(--ease),opacity var(--dur-fast);
  cursor:pointer;opacity:.75;
}
.sp-bar:hover{opacity:1}
.sp-bar.current{opacity:1;position:relative}
.sp-labels{display:flex;justify-content:space-between;margin-top:4px}
.sp-label{font-size:9px;color:var(--txt-4);flex:1;text-align:center}

/* ══ ALERTS ══ */
.alert{
  display:flex;align-items:flex-start;gap:10px;padding:10px 14px;
  border-radius:var(--r-m);border:1px solid;font-size:12.5px;
  animation:fadeSlideIn var(--dur-slow) var(--ease) both;
}
.alert-ok{background:var(--ok-bg);border-color:var(--ok-brd);color:var(--ok)}
.alert-warn{background:var(--warn-bg);border-color:var(--warn-brd);color:var(--warn)}
.alert-err{background:var(--err-bg);border-color:var(--err-brd);color:var(--err)}
.alert-info{background:var(--info-bg);border-color:var(--info-brd);color:var(--info)}
.alert .alert-ico{font-size:16px;flex-shrink:0;margin-top:1px}
.alert .alert-body{flex:1;line-height:1.5}
.alert .alert-body strong{font-weight:600}

/* ══ TABLE ══ */
.tbl-wrap{overflow-x:auto;border-radius:var(--r-l);border:1px solid var(--brd)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:600px}
.tbl thead tr{background:var(--bg-elevated)}
.tbl th{
  padding:9px 12px;text-align:left;font-size:11px;font-weight:600;
  text-transform:uppercase;letter-spacing:.7px;color:var(--txt-3);
  border-bottom:1px solid var(--brd);white-space:nowrap;
  cursor:pointer;user-select:none;transition:color var(--dur-fast);
}
.tbl th:hover{color:var(--txt-2)}
.tbl th.sorted{color:var(--acc)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--brd);vertical-align:middle;color:var(--txt-2)}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--bg-hover);color:var(--txt)}
.tbl tr.clickable{cursor:pointer}

/* ══ MODAL ══ */
.modal-overlay{
  position:fixed;inset:0;background:rgba(7,9,26,.75);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  z-index:500;display:flex;align-items:center;justify-content:center;
  padding:var(--gap-l);animation:fadeIn var(--dur) both;
}
.modal-box{
  background:var(--bg-card);border:1px solid var(--brd);
  border-radius:var(--r-xl);width:min(600px,100%);max-height:92vh;
  overflow-y:auto;box-shadow:var(--shadow-l);
  animation:slideUp var(--dur-slow) var(--ease) both;
}
.modal-hd{
  display:flex;align-items:center;justify-content:space-between;
  padding:var(--gap-l) var(--gap-xl);border-bottom:1px solid var(--brd);
  position:sticky;top:0;background:var(--bg-card);z-index:1;
}
.modal-title{font-size:16px;font-weight:600}
.modal-body{padding:var(--gap-xl)}
.modal-foot{
  padding:var(--gap-m) var(--gap-xl);border-top:1px solid var(--brd);
  display:flex;gap:var(--gap-s);justify-content:flex-end;
  position:sticky;bottom:0;background:var(--bg-card);
}

/* ══ TOAST SYSTEM ══ */
#toasts{
  position:fixed;bottom:20px;right:20px;z-index:900;
  display:flex;flex-direction:column;gap:var(--gap-s);pointer-events:none;
}
.toast{
  background:var(--bg-elevated);border:1px solid var(--brd-hover);
  border-radius:var(--r-l);padding:10px 14px;
  display:flex;align-items:center;gap:var(--gap-s);
  font-size:13px;font-weight:500;color:var(--txt);
  box-shadow:var(--shadow-l);min-width:240px;max-width:340px;
  animation:slideInToast var(--dur-slow) var(--ease) both;
  pointer-events:auto;cursor:pointer;
}
.toast.removing{animation:fadeOut var(--dur) forwards}
.toast-ok{border-left:3px solid var(--ok)}
.toast-err{border-left:3px solid var(--err)}
.toast-warn{border-left:3px solid var(--warn)}
.toast-info{border-left:3px solid var(--info)}

/* ══ SKELETON LOADER ══ */
.skeleton{
  background:linear-gradient(90deg,var(--bg-elevated) 25%,var(--bg-hover) 50%,var(--bg-elevated) 75%);
  background-size:200% 100%;animation:shimmer 1.4s infinite;
  border-radius:var(--r-s);
}
.sk-h{height:16px;margin-bottom:8px}
.sk-sm{height:12px}
.sk-circle{border-radius:var(--r-full)}

/* ══ OFFLINE INDICATOR ══ */
#offline-banner{
  position:fixed;top:var(--topbar-h);left:0;right:0;z-index:400;
  background:var(--warn);color:#000;
  font-size:12px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:6px 12px;transform:translateY(-100%);transition:transform var(--dur);
}
#offline-banner.show{transform:translateY(0)}

/* ══ MAP MODULE ══ */
#leaflet-map{height:380px;border-radius:var(--r-l);overflow:hidden;border:1px solid var(--brd)}
.leaflet-container{background:var(--bg-base)!important}
.map-popup{font-family:inherit;font-size:12px}
.map-legend{
  position:absolute;bottom:12px;right:12px;z-index:500;
  background:var(--bg-card);border:1px solid var(--brd);
  border-radius:var(--r-m);padding:8px 10px;font-size:11px;
}

/* ══ FIELD WORKER CARD ══ */
.field-card{
  background:var(--bg-card);border:1px solid var(--brd);border-radius:var(--r-l);
  overflow:hidden;cursor:pointer;transition:all var(--dur-fast);
}
.field-card:hover{border-color:var(--acc);box-shadow:var(--shadow-glow)}
.field-card-head{
  background:linear-gradient(135deg,var(--co,var(--acc)) 0%,color-mix(in srgb,var(--co,var(--acc)) 60%,transparent) 100%);
  padding:var(--gap-m) var(--gap-l);
}

/* ══ SYNC STATUS ══ */
.sync-dot{
  width:8px;height:8px;border-radius:50%;flex-shrink:0;
  transition:background var(--dur);
}
.sync-dot.synced{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.sync-dot.pending{background:var(--warn);animation:pulse 1.5s infinite}
.sync-dot.error{background:var(--err)}
.sync-dot.offline{background:var(--txt-3)}

/* ══ ANIMATIONS ══ */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0;transform:translateX(20px)}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes fadeSlideIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideInToast{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes scaleIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes ripple{to{opacity:0;transform:scale(4)}}

/* ══ CONTACT CARDS ══ */
.cont-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:var(--gap-m)}
.cont-card{
  background:var(--bg-card);border:1px solid var(--brd);border-radius:var(--r-l);
  overflow:hidden;transition:all var(--dur-fast);cursor:pointer;position:relative;
}
.cont-card:hover{border-color:var(--brd-hover);transform:translateY(-2px);box-shadow:var(--shadow-m)}
.cont-card:active{transform:translateY(0)}
.cont-card-accent{height:3px}
.cont-avatar{
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:15px;flex-shrink:0;
  transition:transform var(--dur-fast);
}
.cont-card:hover .cont-avatar{transform:scale(1.05)}
.cont-field{display:flex;gap:6px;align-items:baseline;font-size:12px;color:var(--txt-2)}
.cont-field i{color:var(--txt-3);font-size:13px;flex-shrink:0}
.cont-actions-row{
  display:flex;border-top:1px solid var(--brd);
}
.cont-action-btn{
  flex:1;padding:8px;background:none;border:none;border-right:1px solid var(--brd);
  cursor:pointer;font-size:14px;color:var(--txt-3);
  transition:all var(--dur-fast);
}
.cont-action-btn:last-child{border-right:none}
.cont-action-btn:hover{background:var(--bg-hover);color:var(--txt)}

/* ══ PIPELINE ══ */
.pipeline-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:var(--gap-s)}
.pipe-col{background:var(--bg-elevated);border:1px solid var(--brd);border-radius:var(--r-l);overflow:hidden}
.pipe-col-hd{padding:8px 12px;border-bottom:1px solid var(--brd);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.pipe-col-body{padding:8px;min-height:60px}
.pipe-item{
  background:var(--bg-card);border:1px solid var(--brd);border-radius:var(--r-m);
  padding:8px 10px;margin-bottom:6px;font-size:12px;cursor:pointer;
  transition:all var(--dur-fast);
}
.pipe-item:hover{border-color:var(--acc);box-shadow:var(--shadow-glow)}

/* ══ SECTION HEADERS ══ */
.sec-hd{display:flex;align-items:center;gap:var(--gap-m);margin-bottom:var(--gap-l);flex-wrap:wrap}
.sec-title{font-size:18px;font-weight:600;display:flex;align-items:center;gap:var(--gap-s)}
.sec-title i{font-size:20px}

/* ══ TABS ══ */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--brd);margin-bottom:var(--gap-l);overflow-x:auto}
.tab-btn{
  padding:9px 16px;border:none;background:none;
  border-bottom:2px solid transparent;color:var(--txt-3);
  cursor:pointer;font-size:13px;font-weight:500;transition:all var(--dur-fast);
  white-space:nowrap;font-family:inherit;
}
.tab-btn:hover{color:var(--txt-2);background:var(--bg-hover)}
.tab-btn.active{color:var(--acc);border-bottom-color:var(--acc)}

/* ══ EMPTY STATE ══ */
.empty-state{
  text-align:center;padding:56px 20px;
  color:var(--txt-3);
}
.empty-state i{font-size:48px;display:block;margin-bottom:12px;opacity:.4}
.empty-state .es-title{font-size:15px;font-weight:600;color:var(--txt-2);margin-bottom:6px}
.empty-state .es-sub{font-size:13px;margin-bottom:20px}

/* ══ CHECKLIST ITEM ══ */
.check-item{
  display:flex;align-items:center;gap:var(--gap-s);padding:8px 12px;
  border-radius:var(--r-m);cursor:pointer;transition:background var(--dur-fast);
  user-select:none;
}
.check-item:hover{background:var(--bg-hover)}
.check-box{
  width:18px;height:18px;border-radius:var(--r-s);
  border:1.5px solid var(--brd-hover);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:all var(--dur-fast);font-size:11px;
}
.check-box.on{background:var(--acc);border-color:var(--acc);color:#fff}

/* ══ SEARCH BAR ══ */
.search-wrap{position:relative;display:flex;align-items:center}
.search-wrap i{position:absolute;left:10px;color:var(--txt-3);font-size:15px;pointer-events:none}
.search-inp{padding-left:34px!important}

/* ══ DROP ZONE ══ */
.drop-zone{
  border:2px dashed var(--brd-hover);border-radius:var(--r-xl);
  padding:36px 20px;text-align:center;cursor:pointer;
  transition:all var(--dur);background:var(--bg-elevated);
}
.drop-zone:hover,.drop-zone.dragging{
  border-color:var(--acc);background:var(--acc-glow);
}
.drop-zone i{font-size:36px;color:var(--txt-4);display:block;margin-bottom:10px;transition:color var(--dur-fast)}
.drop-zone:hover i{color:var(--acc)}

/* ══ OKR ══ */
.okr-card{background:var(--bg-card);border:1px solid var(--brd);border-radius:var(--r-l);overflow:hidden;margin-bottom:var(--gap-m)}
.okr-hd{padding:var(--gap-m) var(--gap-l);border-bottom:1px solid var(--brd);display:flex;align-items:flex-start;gap:var(--gap-s)}
.okr-pct{font-size:24px;font-weight:700;flex-shrink:0;font-variant-numeric:tabular-nums}
.okr-body{padding:var(--gap-m) var(--gap-l)}
.kr-row{display:flex;align-items:center;gap:var(--gap-s);padding:7px 0;border-bottom:1px solid var(--brd)}
.kr-row:last-child{border-bottom:none}
.kr-txt{flex:1;font-size:13px;transition:opacity var(--dur-fast)}
.kr-txt.done{text-decoration:line-through;opacity:.4}

/* ══ FIELD MODULE SPECIFICS ══ */
.gps-btn{
  display:flex;align-items:center;gap:var(--gap-s);padding:10px 16px;
  border-radius:var(--r-l);border:1px solid var(--brd);
  background:var(--bg-card);cursor:pointer;font-size:13px;font-weight:500;
  color:var(--txt-2);transition:all var(--dur-fast);width:100%;text-align:left;
}
.gps-btn:hover{border-color:var(--acc);color:var(--txt);background:var(--acc-glow)}
.gps-btn.locating{border-color:var(--warn);color:var(--warn);animation:pulse 1s infinite}
.gps-btn.located{border-color:var(--ok);color:var(--ok)}

/* ══ QUEUE INDICATOR ══ */
.queue-badge{
  position:fixed;bottom:20px;left:20px;z-index:400;
  background:var(--bg-card);border:1px solid var(--warn-brd);
  border-radius:var(--r-l);padding:10px 14px;
  display:none;align-items:center;gap:var(--gap-s);
  box-shadow:var(--shadow-m);font-size:12.5px;color:var(--warn);
  animation:slideUp var(--dur-slow) var(--ease) both;
}
.queue-badge.show{display:flex}

/* ══ BI DASHBOARD SPECIFICS ══ */
.bi-grid{display:grid;grid-template-columns:2fr 1fr;gap:var(--gap-m)}
.funnel-bar{display:flex;align-items:center;gap:var(--gap-m);margin-bottom:var(--gap-s)}
.funnel-fill{border-radius:var(--r-full);height:22px;transition:width .5s var(--ease);display:flex;align-items:center;padding:0 8px}
.funnel-fill span{font-size:11px;font-weight:600;color:#fff;white-space:nowrap}
.rep-row{display:flex;align-items:center;gap:var(--gap-m);padding:10px 0;border-bottom:1px solid var(--brd)}
.rep-row:last-child{border-bottom:none}
.rep-perf-bar{height:4px;background:var(--brd);border-radius:var(--r-full);overflow:hidden;flex:1}
.rep-perf-fill{height:100%;border-radius:var(--r-full);background:var(--acc);transition:width .5s var(--ease)}

/* ══ RESPONSIVE ══ */
@media(max-width:768px){
  .sidebar{transform:translateX(calc(-1 * var(--sidebar-w)))}
  .sidebar.mobile-open{transform:translateX(0)}
  .content-wrap{margin-left:0!important}
  .fg2,.fg3,.bi-grid,.kpi-grid{grid-template-columns:1fr}
  .kpi-grid{grid-template-columns:1fr 1fr}
  #leaflet-map{height:260px}
  .cont-grid{grid-template-columns:1fr}
  .page{padding:var(--gap-m)}
}
@media print{
  .sidebar,.topbar,.btn,.modal-overlay,#toasts,.queue-badge{display:none!important}
  .content-wrap{margin-left:0!important}
  .card,.kpi-card{box-shadow:none!important;border:1px solid #ccc!important}
}
</style>
</head>
<body>
<!-- Offline banner -->
<div id="offline-banner">
  <i class="ti ti-wifi-off"></i>
  Sin conexión — los datos se guardan localmente y se sincronizarán cuando vuelvas a estar en línea
</div>

<!-- Queue badge (pending offline ops) -->
<div class="queue-badge" id="queue-badge">
  <i class="ti ti-clock-upload" style="font-size:16px"></i>
  <span id="queue-count">0 cambios</span> pendientes de sincronizar
  <button onclick="syncQueue()" class="btn btn-sm btn-ghost" style="margin-left:4px">Sincronizar</button>
</div>

<!-- Toast container -->
<div id="toasts"></div>

<!-- Modal container -->
<div id="modal-root"></div>

<!-- App layout -->
<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand">
      <div class="sb-logo" id="sb-logo">GE</div>
      <div>
        <div class="fw-6 t-md">GE Hub Pro</div>
        <div class="t-xs t-muted" id="sb-co-name">Hemocura</div>
      </div>
    </div>

    <div style="padding:8px 12px 4px">
      <div class="search-wrap">
        <i class="ti ti-search"></i>
        <input class="form-inp search-inp" placeholder="Buscar módulo..." oninput="filterNav(this.value)" style="padding-top:6px;padding-bottom:6px">
      </div>
    </div>

    <nav class="sb-nav" id="sb-nav">
      <div class="sb-section label-upper" style="padding-top:10px">Principal</div>
      <button class="sb-item" data-view="dashboard"><i class="ti ti-layout-dashboard"></i>Dashboard BI</button>
      <button class="sb-item" data-view="campo"><i class="ti ti-map-2"></i>Campo & Rutas</button>
      <button class="sb-item" data-view="contactos"><i class="ti ti-address-book"></i>Contactos</button>

      <div class="sb-section label-upper">Gestión</div>
      <button class="sb-item" data-view="okr"><i class="ti ti-target"></i>OKRs & Metas</button>
      <button class="sb-item" data-view="tareas"><i class="ti ti-clipboard-list"></i>Pendientes</button>
      <button class="sb-item" data-view="prospectos"><i class="ti ti-users"></i>CRM Pipeline</button>
      <button class="sb-item" data-view="procesos"><i class="ti ti-settings-2"></i>Procesos <span id="nb-proc" class="sb-badge" style="display:none"></span></button>

      <div class="sb-section label-upper">Análisis</div>
      <button class="sb-item" data-view="reportes"><i class="ti ti-report"></i>Reportes</button>
      <button class="sb-item" data-view="encuestas"><i class="ti ti-star"></i>Encuestas</button>
      <button class="sb-item" data-view="competencia"><i class="ti ti-sword"></i>Competencia</button>

      <div class="sb-section label-upper">Datos</div>
      <button class="sb-item" data-view="ocr"><i class="ti ti-scan"></i>OCR / IA</button>
      <button class="sb-item" data-view="importar"><i class="ti ti-file-import"></i>Importar</button>
      <button class="sb-item" data-view="sync"><i class="ti ti-cloud"></i>Sincronizar</button>
    </nav>

    <!-- Company selector -->
    <div class="sb-footer">
      <div class="label-upper" style="margin-bottom:8px;padding-left:4px">Empresa activa</div>
      <div id="co-selector"></div>
      <div class="sync-status-row" style="display:flex;align-items:center;gap:8px;margin-top:8px;padding:6px 8px;background:var(--bg-elevated);border-radius:var(--r-m)">
        <div class="sync-dot synced" id="sync-dot"></div>
        <span class="t-xs t-muted" id="sync-label">Al día</span>
        <button onclick="gistSyncUp()" class="btn btn-xs btn-ghost" style="margin-left:auto;padding:2px 6px" title="Subir datos">
          <i class="ti ti-cloud-upload" style="font-size:13px"></i>
        </button>
      </div>
    </div>
  </aside>

  <!-- CONTENT -->
  <div class="content-wrap" id="content-wrap">

    <!-- TOPBAR -->
    <header class="topbar">
      <button onclick="toggleSidebar()" class="btn btn-icon btn-ghost">
        <i class="ti ti-menu-2" style="font-size:18px"></i>
      </button>

      <div style="flex:1;display:flex;align-items:center;gap:8px">
        <span id="topbar-title" class="fw-6 t-md"></span>
        <span id="topbar-co-badge" class="badge badge-acc t-xs" style="display:none"></span>
      </div>

      <!-- Global actions -->
      <div style="display:flex;align-items:center;gap:6px">
        <button onclick="openGlobalSearch()" class="btn btn-icon btn-ghost" title="Buscar (Ctrl+K)">
          <i class="ti ti-search" style="font-size:17px"></i>
        </button>
        <button onclick="gistSyncDown()" class="btn btn-icon btn-ghost" id="sync-down-btn" title="Descargar datos">
          <i class="ti ti-cloud-download" style="font-size:17px"></i>
        </button>
        <button onclick="set({view:'sync'})" class="btn btn-icon btn-ghost" title="Sync Gist">
          <i class="ti ti-cloud" style="font-size:17px"></i>
        </button>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main id="main" class="page"></main>
  </div>
</div>

<script>
